<style>
/* ---------- THE DESK ----------
   A control room, not a dashboard. The first question it answers is "what
   needs me today?" — so Action Required sits ABOVE the numbers, not below a
   graph. A shirtmaker opening this at ten in the morning wants a list of
   things to do, and the numbers only to confirm the day is going well.

   SIZES HERE ARE NECK SIZES — 39/40/42/44/46 — and 41/43/45 are the three the
   house does not cut. Nothing says S, M or L, because this shop does not sell
   them and the uncut necks are the whole bespoke argument.

   It borrows the site's own type, hairlines and spacing scale on purpose. The
   house should not feel like it is leaving its own shop to run its own shop. */

body{overflow-x:hidden;background:var(--under)}
.shell{display:grid;grid-template-columns:1fr;min-height:100svh}
@media(min-width:1000px){.shell{grid-template-columns:15.5rem 1fr}}

/* ---------- the sidebar ----------
   Dark, against a light workspace. It is the one place in this project that
   does not borrow the shop's cream, and deliberately: the desk is behind the
   shop, not part of it, and a dark rail makes that obvious the moment it opens.
   The wordmark sits at the top so the house knows whose books these are. */
.side{background:#141210;color:#E8E4DC;padding:var(--s4) var(--s3);display:none}
@media(min-width:1000px){.side{display:flex;flex-direction:column;
  position:sticky;top:0;height:100svh;overflow-y:auto}}
.brand{padding:var(--s2) var(--s2) var(--s5)}
.brand b{display:block;font-weight:300;font-size:1.05rem;letter-spacing:.16em}
.brand span{font-family:var(--mono);font-size:.5rem;letter-spacing:.34em;
  color:rgba(232,228,220,.5)}
.side h2{font-family:var(--mono);font-size:.5rem;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(232,228,220,.38);font-weight:400;
  margin:var(--s4) var(--s2) var(--s1)}
.nav-item{display:flex;align-items:center;gap:var(--s2);width:100%;
  text-align:left;padding:var(--s2);font-size:.9375rem;
  color:rgba(232,228,220,.72);cursor:pointer;background:none;border:0;
  border-radius:.4rem;transition:background-color .2s,color .2s}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item[aria-current="true"]{background:rgba(255,255,255,.09);color:#fff}
.nav-item svg{width:1.05rem;height:1.05rem;flex:0 0 auto;stroke:currentColor;
  fill:none;stroke-width:1.4}
.nav-item .pip{margin-left:auto;font-family:var(--mono);font-size:.625rem;
  min-width:1.35rem;height:1.35rem;display:grid;place-items:center;
  border-radius:1rem;background:var(--claret);color:#fff}
.nav-item .pip:empty{display:none}
.whoami{margin-top:auto;padding:var(--s3) var(--s2) 0;
  border-top:1px solid rgba(255,255,255,.1);display:grid;gap:var(--s0)}
.whoami b{font-weight:400;font-size:.875rem}
.whoami a{font-family:var(--mono);font-size:.5625rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(232,228,220,.5)}

/* a phone gets a scrolling rail */
.rail{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;
  padding:var(--s2) var(--gut);border-bottom:1px solid var(--hair);
  position:sticky;top:0;z-index:20;background:#141210}
.rail::-webkit-scrollbar{display:none}
.rail .nav-item{width:auto;flex:0 0 auto;padding:var(--s1) var(--s3);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;
  text-transform:uppercase;border-radius:2rem}
.rail .nav-item svg{display:none}
@media(min-width:1000px){.rail{display:none}}

.work{padding:var(--s5) var(--gut) var(--sz);min-width:0;background:var(--under)}
.work h1{font-weight:300;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.02em;
  margin:0}
.sub{margin:var(--s0) 0 0;color:var(--muted);font-size:.9375rem}
.eyebrow{font-family:var(--mono);font-size:.5625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin:0}
.topbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:flex-start;
  justify-content:space-between;margin:0 0 var(--s4)}

/* ---------- cards ---------- */
.card{background:var(--room);border:1px solid var(--hair);border-radius:.5rem;
  padding:var(--s3)}
.grid-3{display:grid;gap:var(--s2);grid-template-columns:1fr}
@media(min-width:1100px){.grid-3{grid-template-columns:1.35fr .9fr .95fr}}
.grid-2{display:grid;gap:var(--s2);grid-template-columns:1fr;margin-top:var(--s2)}
@media(min-width:1100px){.grid-2{grid-template-columns:1.1fr .9fr}}
.card h3{margin:0 0 var(--s3);font-size:1rem;font-weight:400;letter-spacing:-.01em}
.card h3 .more{float:right;font-family:var(--mono);font-size:.5625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer}

/* the eight numbers */
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);
  margin:0 0 var(--s2)}
@media(min-width:760px){.figs{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1500px){.figs{grid-template-columns:repeat(8,1fr)}}
.fig-box{background:var(--room);border:1px solid var(--hair);border-radius:.5rem;
  padding:var(--s3);display:grid;gap:var(--s1)}
.fig-ic{width:2rem;height:2rem;border-radius:50%;background:var(--under);
  display:grid;place-items:center}
.fig-ic svg{width:1rem;height:1rem;stroke:var(--ink);fill:none;stroke-width:1.4}
.fig-box .lab{font-size:.8125rem;color:var(--muted)}
.fig-box b{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:1.5rem;font-weight:400;line-height:1.1}
.delta{font-family:var(--mono);font-size:.6875rem}
.delta.up{color:#3F6B45}
.delta.down{color:var(--claret)}
.delta.flat{color:var(--muted)}
.fig-box.warn b{color:var(--claret)}
.fig-box .warn-note{font-family:var(--mono);font-size:.5625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--claret)}

/* ---------- the revenue line ----------
   Drawn as inline SVG rather than pulling in a charting library. The whole site
   has no dependencies and one graph is not a reason to start. */
.chart{width:100%;height:13rem;display:block;overflow:visible}
.chart .area{fill:var(--under)}
.chart .line{fill:none;stroke:var(--ink);stroke-width:1.5;
  stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--ink)}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart text{font-family:var(--mono);font-size:8px;fill:var(--muted)}
.ranges{display:flex;gap:var(--s0);float:right}
.range{font-family:var(--mono);font-size:.5625rem;letter-spacing:.12em;
  text-transform:uppercase;padding:var(--s0) var(--s2);border-radius:.3rem;
  border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
.range[aria-pressed="true"]{background:var(--ink);color:var(--room)}

/* ---------- the pipeline ---------- */
.pipe{display:flex;justify-content:space-between;gap:var(--s1);text-align:center}
.pipe div{flex:1;min-width:0}
.pipe .ring{width:2.2rem;height:2.2rem;margin:0 auto var(--s1);border-radius:50%;
  background:var(--under);display:grid;place-items:center;
  font-family:var(--mono);font-size:.6875rem}
.pipe .nm{font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);display:block}
.pipe b{font-family:var(--mono);font-size:1.1rem;font-weight:400}

/* ---------- action required ---------- */
.todo{display:grid;gap:var(--s2)}
.todo button{display:flex;align-items:center;gap:var(--s2);width:100%;
  text-align:left;background:none;border:0;cursor:pointer;padding:var(--s1) 0}
.todo button:hover .what{text-decoration:underline;text-underline-offset:3px}
.todo .ic{width:2rem;height:2rem;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-family:var(--mono);font-size:.6875rem}
.todo .ic.red{background:#F3E3E3;color:#8C2F2F}
.todo .ic.amber{background:#F6EEDC;color:#8A6A18}
.todo .ic.green{background:#E6EDE4;color:#3F6B45}
.todo .what{display:grid;line-height:1.3}
.todo .what b{font-weight:400;font-size:.9375rem}
.todo .what span{font-size:.8125rem;color:var(--muted)}
.todo .clear{margin:0;color:var(--muted);font-size:.9375rem}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:.9375rem}
.scroll{overflow-x:auto}
th{text-align:left;font-family:var(--mono);font-size:.5625rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:400;white-space:nowrap;
  padding:0 var(--s2) var(--s2) 0;border-bottom:1px solid var(--hair)}
td{padding:var(--s2) var(--s2) var(--s2) 0;border-bottom:1px solid var(--hair);
  vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.low{color:#8A6A18}
td.out{color:var(--claret)}
.sw{width:1.4rem;height:1.4rem;display:inline-block;vertical-align:middle;
  border-radius:.2rem;background:var(--g,#888)}
.tag{font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;
  text-transform:uppercase;padding:2px var(--s1);border-radius:.25rem;
  background:var(--under);white-space:nowrap}
.tag.new{background:#EDEAE4}
.tag.making{background:#F6EEDC;color:#8A6A18}
.tag.packed{background:#E7EBF2;color:#3A4A6B}
.tag.shipped{background:#E6EDE4;color:#3F6B45}
.tag.delivered{background:#E6EDE4;color:#3F6B45}
.tag.cancelled{background:#F3E3E3;color:#8C2F2F}

/* ---------- the gate ---------- */
.gate{max-width:24rem;margin:var(--sy) auto;display:grid;gap:var(--s3)}
.gate p{margin:0;color:var(--muted);font-size:.9375rem;line-height:1.6}
.f{display:grid;gap:var(--s0);margin:0}
.f label{font-size:.8125rem;color:var(--muted)}
.f input,.f select{width:100%;background:var(--room);border:1px solid var(--hair);
  padding:0 var(--s2);min-height:2.875rem;font-size:1rem;color:var(--ink);
  border-radius:.4rem}
.f input:focus,.f select:focus{outline:0;border-color:var(--ink)}
.btn{border:1px solid currentColor;background:none;padding:var(--s3) var(--s5);
  font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase;cursor:pointer;border-radius:.4rem;
  transition:background-color .35s var(--settle),color .35s var(--settle)}
.btn:hover{background:var(--ink);color:var(--room)}
.btn.small{padding:var(--s1) var(--s3);font-size:.5625rem;letter-spacing:.14em}
.note{margin:0;font-size:.8125rem;line-height:1.6}
.note.bad{color:var(--claret)}

input.cell{width:5.5rem;background:var(--room);border:1px solid var(--hair);
  padding:var(--s1);font-family:var(--mono);font-size:.8125rem;color:var(--ink);
  border-radius:.3rem}
input.cell:focus{outline:0;border-color:var(--ink)}
input.cell.saved{border-color:var(--ink);background:var(--under)}
/* A save that failed has to look different from one that worked. Before this
   the field simply did not flash, which is indistinguishable from not having
   looked at it. */
input.cell.failed,select.cell.failed{border-color:#8C2F2F;background:#F6ECEC}

/* a name you can click. A button, because it acts rather than navigates. */
.linky{appearance:none;background:none;border:0;padding:0;font:inherit;
  color:inherit;cursor:pointer;text-align:left;
  text-decoration:underline;text-decoration-color:var(--hair);
  text-underline-offset:3px}
.linky:hover{text-decoration-color:currentColor}

/* the toast, for the reason itself */
.toast{position:fixed;left:50%;bottom:var(--s4);transform:translateX(-50%);
  z-index:90;max-width:min(34rem,calc(100vw - var(--s5)));
  background:var(--ink);color:var(--room);padding:var(--s3) var(--s4);
  border-radius:.4rem;font-size:.875rem;line-height:1.5;
  box-shadow:0 .5rem 2rem rgba(0,0,0,.25);
  opacity:0;pointer-events:none;transition:opacity .3s var(--settle)}
.toast.on{opacity:1}
.toast.bad{background:#8C2F2F}
/* input.cell is (0,1,1) and .wide alone is (0,1,0), so for six years every
   field carrying `class="cell wide"` has quietly stayed 5.5rem — the whole
   cloth editor, the menu label and href, the collection blurb, the banner
   heading, the image description, the announcement. A URL in an 88px box.
   The element selectors here are what make the rule actually win. */
.wide,input.cell.wide,select.cell.wide,textarea.cell.wide{width:100%;max-width:22rem}
/* In a table cell, width:100% resolves against a column that is sizing itself
   from its content — so the field collapses to the width of its placeholder.
   A min-width gives the column something real to size from. */
td .cell.wide{min-width:13rem}
select.cell{background:var(--room);border:1px solid var(--hair);padding:var(--s1);
  font-family:var(--mono);font-size:.75rem;color:var(--ink);border-radius:.3rem}
.tick{display:inline-flex;align-items:center;gap:var(--s1);cursor:pointer;
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase}
.tick input{width:1.1rem;height:1.1rem}
/* the default checkbox is system blue, which is the one colour the house does
   not own — accent-color tints it without rebuilding the control */
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
.empty{padding:var(--s5) 0;color:var(--muted);max-width:52ch;line-height:1.6}
.hint{margin:0 0 var(--s3);color:var(--muted);font-size:.875rem;line-height:1.6;
  max-width:62ch}
.stock-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s1)}
.stock-grid label{display:grid;gap:var(--s0);font-family:var(--mono);
  font-size:.5625rem;letter-spacing:.12em;color:var(--muted)}
.stock-grid input{width:100%;background:var(--room);border:1px solid var(--hair);
  padding:var(--s1);font-family:var(--mono);font-size:.8125rem;color:var(--ink);
  text-align:center;border-radius:.3rem}
.stock-grid input.zero{border-color:var(--claret);color:var(--claret)}
.stock-grid input.low{border-color:#8A6A18}
.filters{display:flex;flex-wrap:wrap;gap:var(--s1);margin:0 0 var(--s4)}
/* ---------- the toolbar above a list ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:var(--s1);margin:0 0 var(--s3)}
.tab{font-family:var(--mono);font-size:.5625rem;letter-spacing:.14em;
  text-transform:uppercase;padding:var(--s2) var(--s3);border-radius:.4rem;
  border:1px solid var(--hair);background:var(--room);cursor:pointer;
  color:var(--muted);display:inline-flex;gap:var(--s1);align-items:center}
.tab b{font-weight:400;color:var(--ink)}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;
  margin:0 0 var(--s3)}
.search{flex:1;min-width:14rem;position:relative}
.search input{width:100%;background:var(--room);border:1px solid var(--hair);
  border-radius:.4rem;padding:0 var(--s3);min-height:2.5rem;font-size:.9375rem;
  color:var(--ink)}
.search input:focus{outline:0;border-color:var(--ink)}
/* a toggle button is pressed, not selected — aria-selected belongs to a real
   tablist, and these are plain buttons that filter a table */
.tab[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

/* ---------- the comparison chart ----------
   "Then" is dashed and thin; "now" is solid. Both share one scale, because two
   revenue lines on two axes can be made to tell any story you like. */
.chart .line.was{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.75}
.legend2{display:flex;gap:var(--s3);margin:var(--s2) 0 0;font-family:var(--mono);
  font-size:.5625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:var(--s1)}
.legend2 span::before{content:'';width:1.1rem;height:0;border-top:2px solid var(--ink)}
.legend2 .then::before{border-top:1px dashed var(--muted)}
.card h3 .more{cursor:default}
.card h3 .more[data-go]{cursor:pointer}
.sub-h{margin:var(--s4) 0 var(--s2);font-size:.8125rem;font-weight:400;
  color:var(--muted)}
.ranges{display:flex;gap:var(--s1);flex-wrap:wrap}

/* ---------- reports ---------- */
.rep{display:grid;gap:var(--s2);grid-template-columns:1fr;align-items:start;
  margin-top:var(--s2)}
@media (min-width:60rem){.rep{grid-template-columns:15rem minmax(0,1fr)}}
.rep-side{display:grid;gap:var(--s0);align-content:start}
.rep-side button{text-align:left;background:none;border:1px solid transparent;
  border-radius:.4rem;padding:var(--s2) var(--s3);cursor:pointer;color:var(--ink);
  font:inherit;display:grid;gap:1px}
.rep-side button span{font-size:.75rem;color:var(--muted);line-height:1.35}
.rep-side button:hover{border-color:var(--hair)}
.rep-side button[aria-current="true"]{background:var(--under);border-color:var(--hair)}

/* ---------- marketing ---------- */
.tag.active,.tag.ready,.tag.done{background:#E6EDE4;color:#3F6B45}
.grid-2 + .scroll{margin-top:var(--s2)}
.tag.scheduled{background:#E7EBF2;color:#3A4A6B}
.tag.expired,.tag.cold{background:#F3E3E3;color:#8C2F2F}
.tag.draft{background:#EDEAE4;color:var(--muted)}
tr.done td{opacity:.5}
.btn.danger{color:var(--claret)}
.btn.danger:hover{background:var(--claret);color:var(--room)}

/* the ring of channels. One circle per slice, rotated so the first begins at
   twelve o'clock rather than three. */
.chan{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:center}
.donut{width:8.75rem;height:8.75rem;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.legend li{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);
  align-items:center;font-size:.875rem}
.legend i{width:.5rem;height:.5rem;border-radius:50%}
.legend .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
@media (max-width:40rem){.chan{grid-template-columns:1fr;justify-items:center}}

.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);
  margin:0 0 var(--s3)}
.mini b{display:block;font-family:var(--mono);font-size:1.375rem;font-weight:400;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini span{font-size:.8125rem;color:var(--muted);line-height:1.4}

.quick{display:grid;gap:var(--s1);margin-top:var(--s3)}
.quick button{text-align:left;background:none;border:1px solid var(--hair);
  border-radius:.4rem;padding:var(--s3);cursor:pointer;display:grid;
  gap:var(--s0);color:var(--ink);font:inherit}
.quick button:hover{border-color:var(--ink)}
.quick b{font-weight:400}
.quick span{font-size:.8125rem;color:var(--muted)}

/* ---------- the two-column make-a-thing screens ---------- */
.grid-side{display:grid;gap:var(--s2);grid-template-columns:1fr;
  align-items:start;margin-top:var(--s2)}
@media (min-width:60rem){.grid-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

.f2{display:grid;gap:var(--s4)}
.f2 p{margin:0;display:grid;gap:var(--s1)}
/* a class that sets display beats the browser's own [hidden] rule, so hiding a
   field by setting .hidden would otherwise do nothing at all */
.f2 p[hidden]{display:none}
/* a hint is a sentence, not a stack — left alone it stretches any button
   inside it across the whole column */
.f2 p.hint{display:block}
.f2 label,.f2 legend{font-size:.8125rem;color:var(--muted);padding:0}
/* text fields only. Without the :not() a checkbox inherits width:100% and a
   2.75rem min-height and renders as a large square box beside its label. */
.f2 input:not([type=checkbox]):not([type=radio]),
.f2 select,.f2 textarea{background:var(--room);border:1px solid var(--hair);
  border-radius:.4rem;padding:var(--s2) var(--s3);min-height:2.75rem;
  font:inherit;font-size:.9375rem;color:var(--ink);width:100%}
.f2 textarea{min-height:8rem;line-height:1.6;resize:vertical}
.f2 input:focus,.f2 select:focus,.f2 textarea:focus{outline:0;border-color:var(--ink)}
.f2 input[readonly]{background:var(--under);color:var(--muted)}
.f2 fieldset{border:0;padding:0;margin:0;display:grid;gap:var(--s2)}
.pair{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media (min-width:34rem){.pair{grid-template-columns:1fr 1fr}}

.picks{display:grid;gap:var(--s1);grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.picks.stack{grid-template-columns:1fr}
.pick{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s3);
  border:1px solid var(--hair);border-radius:.4rem;cursor:pointer}
.pick:has(input:checked){border-color:var(--ink);background:var(--under)}

  /* ---------- dashboard ----------
     Laid out as the house asked for it: the eight numbers, the revenue line,
     the pipeline, what needs doing, and then the two tables a shirt shop
     actually reads — what is selling, and which necks have run out.

     The sizes across the stock table are NECK sizes. A shirt shop can hold
     fifty units of a cloth and be unable to sell one, because the necks people
     take are the ones that are gone. */

  var CHART_RANGE = 'today';

  function pct(now, then) {
    now = Number(now || 0); then = Number(then || 0);
    if (!then) return now ? null : 0;          /* null = no base to compare to */
    return Math.round((now - then) / then * 1000) / 10;
  }
  /* The window being compared against has to be NAMED. This said "vs yesterday"
     wherever it was used, so the analytics screen — which compares thirty days
     against the thirty before them — was labelling a monthly movement as a
     daily one. A number is only as good as the period under it. */
  function deltaHTML(d, against) {
    against = against || 'yesterday';
    if (d === null) return '<span class="delta flat">no figure for ' + against + '</span>';
    if (!d) return '<span class="delta flat">level with ' + against + '</span>';
    return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' +
      (d > 0 ? '↑' : '↓') + ' ' + Math.abs(d) + '% vs ' + against + '</span>';
  }

  var FIG_IC = {
    money:'M12 3v18M8 7h6a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h7',
    cart:'M4 5h2l2.4 10.2a1 1 0 0 0 1 .8h7.8a1 1 0 0 0 1-.8L20 8H7M10 20a1 1 0 1 0 0-2 1 1 0 0 0 0 2m8 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2',
    tag:'M3 12V4h8l9 9-8 8-9-9ZM7.5 7.5h.01',
    shirt:'M8 3 4 5.5V10h3v11h10V10h3V5.5L16 3a4 4 0 0 1-8 0Z',
    clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18ZM12 7v5l3 2',
    alert:'M12 3 2 20h20L12 3ZM12 10v4M12 17h.01',
    back:'M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3',
    rise:'M3 17l6-6 4 4 7-7M17 8h4v4',
    customers:'M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20M9.5 10.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M21 20v-1.5a4 4 0 0 0-3-3.9'
  };
  /* Two icon sets exist — one for the sidebar, one for the figures — and asking
     the wrong one drew a literal path of "undefined", which the browser throws
     away silently, leaving an empty circle. So try the figure set, then the
     sidebar set, then a dot: a figure can never render blank again, and the
     obvious key is always the right key. */
  function figIcon(k) {
    return '<span class="fig-ic"><svg viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="' + (FIG_IC[k] || ICON[k] || 'M12 12h.01') + '"/></svg></span>';
  }

  /* An inline SVG line. No chart library: the whole project has no
     dependencies and one graph is not a reason to start. */
  function chart(rows) {
    if (!rows || !rows.length) return '<p class="empty">Nothing to draw yet.</p>';
    var W = 640, H = 180, P = 26;
    var vals = rows.map(function (r) { return Number(r.value) || 0; });
    var top = Math.max.apply(null, vals) || 1;
    var x = function (i) {
      return P + (rows.length === 1 ? 0 : i * (W - P * 2) / (rows.length - 1));
    };
    var y = function (v) { return H - P - (v / top) * (H - P * 2); };
    var pts = rows.map(function (r, i) { return x(i) + ',' + y(vals[i]); });
    var area = 'M' + x(0) + ',' + (H - P) + ' L' + pts.join(' L') +
               ' L' + x(rows.length - 1) + ',' + (H - P) + ' Z';
    var every = Math.ceil(rows.length / 6);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="none" role="img" aria-label="Revenue over time">' +
      [0, 0.5, 1].map(function (f) {
        var yy = P + f * (H - P * 2);
        return '<line class="grid" x1="' + P + '" y1="' + yy + '" x2="' +
          (W - P) + '" y2="' + yy + '"/>';
      }).join('') +
      '<path class="area" d="' + area + '"/>' +
      '<polyline class="line" points="' + pts.join(' ') + '"/>' +
      rows.map(function (r, i) {
        return (i % every === 0 || i === rows.length - 1)
          ? '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' +
            esc(r.label) + '</text>'
          : '';
      }).join('') +
      '<circle class="dot" cx="' + x(rows.length - 1) + '" cy="' +
        y(vals[vals.length - 1]) + '" r="3"/>' +
      '</svg>';
  }

      var recentHTML = recent.length

  /* ---------- orders ----------
     The most-used screen in the desk, so it is built for repetition: filter,
     find, open, move it along, close, next. The order opens as a panel over
     the list rather than a page of its own — packing is a rhythm, and a page
     navigation between each one loses both the scroll position and the thread. */

  var FLOW = ['new','making','packed','shipped','delivered','cancelled'];
  var ofilter = 'all', ofind = '', opage = 0, OSIZE = 10;

  function stageTag(st) {
    return '<span class="tag ' + esc(st) + '">' + esc(st) + '</span>';

  function thumbFor(slug) {
    return slug ? 'images/set/' + slug + '/1-hero-t.webp' : '';
  }

  function orders() {
    Promise.all([
      A.ordersPage({ status: ofilter, find: ofind, page: opage, size: OSIZE }),
      A.pipeline().catch(function () { return []; })
    ]).then(function (r) {
      var rows = r[0].rows || [], total = r[0].total || 0, pipe = r[1] || [];
      var counts = {};
      pipe.forEach(function (p) { counts[p.stage] = p.n; });
      var all = pipe.reduce(function (a, p) { return a + p.n; }, 0);

      var tabs = [['all','All orders',all]].concat(FLOW.map(function (f) {
        return [f, f, counts[f] || 0];
      })).map(function (t) {
        return '<button class="tab" data-of="' + t[0] + '" aria-selected="' +
          (ofilter === t[0]) + '">' + esc(t[1]) + ' <b>' + t[2] + '</b></button>';
      }).join('');

      var pages = Math.max(1, Math.ceil(total / OSIZE));
      var pager = '<div class="pager"><span class="n">' +
        (total ? 'Showing ' + (opage * OSIZE + 1) + ' to ' +
          Math.min((opage + 1) * OSIZE, total) + ' of ' + total : 'None') +
        '</span><span class="pages">' +
        '<button data-page="' + (opage - 1) + '"' + (opage === 0 ? ' disabled' : '') +
          '>&lsaquo;</button>' +
        Array.apply(null, { length: Math.min(pages, 6) }).map(function (_, i) {
          return '<button data-page="' + i + '" aria-current="' + (i === opage) +
            '">' + (i + 1) + '</button>';
        }).join('') +
        '<button data-page="' + (opage + 1) + '"' +
          (opage >= pages - 1 ? ' disabled' : '') + '>&rsaquo;</button>' +
        '</span></div>';

      body(

        '<div class="toolbar"><span class="search">' +

  /* ---------- analytics ---------- */

  /* Two lines on one grid: this window, and the same window before it. The
     comparison IS the information — ₹1,24,000 means nothing without the
     ₹98,000 it beat, and a single line invites the house to read noise as a
     trend. Dashed for "then", solid for "now", and no second axis: two revenue
     lines share one scale or they are not comparable. */
  function chart2(rows, key, prevKey, label) {
    if (!rows || !rows.length) return '<p class="empty">Nothing to draw yet.</p>';
    var W = 640, H = 190, P = 26;
    var now = rows.map(function (r) { return Number(r[key]) || 0; });
    var was = rows.map(function (r) { return Number(r[prevKey]) || 0; });
    var top = Math.max.apply(null, now.concat(was)) || 1;
    var x = function (i) {
      return P + (rows.length === 1 ? 0 : i * (W - P * 2) / (rows.length - 1));
    };
    var y = function (v) { return H - P - (v / top) * (H - P * 2); };
    var line = function (a) {
      return a.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
    };
    var pts = line(now);
    var area = 'M' + x(0) + ',' + (H - P) + ' L' + pts.split(' ').join(' L') +
               ' L' + x(rows.length - 1) + ',' + (H - P) + ' Z';
    var every = Math.ceil(rows.length / 6);
    var anyPrev = was.some(function (v) { return v > 0; });

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
      [0, 0.5, 1].map(function (f) {
        var yy = P + f * (H - P * 2);
        return '<line class="grid" x1="' + P + '" y1="' + yy + '" x2="' +
          (W - P) + '" y2="' + yy + '"/>';
      }).join('') +
      '<path class="area" d="' + area + '"/>' +
      (anyPrev ? '<polyline class="line was" points="' + line(was) + '"/>' : '') +
      '<polyline class="line" points="' + pts + '"/>' +
      rows.map(function (r, i) {
        return (i % every === 0 || i === rows.length - 1)
          ? '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' +
            esc(r.label) + '</text>'
          : '';
      }).join('') +
      '<circle class="dot" cx="' + x(rows.length - 1) + '" cy="' +
        y(now[now.length - 1]) + '" r="3"/>' +
      '</svg>' +
      '<p class="legend2"><span class="now">This period</span>' +
      (anyPrev ? '<span class="then">Previous period</span>'
               : '<span class="muted">nothing to compare with yet</span>') + '</p>';
  }

  /* ---------- analytics ----------
     The mockup asked for six figures, two comparison lines, a channel ring,
     best sellers, campaign performance and customer insight. All of it is here
     except a payment-method split, which cannot be honest until there is a
     payment gateway — every order is 'prepaid' by default today, and a pie of
     UPI against cards would be a drawing, not a measurement. */

  var A_RANGE = '30d';

  function analytics() {
    Promise.all([
      A.aKpis(), A.aSeries(A_RANGE), A.traffic(), A.best().catch(nil),
      A.campaignResults().catch(nil), A.insights().catch(function () { return {}; }),
      A.locations().catch(nil), A.devices().catch(nil), A.funnel()
    ]).then(function (r) {
      var k = r[0] || {}, series = r[1] || [], chans = r[2] || [], best = r[3] || [],
          camps = r[4] || [], ins = r[5] || {}, locs = r[6] || [], devs = r[7] || [],
          f = r[8] || {};

      var figs = [
        ['money', 'Revenue', rupees(k.revenue), pct(k.revenue, k.revenue_before)],
        ['cart', 'Orders', k.orders || 0, pct(k.orders, k.orders_before)],
        ['customers', 'Customers', k.customers || 0, pct(k.customers, k.customers_before)],
        ['tag', 'Average order', rupees(k.aov), pct(k.aov, k.aov_before)],
        ['rise', 'Conversion', (k.conversion || 0) + '%', pct(k.conversion, k.conversion_before)],
        ['back', 'Refund rate', (k.refund_rate || 0) + '%', null]
      ].map(function (x) {
        return '<div class="fig-box">' + figIcon(x[0]) +
          '<span class="lab">' + x[1] + '</span><b>' + esc(x[2]) + '</b>' +
          (x[3] === null ? '<span class="delta flat">30 days</span>'
                        : deltaHTML(x[3], 'the 30 days before')) +

  /* ---------- the facts the law asks for ----------
     Shown at the top of Settings, above everything else, because until these
     are real the shop is publishing none of them — and a shop that goes live
     without them is the single most expensive mistake on the checklist. */

  function factsBanner(facts, real) {
    if (!facts || !facts.length) return '';
    var missing = facts.filter(function (f) {
      return f.is_placeholder && f.required_by_law;
    });
    if (real && !missing.length) {
      return '<p class="note" style="color:#3F6B45;margin-bottom:var(--s4)">' +
        'The seller details are real and are printed on every page of the shop.</p>';
    }
    return '<div class="missing-fact" style="margin-bottom:var(--s4)">' +
      '<b>The shop is publishing no seller details at all.</b><br>' +
      (missing.length
        ? missing.length + ' of the ' + facts.filter(function (f) {
            return f.required_by_law; }).length +
          ' facts the law requires are still stand-ins: ' +
          missing.map(function (f) { return esc(f.label); }).join(', ') + '.'
        : 'Every fact is filled in, but they have not been confirmed as real yet.') +
      '<br><br>An Indian shop must publish its registered address, its GSTIN and ' +
      'a named Grievance Officer who answers a complaint within 48 hours. Until ' +
      'the real ones are typed in below, the site prints nothing rather than ' +
      'something invented — a complaints line nobody answers is worse than none.' +
      '<br><br>See them as they will look: ' +
      '<a href="index.html?preview=facts" target="_blank" rel="noopener">preview ' +
      'the shop front</a>. Then set <code>facts_are_real</code> to on, below.' +
      '</div>';
  }

  function settings() {
    Promise.all([A.settings(), A.facts().catch(nil)]).then(function (r) {
      var rows = r[0] || [], facts = r[1] || [];
      var realRow = rows.filter(function (s) { return s.key === 'facts_are_real'; })[0];
      var real = realRow && realRow.value === 'true';
      body(factsBanner(facts, real) +
        '<p class="hint">These change the shop the moment they are saved. ' +
        'No deploy, nobody to ask.</p>' +
        '<div class="scroll"><table><thead><tr><th>Setting</th><th>Value</th>' +
        '</tr></thead><tbody>' +
        rows.map(function (s) {
          var isBool = s.value === 'true' || s.value === 'false';
          var field = isBool
            ? '<label class="tick"><input type="checkbox" data-set="' + esc(s.key) +
              '"' + (s.value === 'true' ? ' checked' : '') + '> on</label>'
            : '<input class="cell wide" value="' + esc(s.value) +
              '" data-set="' + esc(s.key) + '">';
          /* A note explains a setting; it is not always a good NAME for one.
             "FALSE while the seller details are stand-ins" beside an unchecked
             box reads as a value being displayed rather than a switch to throw. */
          var label = s.key === 'facts_are_real'
            ? 'The seller details are the house’s real ones' +
              '<br><span class="muted">Leave this off until the client’s own ' +
              'GSTIN, address and Grievance Officer are entered above. While it ' +
              'is off the site publishes none of them.</span>'
            : esc(s.note || s.key);
          return '<tr><td>' + label + '</td><td>' + field + '</td></tr>';
        }).join('') + '</tbody></table></div>');
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ================================ MARKETING ================================
     WHAT IS MEASURED HERE AND WHAT IS NOT.

     Revenue, orders, channels and carts are counted from things that actually
     happened. ROAS is left blank until somebody types in what they spent,
     because no database can know an ad bill, and a dashboard that invents one
     is worse than a dashboard that admits it does not know.

     There is no open rate and no click rate anywhere in this section. Measuring
     those needs a mail provider, there isn't one yet, and a fabricated 32%
     would get read as a fact and planned against. */

  /* A ring drawn with one circle per slice. No chart library, same as the
     revenue line — the project has no dependencies and two graphs are still
     not a reason to start. */
  function donut(rows, total) {
    var R = 54, C = 2 * Math.PI * R, at = 0;
    var TONE = ['#2F6F5B','#B08A46','#7A6A9B','#A65A4A','#5B7C99','#8A8578'];
    if (!total) return '<p class="empty">Nothing to draw yet.</p>';
    return '<svg class="donut" viewBox="0 0 140 140" aria-hidden="true">' +
      rows.map(function (r, i) {
        var share = Number(r.revenue || 0) / total;
        var seg = '<circle cx="70" cy="70" r="' + R + '" stroke="' +
          TONE[i % TONE.length] + '" stroke-dasharray="' +
          (share * C).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' +
          (-at * C).toFixed(1) + '"/>';
        at += share;
        return seg;
      }).join('') + '</svg>';
  }

  function marketing() {
    Promise.all([A.marketing(), A.channels(), A.activity(), A.cartStats()])
      .then(function (r) {
        var m = r[0] || {}, chans = r[1] || [], acts = r[2] || [], carts = r[3] || {};
        var total = chans.reduce(function (a, c) { return a + Number(c.revenue || 0); }, 0);

        var figs = [
          ['money', 'Revenue from marketing', rupees(m.revenue),
            deltaHTML(pct(m.revenue, m.revenue_before)), false],
          ['cart', 'Orders from marketing', m.orders || 0,
            deltaHTML(pct(m.orders, m.orders_before)), false],
          ['customers', 'New customers', m.new_customers || 0,
            '<span class="delta flat">first order in 30 days</span>', false],
          ['rise', 'Return on ad spend', m.roas ? m.roas + '×' : '—',
            m.roas ? '<span class="delta flat">on ' + rupees(m.spent) + ' spent</span>'
                   : '<span class="delta flat">enter your ad spend below</span>',
            false]
        ].map(function (f) {
          return '<div class="fig-box' + (f[4] ? ' warn' : '') + '">' + figIcon(f[0]) +
            '<span class="lab">' + f[1] + '</span><b>' + esc(f[2]) + '</b>' +
            f[3] + '</div>';
        }).join('');

        var TONE = ['#2F6F5B','#B08A46','#7A6A9B','#A65A4A','#5B7C99','#8A8578'];
        var legend = chans.length
          ? '<ul class="legend">' + chans.slice(0, 6).map(function (c, i) {
              var share = total ? Math.round(Number(c.revenue) / total * 1000) / 10 : 0;
              return '<li><i style="background:' + TONE[i % TONE.length] + '"></i>' +
                '<span class="nm">' + esc(c.channel) + '</span>' +
                '<span class="n">' + share + '% · ' + rupees(c.revenue) + '</span></li>';
            }).join('') + '</ul>'
          : '';

        body(
          '<div class="figs">' + figs + '</div>' +

          '<div class="grid-2">' +
            '<div class="card"><h3>Where the orders came from' +
              '<span class="more" data-go="analytics">Analytics</span></h3>' +
              (chans.length

              '<form class="filters" id="spendform">' +

            channel: f.elements.channel.value.trim().toLowerCase(),

          }).then(marketing).catch(function (err) { alert(err.message); });

  /* ---------- offers ----------
     A code is never shown without what it cost. A coupon that brought three
     lakh and gave away thirty thousand is a different decision from one that
     brought thirty thousand and gave away three. */

  var CODE_TAB = 'all', CODE_EDIT = null;

  function discounts() {
    A.discounts().then(function (rows) {
      var counts = { all: rows.length, active: 0, scheduled: 0, expired: 0 };
      rows.forEach(function (d) { counts[d.state] = (counts[d.state] || 0) + 1; });
      var shown = rows.filter(function (d) {
        return CODE_TAB === 'all' || d.state === CODE_TAB;
      });

      var tabs = [['all','All'],['active','Active'],['scheduled','Scheduled'],
                  ['expired','Expired']].map(function (t) {
        return '<button class="tab" data-codetab="' + t[0] + '" aria-pressed="' +
          (CODE_TAB === t[0]) + '">' + t[1] + ' (' + (counts[t[0]] || 0) + ')</button>';
      }).join('');

      body(
        '<div class="toolbar"><div class="tabs">' + tabs + '</div>' +
          '<button class="btn" data-go="newcode">+ Create offer</button></div>' +
        '<div class="filters"><input class="cell" id="codeq" ' +
          'style="flex:1;min-width:16rem;max-width:26rem" ' +
          'placeholder="Search by code…"></div>' +
        (shown.length
        ? '<div class="scroll"><table id="codetable"><thead><tr><th>Code</th><th>Worth</th>' +
          '<th>Type</th><th>Used</th><th>Revenue</th><th>Given away</th>' +
          '<th>Valid till</th><th>State</th><th>Live</th><th></th>' +
          '</tr></thead><tbody>' +
          shown.map(function (d) {
            var worth = d.kind === 'percent' ? d.value + '% OFF'
              : d.kind === 'flat' ? rupees(d.value) + ' OFF' : 'Free shipping';
            return '<tr data-code="' + esc(d.code) + '">' +
              '<td class="num"><b>' + esc(d.code) + '</b>' +
                (d.note ? '<br><span class="muted">' + esc(d.note) + '</span>' : '') + '</td>' +
              '<td>' + worth + '</td>' +
              '<td class="muted">' + esc(d.kind.replace('_', ' ')) + '</td>' +
              '<td class="num">' + (d.uses || 0) +
                (d.usage_limit ? ' / ' + d.usage_limit : ' / ∞') + '</td>' +
              '<td class="num">' + rupees(d.revenue) + '</td>' +
              '<td class="num">' + rupees(d.given) + '</td>' +
              '<td class="num">' + (d.ends_at ? day(d.ends_at) : '—') + '</td>' +
              '<td><span class="tag ' + esc(d.state) + '">' + esc(d.state) + '</span></td>' +
              '<td><label class="tick"><input type="checkbox" data-live="' +
                esc(d.code) + '"' + (d.live ? ' checked' : '') + '></label></td>' +
              '<td><button class="btn small" data-editcode="' + esc(d.code) +
                '">Edit</button></td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">No codes here yet. An offer made on the next screen ' +
          'works at the checkout the moment you save it.</p>'));

      var q = document.getElementById('codeq');
      if (q) q.addEventListener('input', function () {
        var v = this.value.trim().toUpperCase();
        [].forEach.call(document.querySelectorAll('#codetable tbody tr'), function (tr) {
          tr.style.display = !v || tr.getAttribute('data-code').indexOf(v) > -1 ? '' : 'none';
        });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- making an offer ----------
     Everything on the left is a rule; the panel on the right is that rule read
     back in a sentence, because "10, 1499, 1000" is not a thing anyone can
     check and "10% off orders over ₹1,499, capped at ₹1,000" is. */

  var KINDS = [['percent','Percentage','Off in per cent'],
               ['flat','Fixed amount','Off in rupees'],
               ['free_shipping','Free shipping','No charge to deliver']];

  function newcode() {
    var d = CODE_EDIT || {};
    Promise.all([A.collections().catch(function () { return []; })])
      .then(function (r) {
        var cols = r[0] || [];
        body(
          '<div class="filters"><button class="btn small" data-go="discounts">' +
            '&larr; Offers</button></div>' +
          '<div class="grid-side">' +
            '<div class="card"><h3>The offer</h3><form id="codeform" class="f2">' +
              '<fieldset><legend>What kind</legend><div class="picks">' +
                KINDS.map(function (k) {
                  return '<label class="pick"><input type="radio" name="kind" value="' +
                    k[0] + '"' + ((d.kind || 'percent') === k[0] ? ' checked' : '') +
                    '><span><b>' + k[1] + '</b><small>' + k[2] + '</small></span></label>';
                }).join('') + '</div></fieldset>' +

              '<div class="pair">' +
                '<p><label for="c-code">Code</label>' +
                  '<input id="c-code" name="code" required placeholder="SUMMER10" ' +
                  'value="' + esc(d.code || '') + '"' +
                  (CODE_EDIT ? ' readonly' : '') + '></p>' +
                '<p><label for="c-value">Value</label>' +
                  '<input id="c-value" name="value" type="number" min="0" step="1" ' +
                  'value="' + esc(d.value == null ? 10 : d.value) + '"></p>' +
              '</div>' +
              (CODE_EDIT ? '' : '<p class="hint">' +
                '<button type="button" class="btn small" id="gen">Generate a code' +
                '</button> — or type one people can say on the phone.</p>') +

              '<div class="pair">' +
                '<p><label for="c-min">Minimum order (optional)</label>' +
                  '<input id="c-min" name="min_spend" type="number" min="0" ' +
                  'value="' + esc(d.min_spend || '') + '"></p>' +
                '<p><label for="c-max">Most it may give away (optional)</label>' +
                  '<input id="c-max" name="max_discount" type="number" min="0" ' +
                  'value="' + esc(d.max_discount || '') + '"></p>' +
              '</div>' +

              '<div class="pair">' +
                '<p><label for="c-limit">Total uses (blank = unlimited)</label>' +
                  '<input id="c-limit" name="usage_limit" type="number" min="1" ' +
                  'value="' + esc(d.usage_limit || '') + '"></p>' +
                '<p><label for="c-per">Uses per customer</label>' +
                  '<input id="c-per" name="per_customer" type="number" min="1" ' +
                  'value="' + esc(d.per_customer == null ? 1 : d.per_customer) + '"></p>' +
              '</div>' +

              '<fieldset><legend>Applies to</legend>' +
                '<div class="pair">' +
                  '<p><select name="applies_to" id="c-apply">' +
                    '<option value="all">Everything</option>' +
                    '<option value="collection"' +
                      (d.applies_to === 'collection' ? ' selected' : '') +
                      '>One collection</option></select></p>' +
                  '<p><select name="collection" id="c-col">' +
                    '<option value="">—</option>' +
                    cols.map(function (c) {
                      return '<option value="' + esc(c.slug || c.name) + '"' +
                        (d.collection === (c.slug || c.name) ? ' selected' : '') +
                        '>' + esc(c.name) + '</option>';
                    }).join('') + '</select></p>' +
                '</div></fieldset>' +

              '<div class="pair">' +
                '<p><label for="c-from">Starts</label>' +
                  '<input id="c-from" name="starts_at" type="date" value="' +
                  esc(d.starts_at ? String(d.starts_at).slice(0, 10) : '') + '"></p>' +
                '<p><label for="c-to">Ends (blank = runs on)</label>' +
                  '<input id="c-to" name="ends_at" type="date" value="' +
                  esc(d.ends_at ? String(d.ends_at).slice(0, 10) : '') + '"></p>' +
              '</div>' +

              '<p><label for="c-note">A note to yourself (optional)</label>' +
                '<input id="c-note" name="note" value="' + esc(d.note || '') + '"></p>' +

              '<div class="row-end">' +
                (CODE_EDIT ? '<button type="button" class="btn small danger" id="killcode">' +
                  'Delete</button>' : '') +
                '<button type="button" class="btn small" data-go="discounts">Cancel</button>' +
                '<button class="btn" type="submit">' +
                  (CODE_EDIT ? 'Save the offer' : 'Create the offer') + '</button>' +
              '</div>' +
            '</form></div>' +

            '<aside class="card"><h3>In plain words</h3>' +
              '<div id="c-sum" class="summary"></div>' +
              '<p class="hint">The database checks all of this again when the ' +
              'order arrives, so an edited page cannot get a bigger discount ' +
              'than this says.</p>' +
            '</aside>' +
          '</div>');

        var form = document.getElementById('codeform');

        function say() {
          var f = form.elements;
          var kind = form.querySelector('[name=kind]:checked').value;
          var v = Number(f.value.value) || 0;
          var worth = kind === 'percent' ? v + '% off'
                    : kind === 'flat' ? rupees(v) + ' off' : 'Free shipping';
          var bits = [];
          bits.push('<b>' + worth + '</b>' +
            (f.applies_to.value === 'collection' && f.collection.value
              ? ' on ' + esc(f.collection.value) : ' on everything'));
          if (f.min_spend.value) bits.push('Only on orders over ' + rupees(f.min_spend.value));
          if (kind === 'percent' && f.max_discount.value)
            bits.push('Never gives away more than ' + rupees(f.max_discount.value));
          bits.push(f.usage_limit.value
            ? f.usage_limit.value + ' uses in total'
            : 'Unlimited uses');
          bits.push((Number(f.per_customer.value) || 1) + ' use per customer');
          bits.push(f.starts_at.value || f.ends_at.value
            ? 'Runs ' + (f.starts_at.value || 'from today') +
              (f.ends_at.value ? ' to ' + f.ends_at.value : ' onwards')
            : 'Runs from today, with no end date');
          return '<p class="code-chip">' + esc(f.code.value || 'YOURCODE') + '</p>' +
            '<ul>' + bits.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>';
        }
        function repaint() { document.getElementById('c-sum').innerHTML = say(); }
        form.addEventListener('input', repaint);
        form.addEventListener('change', repaint);
        repaint();

        var gen = document.getElementById('gen');
        if (gen) gen.addEventListener('click', function () {
          form.elements.code.value =
            'IAR' + Math.random().toString(36).slice(2, 6).toUpperCase();
          repaint();
        });

        var kill = document.getElementById('killcode');
        if (kill) kill.addEventListener('click', function () {
          if (!confirm('Delete ' + CODE_EDIT.code + '? Orders that already used it ' +
                       'keep their discount.')) return;
          A.delDiscount(CODE_EDIT.code).then(function () {
            CODE_EDIT = null; here = 'discounts'; drawNav(); render();
          }).catch(function (err) { alert(err.message); });
        });

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var f = form.elements;
          var row = {
            kind: form.querySelector('[name=kind]:checked').value,
            value: Number(f.value.value) || 0,
            min_spend: Number(f.min_spend.value) || 0,
            max_discount: f.max_discount.value ? Number(f.max_discount.value) : null,
            usage_limit: f.usage_limit.value ? Number(f.usage_limit.value) : null,
            per_customer: f.per_customer.value ? Number(f.per_customer.value) : null,
            applies_to: f.applies_to.value,
            collection: f.applies_to.value === 'collection' ? (f.collection.value || null) : null,
            starts_at: f.starts_at.value || null,
            ends_at: f.ends_at.value || null,
            note: f.note.value.trim() || null
          };
          var done = function () {
            CODE_EDIT = null; here = 'discounts'; drawNav(); render();
          };
          var fail = function (err) { alert(err.message); };
          if (CODE_EDIT) A.setDiscount(CODE_EDIT.code, row).then(done, fail);
          else {
            row.code = f.code.value.trim().toUpperCase();
            if (!row.code) return;
            A.addDiscount(row).then(done, fail);
          }
        });
      }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- campaigns ----------
     HONEST ABOUT WHAT THIS IS. There is no mail server and no SMS gateway, so
     nothing here claims to have sent anything it did not. What it does do is
     real: it builds a named list of real customers from real orders, merges the
     message, and — for WhatsApp, which needs no provider at all — hands the
     house one link per person. Email and SMS come out as a file until a
     provider is connected, and say so on the screen. */

  var CAMP_TAB = 'all', CAMP_OPEN = null;
  var CHANNELS = [['whatsapp','WhatsApp','Sent by you, one tap each. Works today.'],
                  ['email','Email','Needs a mail provider before it can send.'],
                  ['sms','SMS','Needs an SMS gateway before it can send.']];

  function campaigns() {
    A.campaigns().then(function (rows) {
      var counts = { all: rows.length };
      rows.forEach(function (c) { counts[c.channel] = (counts[c.channel] || 0) + 1; });
      var shown = rows.filter(function (c) {
        return CAMP_TAB === 'all' || c.channel === CAMP_TAB;
      });
      var tabs = [['all','All']].concat(CHANNELS.map(function (c) { return [c[0], c[1]]; }))
        .map(function (t) {
          return '<button class="tab" data-camptab="' + t[0] + '" aria-pressed="' +
            (CAMP_TAB === t[0]) + '">' + t[1] + ' (' + (counts[t[0]] || 0) + ')</button>';
        }).join('');

      body(
        '<div class="toolbar"><div class="tabs">' + tabs + '</div>' +
          '<button class="btn" data-go="newcamp">+ Create campaign</button></div>' +
        (shown.length
        ? '<div class="scroll"><table><thead><tr><th>Campaign</th><th>Channel</th>' +
          '<th>Audience</th><th>People</th><th>Sent</th><th>State</th><th>Made</th>' +
          '<th></th></tr></thead><tbody>' +
          shown.map(function (c) {
            return '<tr><td><b>' + esc(c.name) + '</b>' +
                (c.subject ? '<br><span class="muted">' + esc(c.subject) + '</span>' : '') +
                '</td>' +
              '<td>' + esc(c.channel) + '</td>' +
              '<td class="muted">' + esc(c.audience) + '</td>' +
              '<td class="num">' + (c.recipients || 0) + '</td>' +
              '<td class="num">' + (c.sent || 0) + '</td>' +
              '<td><span class="tag ' + esc(c.state) + '">' + esc(c.state) + '</span></td>' +
              '<td class="num">' + day(c.made_at) + '</td>' +
              '<td><button class="btn small" data-camp="' + c.id + '">Open</button></td>' +
              '</tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">No campaigns yet. A campaign here is a list of your ' +
          'own customers and something to say to them — never a bought list.</p>'));
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function newcamp() {
    A.audiences().then(function (auds) {
      body(
        '<div class="filters"><button class="btn small" data-go="campaigns">' +
          '&larr; Campaigns</button></div>' +
        '<div class="grid-side">' +
          '<div class="card"><h3>The campaign</h3><form id="campform" class="f2">' +
            '<fieldset><legend>Where it goes</legend><div class="picks">' +
              CHANNELS.map(function (c, i) {
                return '<label class="pick"><input type="radio" name="channel" value="' +
                  c[0] + '"' + (i === 0 ? ' checked' : '') + '><span><b>' + c[1] +
                  '</b><small>' + c[2] + '</small></span></label>';
              }).join('') + '</div></fieldset>' +

            '<p><label for="m-name">Campaign name</label>' +
              '<input id="m-name" name="name" required placeholder="Summer collection launch"></p>' +

            '<fieldset><legend>Who it goes to</legend><div class="picks stack">' +
              auds.map(function (a, i) {
                return '<label class="pick"><input type="radio" name="audience" value="' +
                  esc(a.kind) + '"' + (i === 0 ? ' checked' : '') + '><span><b>' +
                  esc(a.label) + '</b><small>' + a.n + ' ' +
                  (a.n === 1 ? 'person' : 'people') + '</small></span></label>';
              }).join('') + '</div>' +
              '<p class="hint">Every one of these is somebody who gave the house ' +
              'their number while buying or asking. Nothing here is bought or ' +
              'scraped.</p></fieldset>' +

            '<p id="subwrap" hidden><label for="m-sub">Subject line</label>' +
              '<input id="m-sub" name="subject" placeholder="Introducing our summer collection"></p>' +

            '<p><label for="m-msg">The message</label>' +
              '<textarea id="m-msg" name="message" rows="6" ' +
              'placeholder="Hello {name}, the new season’s cloth has arrived…"></textarea></p>' +
            '<p class="hint"><code>{name}</code> becomes their first name. ' +
              'Nothing else is substituted — a merge field that silently ' +
              'fails prints the braces to a customer.</p>' +

            '<p><label for="m-utm">Tag the links (optional)</label>' +
              '<input id="m-utm" name="utm_campaign" placeholder="summer-launch"></p>' +
            '<p class="hint">Put <code>?utm_source=whatsapp&amp;utm_campaign=' +
              '<span id="utmecho">…</span></code> on any link in the message ' +
              'and the orders it brings show up against this campaign.</p>' +

            '<div class="row-end">' +
              '<button type="button" class="btn small" data-go="campaigns">Cancel</button>' +
              '<button class="btn" type="submit">Build the list</button>' +
            '</div>' +
          '</form></div>' +

          '<aside class="card"><h3>What happens next</h3>' +
            '<div class="summary"><ol class="steps">' +
              '<li><b>Build the list.</b> The audience is resolved into real ' +
                'people, now, and stored with the campaign.</li>' +
              '<li><b>Check it.</b> You see every name before anything goes out.</li>' +
              '<li><b>Send.</b> WhatsApp opens one chat at a time with the ' +
                'message already written, and ticks each person off as you go.</li>' +
            '</ol>' +
            '<p class="note bad" id="chanwarn" hidden></p></div>' +
          '</aside>' +
        '</div>');

      var form = document.getElementById('campform');
      function chanChange() {
        var ch = form.querySelector('[name=channel]:checked').value;
        document.getElementById('subwrap').hidden = ch !== 'email';
        var w = document.getElementById('chanwarn');
        if (ch === 'whatsapp') { w.hidden = true; return; }
        w.hidden = false;
        w.textContent = ch === 'email'
          ? 'Email cannot be sent from here yet — there is no mail provider ' +
            'connected. The list and the message are saved, and download as a ' +
            'file you can hand to one. No open rate is recorded, because nothing ' +
            'here can measure one.'
          : 'SMS cannot be sent from here yet — there is no gateway connected. ' +
            'The list downloads as a file. Indian promotional SMS also needs a ' +
            'registered DLT template before any provider will carry it.';
      }
      form.addEventListener('change', chanChange);
      form.addEventListener('input', function () {
        document.getElementById('utmecho').textContent =
          form.elements.utm_campaign.value.trim() || '…';
      });
      chanChange();

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var f = form.elements;
        A.addCampaign({
          name: f.name.value.trim(),
          channel: form.querySelector('[name=channel]:checked').value,
          audience: form.querySelector('[name=audience]:checked').value,
          subject: f.subject.value.trim() || null,
          message: f.message.value,
          utm_campaign: f.utm_campaign.value.trim() || null
        }).then(function (c) {
          return A.buildAudience(c.id).then(function () { return c.id; });
        }).then(function (id) {
          CAMP_OPEN = id; openCampaign(id);
        }).catch(function (err) { alert(err.message); });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- one campaign: the actual sending ----------
     For WhatsApp this is the whole product. One button per person, the message
     already merged, and a tick the moment the chat opens — which is the only
     thing this can honestly claim to know. */

  function merge(msg, name) {
    var first = String(name || '').trim().split(/\s+/)[0] || 'there';
    return String(msg || '').replace(/\{name\}/g, first);
  }

  function openCampaign(id) {
    here = 'campaign'; drawNav(); shell(waiting());
    Promise.all([A.campaign(id), A.recipients(id)]).then(function (r) {
      var c = r[0] || {}, list = r[1] || [];

  /* ============================ THE SHOP WINDOWS ============================
     WHAT THESE SCREENS ARE, AND WHAT THEY ARE NOT.

     Every page of this site is finished, hand-built HTML that renders with no
     JavaScript and no database. These screens do not build pages — they let the
     house OVERRIDE a page that is already correct: hide a band, reorder two,
     rename a link, change a photograph.

     So there is no "add a section" here, and no page builder. A band that is
     not in the HTML has no design, no photography and no words, and a switch
     for it would be a switch wired to nothing. What the house gets instead is
     the thing it actually needs twice a year, working, on a page that still
     loads instantly on a bad phone. */

  function website() {
    Promise.all([A.siteStats(), A.settings(), A.content()]).then(function (r) {
      var st = r[0] || {}, sets = r[1] || [], slots = r[2] || [];
      var val = function (k) {
        var s = sets.filter(function (x) { return x.key === k; })[0];
        return s ? s.value : '';
      };
      var barOn = String(val('bar_on')).toLowerCase() === 'true';

      var figs = [
        ['pages', 'Pages', st.pages || 0, (st.pages_all || 0) + ' in all'],
        ['collections', 'Collections', st.collections || 0, 'in the range'],
        ['media', 'Files', st.files || 0, mb(st.bytes)],
        ['homepage', 'Bands on the home page', st.sections_live || 0,
          'of ' + (st.sections_all || 0)]
      ].map(function (f) {
        return '<div class="fig-box">' + figIcon(f[0]) +
          '<span class="lab">' + f[1] + '</span><b>' + esc(f[2]) + '</b>' +
          '<span class="delta flat">' + esc(f[3]) + '</span></div>';
      }).join('');

      body('<div class="figs">' + figs + '</div>' +
        '<div class="grid-2">' +
          '<div class="card"><h3>The shop front</h3>' +
            '<div class="scroll"><table><tbody>' +
            [['Address', '<a href="' + SITE + '" target="_blank" ' +
              'rel="noopener">www.iamratan.co.in</a>'],
             ['Announcement bar', barOn
                ? '<span class="tag active">on</span> ' + esc(val('announcement') || '(no words yet)')
                : '<span class="tag draft">off</span>'],
             ['Menu', (st.menu_items || 0) + ' links'],
             ['Taking orders', String(val('shop_open')).toLowerCase() === 'false'
                ? '<span class="tag cancelled">closed</span>'
                : '<span class="tag active">open</span>']
            ].map(function (row) {
              return '<tr><td class="muted" style="width:12rem">' + row[0] + '</td>' +
                     '<td>' + row[1] + '</td></tr>';
            }).join('') + '</tbody></table></div>' +
            '<div class="quick">' +
              '<button data-go="media"><b>Upload a photograph</b>' +
                '<span>Straight to the shop, with no deploy</span></button>' +
              '<button data-go="bar"><b>Change the announcement bar</b>' +
                '<span>The line across the top of every page</span></button>' +
              '<button data-go="homepage"><b>Reorder the home page</b>' +
                '<span>Hide a band, or move one up</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="card"><h3>Words the house owns</h3>' +
            '<p class="hint">Each of these replaces a line already on the site. ' +
            'Leave one empty and the page keeps what it was built with — so a ' +
            'blank box is never a blank page.</p>' + (slots.length
            ? '<div class="scroll"><table><tbody>' + slots.map(function (s) {
                return '<tr><td style="width:45%">' + esc(s.note || s.slot) + '<br>' +
                  '<span class="muted">' + esc(s.slot) + '</span></td>' +
                  '<td><input class="cell" style="width:100%" value="' +
                  esc(s.value || '') + '" data-slot="' + esc(s.slot) + '"></td></tr>';
              }).join('') + '</tbody></table></div>'
            : '<p class="empty">No slots yet.</p>') + '</div>' +
        '</div>');
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function mb(b) {
    b = Number(b || 0);
    if (!b) return 'nothing yet';
    if (b < 1048576) return Math.round(b / 1024) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }

  /* ---------- media ----------
     The single biggest thing standing between the house and running its own
     shop: until now a photograph lived in the repository, so changing one was
     a deploy, so changing one was me. */

  var MEDIA_FOLDER = 'all';

  function media() {
    A.media().then(function (rows) {
      var folders = {};
      rows.forEach(function (m) { folders[m.folder || 'Uncategorised'] =
        (folders[m.folder || 'Uncategorised'] || 0) + 1; });
      var shown = rows.filter(function (m) {
        return MEDIA_FOLDER === 'all' || (m.folder || 'Uncategorised') === MEDIA_FOLDER;
      });
      var tabs = [['all', 'All files', rows.length]].concat(
        Object.keys(folders).sort().map(function (k) { return [k, k, folders[k]]; })
      ).map(function (t) {
        return '<button class="tab" data-folder="' + esc(t[0]) + '" aria-pressed="' +
          (MEDIA_FOLDER === t[0]) + '">' + esc(t[1]) + ' (' + t[2] + ')</button>';
      }).join('');

      body(
        '<div class="card"><h3>Add files</h3>' +
          '<p class="hint">JPEG, PNG, WebP, AVIF, SVG or PDF, up to 10 MB each. ' +
          'The name is kept, so <code>cocoa-drift-cuff.jpg</code> stays findable ' +
          'a year from now.</p>' +
          '<div class="filters">' +
            '<input class="cell" id="mfolder" placeholder="Folder, e.g. Products" ' +
              'style="width:14rem" value="' +
              esc(MEDIA_FOLDER === 'all' ? '' : MEDIA_FOLDER) + '">' +
            '<input type="file" id="mfile" multiple ' +
              'accept="image/jpeg,image/png,image/webp,image/avif,image/svg+xml,application/pdf">' +
          '</div>' +
          '<p class="note" id="mnote"></p>' +
        '</div>' +
        '<div class="tabs" style="margin-top:var(--s4)">' + tabs + '</div>' +
        (shown.length
        ? '<div class="files">' + shown.map(function (m) {
            var pic = /^image\/(?!svg)/.test(m.kind || '')
              ? '<img src="' + esc(m.url) + '" alt="" loading="lazy">'
              : '<span class="filetype">' +
                esc((m.kind || 'file').split('/').pop().toUpperCase()) + '</span>';
            return '<figure class="file"><a href="' + esc(m.url) +
              '" target="_blank" rel="noopener">' + pic + '</a>' +
              '<figcaption>' +
                '<b title="' + esc(m.name) + '">' + esc(m.name || m.path) + '</b>' +
                '<span class="muted">' + mb(m.bytes) + '</span>' +
                '<input class="cell wide" placeholder="What is this a picture of?" ' +
                  'value="' + esc(m.alt || '') + '" data-alt="' + m.id + '">' +
                '<span class="row-end">' +
                  '<button class="btn small" data-copy="' + esc(m.url) + '">Copy link</button>' +
                  '<button class="btn small danger" data-delmedia="' + m.id +
                    '" data-path="' + esc(m.path) + '">Delete</button>' +
                '</span>' +
              '</figcaption></figure>';
          }).join('') + '</div>'
        : '<p class="empty">Nothing uploaded yet. Anything added here gets a ' +
          'permanent public link you can paste onto a cloth, so a photograph can ' +
          'change without the site being rebuilt.</p>'));

      document.getElementById('mfile').addEventListener('change', function () {
        var files = [].slice.call(this.files);
        if (!files.length) return;
        var folder = document.getElementById('mfolder').value.trim() || 'Uncategorised';
        var note = document.getElementById('mnote');
        var done = 0, failed = [];
        note.className = 'note';
        note.textContent = 'Uploading ' + files.length + '…';

        /* one at a time. A free project and a phone on Indian mobile data are
           both happier with a queue than with twelve parallel uploads. */
        files.reduce(function (chain, f) {
          return chain.then(function () {
            return A.upload(f, folder).then(function () {
              done++; note.textContent = 'Uploaded ' + done + ' of ' + files.length + '…';
            }, function (err) {
              failed.push(f.name + ' — ' + err.message);
            });
          });
        }, Promise.resolve()).then(function () {
          if (failed.length) {
            note.className = 'note bad';
            note.textContent = done + ' uploaded. ' + failed.length +
              ' did not: ' + failed.join('; ');
            setTimeout(media, 2500);
          } else { MEDIA_FOLDER = folder; media(); }
        });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

      function preview() {

          esc(words) + (lt ? ' — <u>' + esc(lt) + '</u>' : '') + '</div>';
      }
      document.getElementById('body').addEventListener('input', preview);
      document.getElementById('body').addEventListener('change', preview);
      preview();

  /* ---------- the journal ----------
     Four entries were written as hand-built HTML files, and publishing a fifth
     meant a developer. Now the house writes here.

     Two kinds of entry live in one list. The four that already exist carry a
     `path` and keep rendering from their own files, because each has its own
     layout and photographs and rebuilding them into a template would lose the
     thing that makes them worth reading. Anything written here has no file and
     renders through journal-entry.html from the words kept in the row. The
     index does not care which is which. */

  function entryHref(e) {
    return e.path ? e.path : 'journal-entry.html?entry=' + encodeURIComponent(e.slug);
  }

  function journal() {
    A.journal().then(function (rows) {
      rows = rows || [];
      var live = rows.filter(function (e) { return e.published; }).length;
      body('<div class="strip">' +
          '<div><b>' + rows.length + '</b><span>Entries</span></div>' +
          '<div><b>' + live + '</b><span>Published</span></div>' +
          '<div class="warn"><b>' + (rows.length - live) + '</b><span>Drafts</span></div>' +
        '</div>' +

        '<div class="filters">' +
          '<button class="btn" data-go="newentry">+ Write an entry</button></div>' +

        '<p class="hint">Order is the order they appear in the journal. Untick ' +
        'to take an entry down without deleting it. The four older essays have ' +
        'their own hand-built pages and open there; anything written here is ' +
        'laid out by the house style.</p>' +

        (rows.length
        ? '<div class="card"><div class="scroll"><table><thead><tr>' +
          '<th>Order</th><th>Entry</th><th>Kicker</th><th>Published</th>' +
          '<th>Live</th><th></th></tr></thead><tbody>' +
          rows.map(function (e) {
            return '<tr>' +
              '<td><input class="cell" type="number" style="width:4rem" value="' +
                (e.sort_order || 0) + '" data-entry="' + e.id +
                '" data-efield="sort_order"></td>' +
              '<td><button class="linky" data-entry-open="' + e.id + '">' +
                esc(e.title) + '</button>' +
                '<br><span class="muted">' + esc(e.slug) +
                (e.path ? ' &middot; its own page' : '') + '</span></td>' +
              '<td class="muted">' + esc(e.kicker || '—') + '</td>' +
              '<td class="num muted">' + (e.published_at ? day(e.published_at) : '—') + '</td>' +
              '<td><label class="tick"><input type="checkbox" data-entrylive="' +
                e.id + '"' + (e.published ? ' checked' : '') + '> live</label></td>' +
              '<td><a class="btn small" target="_blank" rel="noopener" href="' +
                SITE + '/' + esc(entryHref(e)) + '">View</a></td>' +
            '</tr>';
          }).join('') + '</tbody></table></div></div>'
        : '<p class="empty">Nothing in the journal yet.</p>'));
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function newentry() {
    body('<div class="filters"><button class="btn small" data-go="journal">' +
        '&larr; The journal</button></div>' +
      '<div class="block"><h3>Write an entry</h3>' +
      '<p class="hint">It is saved as a draft. Nothing appears on the site ' +
      'until you tick it live, so there is no hurry and no harm in starting.</p>' +
      '<form id="entryform" class="f">' +
        '<label>Title<input class="cell wide" name="title" ' +
          'placeholder="What a button is for" required></label>' +
        '<label>Kicker<input class="cell wide" name="kicker" ' +
          'placeholder="On detail"></label>' +
        '<label>The line under the title<input class="cell wide" name="standfirst" ' +
          'placeholder="Four holes, one thread, and a hundred years of argument."></label>' +
        '<label>Photograph<input class="cell wide" name="hero" ' +
          'placeholder="images/journal/button.webp"></label>' +
        '<label>What the photograph shows<input class="cell wide" name="hero_alt" ' +
          'placeholder="A button with I AM RATAN engraved around the rim"></label>' +
        '<label>The entry<textarea class="cell wide" name="body" rows="16" ' +
          'style="max-width:46rem;font-family:inherit;font-size:1rem;line-height:1.7" ' +
          'placeholder="One paragraph to a line. Leave a blank line between them."></textarea></label>' +
        '<div class="filters"><button class="btn" type="submit">Save as a draft</button>' +
        '<button class="btn small" type="button" data-go="journal">Cancel</button></div>' +
      '</form></div>');

    document.getElementById('entryform').addEventListener('submit', function (e) {
      e.preventDefault();
      var f = e.target, btn = f.querySelector('button[type=submit]');
      var title = f.elements.title.value.trim();
      var slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (!slug) return toast('Give the entry a title first.', true);
      btn.disabled = true;
      A.addEntry({
        slug: slug, title: title,
        kicker: f.elements.kicker.value.trim() || null,
        standfirst: f.elements.standfirst.value.trim() || null,
        hero: f.elements.hero.value.trim() || null,
        hero_alt: f.elements.hero_alt.value.trim() || null,
        body: f.elements.body.value.trim() || null,

      }).then(function () {
        toast('Saved as a draft.');

  function field(e, name, label) {

  /* ---------- reports ----------
     Separate from the dashboard on purpose. The dashboard is for the morning;
