<style>
/* THE WALL
   The brand's own argument is that the range IS the identity — twenty-five
   colours. So the shop is those twenty-five colours, laid edge to edge with no
   gaps, filling one screen. The photograph is underneath each panel and only
   surfaces when you go looking. Nothing to scroll past; the whole range is the
   first thing you see. */
html,body{height:100%}
body{overflow:hidden}
@media(max-width:820px){body{overflow:auto}}

.wall{height:100svh;padding-top:var(--sy);display:grid;gap:0;
  grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr}
@media(max-width:1100px){.wall{grid-template-columns:repeat(4,1fr)}}
@media(max-width:820px){
  html,body{height:auto}
  .wall{height:auto;grid-template-columns:repeat(2,1fr);grid-auto-rows:36vw}
}

.panel{position:relative;display:block;background:var(--g);overflow:hidden;
  color:var(--k);isolation:isolate}
.panel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  object-position:center 14%;opacity:0;transform:scale(1.06);
  transition:opacity .5s var(--settle),transform .8s var(--settle)}
.panel:hover img,.panel:focus-visible img{opacity:1;transform:scale(1)}
/* the cloth colour stays present over the photograph, so the wall never
   dissolves into twenty-five different backgrounds */
.panel::after{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:var(--g);opacity:0;transition:opacity .5s var(--settle);
  mix-blend-mode:multiply}
.panel:hover::after,.panel:focus-visible::after{opacity:.34}

.panel-in{position:relative;z-index:2;height:100%;display:flex;
  flex-direction:column;justify-content:space-between;
  padding:var(--s3)}
/* Nothing here is dimmed with opacity. Measured across all twenty-five panels,
   .62 on the number dropped to 2.78:1 and .72 on the price to 2.95:1 against
   mid-tone cloths — the same failure the swatch chips and the drench already
   taught this project. Hierarchy is scale and letterspacing; ink stays whole. */
.panel .no{font-family:var(--mono);font-size:.5625rem;letter-spacing:.16em}
.panel .nm{font-weight:300;font-size:clamp(.85rem,1.15vw,1.08rem);
  line-height:1.15;letter-spacing:-.014em;text-wrap:balance}
.panel .pr{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:.6875rem;margin-top:var(--s0)}
.panel .foot{transform:translateY(.35rem);
  transition:transform .4s var(--swing)}
.panel:hover .foot,.panel:focus-visible .foot{transform:translateY(0)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  justify-content:space-between;gap:var(--s3);align-items:center;
  padding:var(--s2) var(--gut);background:var(--room);
  border-top:1px solid var(--hair)}
@media(max-width:820px){.bar{position:static}}

@media(prefers-reduced-motion:reduce){
  .panel img,.panel::after,.panel .foot{transition:none}
}
</style>
</head>

<main class="wall" id="wall"></main>

<div class="bar label">
  <span class="muted">Twenty-five cloths · hover to see the shirt</span>
  <span class="muted fig">₹2,999–₹6,999</span>
</div>

<script src="assets/catalogue.js?v=1786941600"></script>
<script src="assets/site.js?v=1786941600"></script>
<script src="assets/iar-house.js?v=1786941600"></script>
<script src="assets/mark.js?v=1786941600"></script>
<script>
(function () {
  'use strict';
  var R = IAR.RANGE, wall = document.getElementById('wall');

  wall.innerHTML = R.map(function (p) {
    return '<a class="panel" href="product.html?p=' + encodeURIComponent(p.slug) + '" ' +
      'style="--g:' + p.hex + ';--k:' + p.ink + '">' +
      '<img src="images/shirts/' + p.img + '" alt="" loading="lazy" decoding="async">' +
      '<span class="panel-in">' +
        '<span class="no">' + p.no + '</span>' +
        '<span class="foot">' +
          '<span class="nm">' + p.name + '</span>' +
          '<span class="pr">' + p.priceText + '</span>' +
        '</span>' +
      '</span></a>';
  }).join('');
})();
</script>
