  /* ---------- reports ----------
     Separate from the dashboard on purpose. The dashboard is for the morning;
     this is for the end of the month, and for the accountant.

     The mockup showed seven tabs. Four of them can be answered from what this
     shop records, and they are here. The other three are named and told the
     truth rather than filled with something that looks like data:

       PAYMENT METHODS  — every order is 'prepaid' by default; there is no
                          gateway. A UPI-vs-card split would be a drawing.
       CUSTOM REPORTS   — a report builder is a product, not a screen. What it
                          would really be used for is "give me this as a file",
                          so every table here exports instead.
       REFUNDS          — real, and folded into Sales rather than given a tab
                          of its own, because it is three numbers. */

  var R_TAB = 'sales';
  var R_TABS = [
    ['sales',     'Sales',     'Revenue, month by month, and what it netted'],
    ['products',  'Products',  'Sell-through per cloth, and what is left'],
    ['customers', 'Customers', 'Who buys, how often, and from where'],
    ['traffic',   'Traffic',   'Visits by channel, and what they converted at']
  ];

  function reports() {
    var side = '<div class="rep-side">' + R_TABS.map(function (t) {
      return '<button data-rtab="' + t[0] + '"' +
        (R_TAB === t[0] ? ' aria-current="true"' : '') + '><b>' + t[1] + '</b>' +
        '<span>' + t[2] + '</span></button>';
    }).join('') + '</div>';

    body('<div class="rep">' + side + '<div id="repbody">' + waiting() + '</div></div>');
    ({ sales: repSales, products: repProducts,
       customers: repCustomers, traffic: repTraffic }[R_TAB] || repSales)();
  }

  function repBody(html) {
    var el = document.getElementById('repbody');
    if (el) el.innerHTML = html;
  }
  function repFail(e) { repBody(needsSQL(e)); }

  /* Every table on this screen exports. "Custom reports" in the mockup is, in
     practice, somebody wanting the numbers in a spreadsheet — so rather than
     build a report designer nobody asked for, each table hands over its own
     rows exactly as shown, headings and all. */
  function csv(name, head, rows) {
    var body = [head].concat(rows).map(function (r) {
      return r.map(function (v) {
        return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' }));
    a.download = 'iar-' + name + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  var EXPORTS = {};
  function exportBtn(key) {
    return '<button class="btn small" data-export="' + key + '">Export CSV</button>';
  }

  function repSales() {
    Promise.all([A.reportSales(), A.aKpis(), A.exchangeRate().catch(nil)])
      .then(function (r) {
        var months = r[0] || [], k = r[1] || {}, exch = r[2] || [];
        var peak = Math.max.apply(null, months.map(function (m) {
          return Number(m.revenue) || 0;
        }).concat([1]));

        EXPORTS.sales = function () {
          csv('sales-by-month', ['Month', 'Orders', 'Revenue'],
            months.map(function (m) { return [m.month, m.orders, m.revenue]; }));
        };

        var figs = [
          ['money', 'Revenue, 30 days', rupees(k.revenue), pct(k.revenue, k.revenue_before)],
          ['cart', 'Orders', k.orders || 0, pct(k.orders, k.orders_before)],
          ['tag', 'Average order', rupees(k.aov), pct(k.aov, k.aov_before)],
          ['back', 'Refund rate', (k.refund_rate || 0) + '%', null]
        ].map(function (x) {
          return '<div class="fig-box">' + figIcon(x[0]) +
            '<span class="lab">' + x[1] + '</span><b>' + esc(x[2]) + '</b>' +
            (x[3] === null ? '<span class="delta flat">30 days</span>'
                          : deltaHTML(x[3], 'the 30 days before')) +
            '</div>';
        }).join('');

        repBody('<div class="figs">' + figs + '</div>' +
          '<div class="card"><h3>Twelve months' + '</h3>' +
            '<div class="filters">' + exportBtn('sales') + '</div>' +
            (months.length
              ? '<div class="funnel">' + months.map(function (m) {
                  return '<div class="step"><span>' + esc(m.month) + '</span>' +
                    '<span class="bar"><i style="width:' +
                      Math.round(100 * (Number(m.revenue) || 0) / peak) + '%"></i></span>' +
                    '<span class="n">' + rupees(m.revenue) + '</span></div>';
                }).join('') + '</div>'
              : '<p class="empty">No orders yet.</p>') + '</div>' +

          '<div class="card"><h3>Which neck comes back</h3>' +
            '<p class="hint">A cloth and a neck that returns often is a cutting ' +
            'problem, not a customer problem. Only size exchanges are counted — ' +
            'somebody changing their mind says nothing about the pattern.</p>' +
            (exch.filter(function (x) { return x.came_back > 0; }).length
              ? '<div class="scroll"><table><thead><tr><th>Cloth</th><th>Neck</th>' +
                '<th>Sold</th><th>Came back</th><th>Rate</th></tr></thead><tbody>' +
                exch.filter(function (x) { return x.came_back > 0; }).map(function (x) {
                  return '<tr><td>' + esc(x.slug) + '</td>' +
                    '<td class="num">' + esc(x.size) + '</td>' +
                    '<td class="num">' + x.sold + '</td>' +
                    '<td class="num">' + x.came_back + '</td>' +
                    '<td class="num">' + x.pct + '%</td></tr>';
                }).join('') + '</tbody></table></div>'
              : '<p class="empty">Nothing has come back for size. Good.</p>') +
          '</div>' +

          '<div class="card"><h3>Payment methods</h3>' +
            '<p class="note bad">Not shown, because nothing here could be true ' +
            'yet: there is no payment gateway, so every order is recorded as ' +
            'prepaid by default. A split between UPI, cards and netbanking ' +
            'appears the day Razorpay is live and starts reporting one.</p>' +
          '</div>');
      }).catch(repFail);
  }

  /* ---------- one cloth: its details and its photographs ---------- */

      body('<div class="filters"><button class="btn small" data-go="products">' +
          '&larr; The range</button></div>' +
        '<p class="hint">' + esc(p.name) + ' · ' + rupees(p.price) +
          '. Every field saves as you leave it.</p>' +

        '<div class="block"><h3>The garment</h3><div class="scroll">' +
        '<table><tbody>' + GARMENT.map(function (g) {
          return '<tr><td style="width:12rem">' + g[1] + '</td><td>' +
            '<input class="cell wide" value="' + esc(p[g[0]] || '') +
            '" data-cloth="' + p.id + '" data-field="' + g[0] + '"></td></tr>';
        }).join('') +
        '<tr><td>MRP, if it differs</td><td><input class="cell" type="number" value="' +
          esc(p.mrp || '') + '" data-cloth="' + p.id + '" data-field="mrp"></td></tr>' +
        '<tr><td>Care</td><td><input class="cell wide" value="' + esc(p.care || '') +
          '" data-cloth="' + p.id + '" data-field="care"></td></tr>' +
        '</tbody></table></div></div>' +

        '<div class="block"><h3>Photographs</h3>' +
        '<p class="hint">Drag to reorder — the first is the one the shop ' +
        'leads with. Name each by what it shows so the product page can ask for ' +
        'the cuff shot by name.</p>' +
        '<form class="filters" id="newimg">' +
          '<input class="cell wide" name="url" placeholder="images/cocoa-drift-cuff.jpg" required>' +
          '<select class="cell" name="kind">' + SHOTS.map(function (s) {
            return '<option value="' + s + '">' + s + '</option>';
          }).join('') + '</select>' +
          '<button class="btn small" type="submit">Add</button></form>' +
        (imgs.length
          ? '<div class="shots" id="shots">' + imgs.map(function (im, i) {
              return '<figure class="shot" draggable="true" data-img="' + im.id +
                '" data-i="' + i + '">' +
                '<img src="' + esc(im.url) + '" alt="" loading="lazy">' +
                '<figcaption><select class="cell" data-imgkind="' + im.id + '">' +
                  SHOTS.map(function (s) {
                    return '<option value="' + s + '"' +
                      (s === im.kind ? ' selected' : '') + '>' + s + '</option>';
                  }).join('') + '</select>' +
                '<button class="btn small" data-delimg="' + im.id + '">Remove</button>' +
                '</figcaption></figure>';
            }).join('') + '</div>'
          : '<p class="empty">No photographs on this cloth yet.</p>') +
        '</div>');

      document.getElementById('newimg').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        A.addImage({
          product_id: Number(id), url: f.elements.url.value.trim(),
          kind: f.elements.kind.value, sort_order: imgs.length
        }).then(function () { openCloth(id); });
      });

      dragShots(id);
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* Reordering writes every card's new position, because a single swap leaves
     the rest of the row wrong the moment two are moved. */
  function dragShots(productId) {
    var box = document.getElementById('shots');
    if (!box) return;
    var from = null;
    box.addEventListener('dragstart', function (e) {
      var s = e.target.closest('.shot'); if (!s) return;
      from = s; s.classList.add('lift');
      e.dataTransfer.effectAllowed = 'move';
    });
    box.addEventListener('dragend', function () {
      if (from) from.classList.remove('lift');
      from = null;
    });
    box.addEventListener('dragover', function (e) {
      e.preventDefault();
      var over = e.target.closest('.shot');
      if (!over || !from || over === from) return;
      var after = over.compareDocumentPosition(from) & Node.DOCUMENT_POSITION_PRECEDING;
      box.insertBefore(from, after ? over.nextSibling : over);
    });
    box.addEventListener('drop', function (e) {
      e.preventDefault();
      var order = [].slice.call(box.querySelectorAll('.shot'));
      Promise.all(order.map(function (s, i) {
        return A.setImage(s.getAttribute('data-img'), { sort_order: i });
      })).then(function () { openCloth(productId); });
    });
  }

  /* ---------- saving ----------
     Every edit saves on change and the field flashes. No Save button anywhere:
     a Save button is a thing to forget, and the failure it causes is silent. */

  function flash(el) {
    el.classList.remove('failed');
    el.classList.add('saved');
    setTimeout(function () { el.classList.remove('saved'); }, 900);
  }

  /* ---------- when a save does not work ----------
     The rule here is that every edit saves on change and the field flashes. The
     unspoken half of that rule was that a save which FAILED did nothing at all,
     which looks exactly like not having touched the field. Nine fields in the
     cloth editor were writing to columns that did not exist and nobody could
     have known, because the page never said so.

     So: the field goes red and keeps the value the house typed, and the reason
     is said out loud. Never swallow this. */
  var toastEl, toastT;
  function toast(msg, bad) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.toggle('bad', !!bad);
    toastEl.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove('on'); }, bad ? 6000 : 2600);
  }

  /* Wraps a save so the two outcomes are both visible. Every write in the
     change listener goes through this. */
  function saving(promise, el, what) {
    return promise.then(function (r) {
      if (el) flash(el);
      return r;
    }, function (err) {
      if (el) { el.classList.remove('saved'); el.classList.add('failed'); }
      var m = (err && err.message) || 'unknown';
      console.error('[admin] could not save', what || '', '·', m);
      toast('That did not save' + (what ? ' (' + what + ')' : '') + '. ' + m, true);
      /* Still thrown, so a chain that would have refreshed a count on success
         does not run. Marked as already said, so the catch-all below does not
         replace this message with a vaguer one. */
      try { err.__told = true; } catch (e2) {}
      throw err;
    });
  }

  /* Anything that still escapes — a save outside the change listener, a render
     that throws — is said rather than lost to the console. */
  window.addEventListener('unhandledrejection', function (e) {
    if (e.reason && e.reason.__told) return;      /* saving() already said it */
    var m = (e.reason && e.reason.message) || String(e.reason || '');
    if (m) toast('Something did not work: ' + m, true);
  });

  document.addEventListener('click', function (e) {
    var f = e.target.closest('[data-of]');
    if (f) { ofilter = f.getAttribute('data-of'); orders(); }
    var op = e.target.closest('[data-open]');
    if (op) openOrder(op.getAttribute('data-open'));

    var rf = e.target.closest('[data-rf]');
    if (rf) { rfilter = rf.getAttribute('data-rf'); returns(); }

    var pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) { opage = Math.max(0, +pg.getAttribute('data-page')); orders(); }

    var inv = e.target.closest('[data-invoice]');
    if (inv) invoicePage(inv.getAttribute('data-invoice'));

    /* moving an order along writes its own line in the timeline, because the
       database records the change rather than this button doing it */
    var stg = e.target.closest('[data-stage]');
    if (stg) {
      var bits = stg.getAttribute('data-stage').split('|');
      stg.disabled = true;
      A.setOrder(bits[0], { status: bits[1] }).then(function () {
        openOrder(bits[0]); orders(); refreshKpis();
      });
    }

    if (e.target.classList && e.target.classList.contains('over-veil')) closeOver();
    var sh = e.target.closest('[data-sheet]');
    if (sh) openSheet(sh.getAttribute('data-sheet'));
    var cl = e.target.closest('[data-cloth-open]');
    if (cl) openCloth(cl.getAttribute('data-cloth-open'));

    var eo = e.target.closest('[data-entry-open]');
    if (eo) openEntry(eo.getAttribute('data-entry-open'));

    var ed = e.target.closest('[data-entry-del]');
    if (ed && confirm('Delete this entry for good? It cannot be undone.')) {
      saving(A.delEntry(ed.getAttribute('data-entry-del')), null, 'the entry')
        .then(function () { toast('Deleted.'); here = 'journal'; drawNav(); render(); });
    }
    var di = e.target.closest('[data-delimg]');
    if (di) {
      e.preventDefault();
      var fig = di.closest('.shot');
      A.delImage(di.getAttribute('data-delimg')).then(function () {
        if (fig) fig.remove();
      });
    }

    /* ---- marketing ---- */

    var ar = e.target.closest('[data-arange]');
    if (ar) { A_RANGE = ar.getAttribute('data-arange'); analytics(); }

    var rt = e.target.closest('[data-rtab]');
    if (rt) { R_TAB = rt.getAttribute('data-rtab'); reports(); }

    var ex = e.target.closest('[data-export]');
    if (ex) {
      var fn = EXPORTS[ex.getAttribute('data-export')];
      if (fn) fn();
    }

    var ct = e.target.closest('[data-codetab]');
    if (ct) { CODE_TAB = ct.getAttribute('data-codetab'); discounts(); }

    var ec = e.target.closest('[data-editcode]');
    if (ec) {
      var want = ec.getAttribute('data-editcode');
      A.discounts().then(function (rows) {
        CODE_EDIT = rows.filter(function (d) { return d.code === want; })[0] || null;
        if (!CODE_EDIT) return;
        here = 'newcode'; drawNav(); render();
      });
    }

    var mt = e.target.closest('[data-camptab]');
    if (mt) { CAMP_TAB = mt.getAttribute('data-camptab'); campaigns(); }

    var oc = e.target.closest('[data-camp]');
    if (oc) openCampaign(oc.getAttribute('data-camp'));

    /* Ticked when the chat is opened — which is the only thing this can
       honestly claim to know. It is not a read receipt and is not called one. */
    /* ---- the shop windows ---- */

    var mf = e.target.closest('[data-folder]');
    if (mf) { MEDIA_FOLDER = mf.getAttribute('data-folder'); media(); }

    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var link = cp.getAttribute('data-copy');
      navigator.clipboard.writeText(link).then(function () {
        var was = cp.textContent; cp.textContent = 'Copied';
        setTimeout(function () { cp.textContent = was; }, 1400);
      }, function () { prompt('Copy this link:', link); });
    }

    var dm = e.target.closest('[data-delmedia]');
    if (dm) {
      if (confirm('Delete this file? Anything on the site pointing at it will ' +
                  'show a broken picture.')) {
        A.delMedia({ id: dm.getAttribute('data-delmedia'),
                     path: dm.getAttribute('data-path') })
          .then(media).catch(function (err) { alert(err.message); });
      }
    }

    var dn = e.target.closest('[data-delnav]');
    if (dn) {
      if (confirm('Remove this link from the menu?'))
        A.delNav(dn.getAttribute('data-delnav')).then(navigation)
          .catch(function (err) { alert(err.message); });
    }

    var sd = e.target.closest('[data-send]');
    if (sd) {
      var row = sd.closest('tr');
      A.markSent(sd.getAttribute('data-send')).then(function () {
        if (row) row.classList.add('done');
        sd.outerHTML = '<span class="tag delivered">sent</span>';
      });
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target, has = function (a) { return t.hasAttribute && t.hasAttribute(a); };

    if (has('data-stock')) {
      var q = parseInt(t.value, 10);
      if (isNaN(q) || q < 0) { q = 0; t.value = 0; }
      var was = parseInt(t.getAttribute('data-was'), 10) || 0;
      var why = (document.getElementById('why') || {}).value || 'correction';
      t.classList.toggle('zero', q === 0);
      t.classList.toggle('low', q > 0 && q <= 3);
      saving(A.moveStock(t.getAttribute('data-stock'), t.getAttribute('data-size'),
                         was, q, why), t, 'stock')
        .then(function () { t.setAttribute('data-was', q); refreshKpis(); });
    }
    if (has('data-price')) {
      var p = parseInt(t.value, 10);
      if (!isNaN(p) && p >= 0)
        saving(A.setProduct(t.getAttribute('data-price'), { price: p }), t, 'price');
    }
    if (has('data-visible'))
      saving(A.setProduct(t.getAttribute('data-visible'), { visible: t.checked }),
             null, 'on the shop');
    if (has('data-order'))
      saving(A.setOrder(t.getAttribute('data-order'), { status: t.value }), null, 'the stage')
        .then(refreshKpis);
    /* null rather than an empty string when it is cleared, so the customer's
       account shows no consignment block at all rather than an empty heading */
    if (has('data-courier'))
      saving(A.setOrder(t.getAttribute('data-courier'),
                        { courier: t.value.trim() || null }), t, 'the consignment');
    if (has('data-return'))
      saving(A.setReturn(t.getAttribute('data-return'), { stage: t.value }), null, 'the return')
        .then(refreshKpis);
    if (has('data-handled'))
      saving(A.setEnquiry(t.getAttribute('data-handled'), { handled: t.checked }),
             null, 'the enquiry').then(refreshKpis);
    if (has('data-set')) {
      var v = t.type === 'checkbox' ? String(t.checked) : t.value;
      saving(A.setSetting(t.getAttribute('data-set'), v),
             t.classList.contains('cell') ? t : null, t.getAttribute('data-set'));
    }
    if (has('data-slot'))
      saving(A.setContent(t.getAttribute('data-slot'), t.value), t, 'the words');
    /* an offer switched off stops at the very next checkout — the database is
       asked again on every order, never the page */
    if (has('data-live'))
      saving(A.setDiscount(t.getAttribute('data-live'), { live: t.checked }), null, 'the offer')
        .then(function () { discounts(); });

    /* ---- the shop windows ---- */

    if (has('data-band')) {
      var bf = t.getAttribute('data-bfield');
      var bp = {};
      bp[bf] = bf === 'sort_order' ? (parseInt(t.value, 10) || 1) : (t.value.trim() || null);
      saving(A.setBand(t.getAttribute('data-band'), bp), t, 'the band');
    }
    if (has('data-bandlive'))
      saving(A.setBand(t.getAttribute('data-bandlive'), { live: t.checked }), null, 'the band');

    if (has('data-nav')) {
      var nf = t.getAttribute('data-nfield');
      var np = {};
      np[nf] = nf === 'sort_order' ? (parseInt(t.value, 10) || 1) : t.value.trim();
      saving(A.setNav(t.getAttribute('data-nav'), np), t, 'the menu');
    }
    if (has('data-navlive'))
      saving(A.setNav(t.getAttribute('data-navlive'), { live: t.checked }), null, 'the menu');

    if (has('data-alt'))
      saving(A.setMedia(t.getAttribute('data-alt'), { alt: t.value.trim() || null }),
             t, 'the description');

    if (has('data-pagefoot'))
      saving(A.setPage(t.getAttribute('data-pagefoot'), { in_footer: t.checked }),
             null, 'the footer');
    if (has('data-col')) {
      var fld = t.getAttribute('data-field');
      var val = fld === 'sort_order' ? (parseInt(t.value, 10) || 0) : t.value;
      var patch = {}; patch[fld] = val;
      saving(A.setCollection(t.getAttribute('data-col'), patch), t, 'the collection');
    }
    if (has('data-colvis'))
      saving(A.setCollection(t.getAttribute('data-colvis'), { visible: t.checked }),
             null, 'the collection');
    if (has('data-code'))
      saving(A.setDiscount(t.getAttribute('data-code'), { live: t.checked }), null, 'the offer');
    if (has('data-imgkind'))
      saving(A.setImage(t.getAttribute('data-imgkind'), { kind: t.value }), t, 'the photograph');

    /* ---- the journal ---- */
    if (has('data-entry')) {
      var ef = t.getAttribute('data-efield');
      var ev = ef === 'sort_order' ? (parseInt(t.value, 10) || 0)
                                   : (t.value.trim() || null);
      var ep = {}; ep[ef] = ev;
      saving(A.setEntry(t.getAttribute('data-entry'), ep), t, ef);
    }
    if (has('data-entrylive')) {
      var onNow = t.checked;
      saving(A.setEntry(t.getAttribute('data-entrylive'), { published: onNow }),
             null, 'publishing')
        .then(function () {
          toast(onNow ? 'Published. It is on the site now.'
                      : 'Taken down. It is still here as a draft.');
        }, function () { t.checked = !onNow; });   /* put the tick back */
    }
    if (has('data-cloth')) {
      var cf = t.getAttribute('data-field');
      var cv = cf === 'mrp' ? (parseInt(t.value, 10) || null) : t.value;
      var cp = {}; cp[cf] = cv;
      saving(A.setProduct(t.getAttribute('data-cloth'), cp), t, cf);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOver();
  });

  function refreshKpis() {
    A.kpis().then(function (k) { KPI = k || {}; drawNav(); }).catch(function () {});
  }

  /* ---------- start ---------- */

  function boot() {
    who.innerHTML = esc(A.email) + ' &middot; <a href="#" id="out">sign out</a>';
    document.getElementById('out').addEventListener('click', function (e) {
      e.preventDefault(); A.signOut(); gate('Signed out.');
    });
    refreshKpis(); drawNav(); render();
  }

  if (A.session()) {
    A.check().then(function (ok) { ok ? boot() : gate('Please sign in again.'); });
  } else gate('');
})();
</script>
<script defer src="/_vercel/insights/script.js"></script>
