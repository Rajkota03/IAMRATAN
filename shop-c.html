<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- A working page: a design experiment or an internal note, deployed so it can be
     looked at and linked from nowhere. On the real domain Google would happily index
     it alongside the shop, so it says so itself — robots.txt is a request a crawler
     may ignore, this is not. -->
<title>I Am Ratan — Rideau</title>
<meta name="description" content="Every door in the shop is a curtain of the cloth itself.">
<meta name="theme-color" content="#EDE9E0">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@100..800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#EDE9E0; --navy:#1C254A; --under:#E3DED2;
  --sans:'Anek Latin',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --gut:clamp(1.1rem,4vw,4rem);
  --swing:cubic-bezier(.2,.9,.25,1);
  --settle:cubic-bezier(.16,1,.3,1);
  --muted:color-mix(in oklab,var(--navy) 62%,transparent);
  --hair:color-mix(in oklab,var(--navy) 16%,transparent);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--sans);font-weight:300;line-height:1.6;
  background:var(--bone);color:var(--navy);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.fig{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;text-transform:uppercase}
.grounds{display:none!important}
.wrap{max-width:1500px;margin-inline:auto;padding-inline:var(--gut)}

.top{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--bone) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);
  padding:var(--s3) var(--gut);max-width:1500px;margin-inline:auto}
.mark{width:36px;aspect-ratio:716/478;display:block;background:currentColor;
  -webkit-mask:url('assets/mark-badger.png') no-repeat center/contain;
  mask:url('assets/mark-badger.png') no-repeat center/contain}
.abc{display:flex;gap:var(--s3)}
.abc a{opacity:.55;padding:var(--s0) var(--s0)}
.abc a[aria-current]{opacity:1;border-bottom:1px solid currentColor}
.bagbtn{display:flex;gap:var(--s1);align-items:baseline;padding:var(--s0) var(--s0)}

.head{padding:var(--clear) 0 var(--s5)}
.head h1{font-weight:200;font-size:clamp(2.6rem,6.5vw,5rem);line-height:.95;
  letter-spacing:-.035em;margin:0}
.head p{margin:var(--s3) 0 0;color:var(--muted);max-width:52ch}

/* ---------- the wall ---------- */
.wall{display:grid;gap:var(--s5) var(--s4);
  grid-template-columns:repeat(2,1fr);padding-bottom:var(--sy)}
@media(min-width:720px){.wall{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.wall{grid-template-columns:repeat(4,1fr)}}
.piece{text-align:left;position:relative}
.piece-shot{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--g)}
.piece-shot img{width:100%;height:100%;object-fit:cover;object-position:center 16%;
  display:block;transition:transform 1.1s var(--settle)}
.piece:hover .piece-shot img{transform:scale(1.04)}
/* the hem: a band of the cloth itself along the bottom of every photograph */
.piece-shot::after{content:'';position:absolute;left:0;right:0;bottom:0;height:8px;
  background:var(--g)}
.piece-nm{margin:var(--s2) 0 0;font-weight:300;font-size:1.05rem;letter-spacing:-.012em}
.piece-pr{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin:var(--s0) 0 0}
/* staggered arrival, page-load only */
.js .piece{opacity:0;transform:translateY(14px)}
.js .piece.in{opacity:1;transform:none;
  transition:opacity .7s var(--settle),transform .7s var(--settle)}

/* ---------- the curtain ---------- */
#curtain{position:fixed;inset:0;z-index:70;background:var(--cc,#1C254A);
  transform:translateX(-102%);pointer-events:none}
#curtain.sweep{transition:transform .55s var(--swing)}
#curtain.cover{transform:translateX(0)}
#curtain.gone{transform:translateX(102%)}
/* the leading edge is pinked, like the swatch it is */
#curtain::after{content:'';position:absolute;top:0;bottom:0;right:-14px;width:14px;
  background:var(--cc,#1C254A);
  clip-path:polygon(0 0,100% 1.5%,0 3%,100% 4.5%,0 6%,100% 7.5%,0 9%,100% 10.5%,0 12%,100% 13.5%,0 15%,100% 16.5%,0 18%,100% 19.5%,0 21%,100% 22.5%,0 24%,100% 25.5%,0 27%,100% 28.5%,0 30%,100% 31.5%,0 33%,100% 34.5%,0 36%,100% 37.5%,0 39%,100% 40.5%,0 42%,100% 43.5%,0 45%,100% 46.5%,0 48%,100% 49.5%,0 51%,100% 52.5%,0 54%,100% 55.5%,0 57%,100% 58.5%,0 60%,100% 61.5%,0 63%,100% 64.5%,0 66%,100% 67.5%,0 69%,100% 70.5%,0 72%,100% 73.5%,0 75%,100% 76.5%,0 78%,100% 79.5%,0 81%,100% 82.5%,0 84%,100% 85.5%,0 87%,100% 88.5%,0 90%,100% 91.5%,0 93%,100% 94.5%,0 96%,100% 97.5%,0 99%,0 100%)}

/* ---------- the room behind the curtain ---------- */
.detail{position:fixed;inset:0;z-index:60;display:none;overflow-y:auto;
  background:var(--dc,#1C254A);color:var(--di,#EDE9E0)}
.detail.open{display:block}
.detail-in{min-height:100%;display:grid;grid-template-rows:auto 1fr;
  padding:var(--s3) var(--gut) var(--s5);max-width:1500px;margin-inline:auto}
.detail-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.detail-top button{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;
  text-transform:uppercase;padding:var(--s1) var(--s0)}
.detail-top button:hover{text-decoration:underline;text-underline-offset:5px}
.detail-body{display:grid;gap:var(--s4);grid-template-columns:1fr;align-content:center}
@media(min-width:920px){.detail-body{grid-template-columns:1fr 1fr;align-items:center;
  gap:var(--sy)}}
.detail-shot{margin:0;width:min(100%,32rem);justify-self:center}
.detail-shot img{width:100%;height:auto;display:block;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.detail-no{font-family:var(--mono);font-size:.6875rem;letter-spacing:.2em;opacity:.62;margin:0}
.detail-nm{font-weight:200;font-size:clamp(2.4rem,5.5vw,4.4rem);line-height:.96;
  letter-spacing:-.035em;margin:var(--s1) 0 0}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s0) var(--s4);
  margin:var(--s4) 0 0;border-top:1px solid currentColor;padding-top:var(--s2);max-width:26rem}
.detail dt{font-family:var(--mono);font-size:.5625rem;letter-spacing:.18em;
  text-transform:uppercase;opacity:.6}
.detail dd{margin:0;font-family:var(--mono);font-size:.8125rem}
.detail-pr{font-family:var(--mono);font-size:1.5rem;margin:var(--s3) 0 0}
.sizes{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s3)}
.sz{width:2.6rem;height:2.6rem;border:1px solid currentColor;font-family:var(--mono);
  font-size:.8125rem;opacity:.62;transition:opacity .25s,background-color .25s,color .25s}
.sz:hover{opacity:1}
.sz.on{opacity:1;background:var(--di);color:var(--dc)}
/* uncut necks are marked by form, not faintness — dimming measured below
   4.5:1 on mid-tone grounds, and these chips are the bespoke entry point */
.sz.uncut{border-style:dashed}
.detail-ctas{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s4)}
.add{border:1px solid currentColor;padding:var(--s2) var(--s5);font-family:var(--mono);
  font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;
  transition:background-color .35s,color .35s}
.add:hover{background:var(--di);color:var(--dc)}
.buy{font-family:var(--mono);font-size:.6875rem;letter-spacing:.14em;
  text-transform:uppercase;opacity:.62;border-bottom:1px solid currentColor;
  padding-bottom:var(--s0)}
.buy:hover{opacity:1}

/* bag + toast */
dialog.bag{border:0;padding:0;background:none;max-width:none;width:min(30rem,92vw)}
dialog.bag::backdrop{background:rgba(20,20,24,.45);backdrop-filter:blur(6px)}
.bag-in{background:#B9A882;color:#1C254A;padding:var(--s4);border-radius:2px 2px 2px 14px;
  font-size:.9rem}
.bag-top{display:flex;justify-content:space-between;align-items:baseline}
.bag-title{font-weight:300;font-size:1.5rem;letter-spacing:-.02em;margin:0}
.bag-x{font-size:1rem;padding:var(--s0)}
.bag-item{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--s2);
  align-items:center;padding:var(--s2) 0;border-bottom:1px solid rgba(28,37,74,.18)}
.bag-sw{width:1.5rem;height:1.5rem;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.bag-nm em{display:block;font-style:normal;font-family:var(--mono);font-size:.6875rem;opacity:.66}
.bag-rm{font-family:var(--mono);border:1px solid rgba(28,37,74,.4);width:1.5rem;height:1.5rem;
  line-height:1;border-radius:50%}
.bag-empty{opacity:.6;padding:var(--s3) 0}
.bag-note{font-size:.75rem;opacity:.75;margin:var(--s3) 0 var(--s1)}
.bag-row{display:flex;justify-content:space-between;font-size:1.05rem;margin:var(--s1) 0 var(--s3)}
.bag-send{display:block;text-align:center;background:#1C254A;color:#EDE9E0;
  padding:var(--s3);font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,140%);z-index:80;
  background:#1C254A;color:#EDE9E0;padding:var(--s2) var(--s3);font-size:.8125rem;
  box-shadow:0 12px 32px rgba(0,0,0,.3);transition:transform .45s var(--swing);
  max-width:min(92vw,30rem)}
.toast.on{transform:translate(-50%,0)}
.toast a{border-bottom:1px solid currentColor}

@media(prefers-reduced-motion:reduce){
  .js .piece{opacity:1;transform:none;transition:none}
  .piece:hover .piece-shot img{transform:none}
  #curtain.sweep{transition:none}
  .toast{transition:none}
}
</style>
</head>
<body data-no-grounds>

<header class="top label">
  <div class="top-in">
    <a href="index.html" aria-label="I Am Ratan — home"><span class="mark"></span></a>
    <nav class="abc" aria-label="Shop versions">
      <a href="shop.html">Salon</a>
      <a href="shop-b.html">Vitrine</a>
      <a href="shop-c.html" aria-current="page">Rideau</a>
    </nav>
    <button class="bagbtn" id="bagBtn" type="button" aria-label="Open cart">
      Cart <span class="fig" data-bag-count>0</span>
    </button>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>The range.</h1>
    <p>Twenty-five colours, and only four of them are white. Every door in this
    shop is a curtain of the cloth itself.</p>
  </div>
  <div class="wall" id="wall"></div>
</main>

<div id="curtain" aria-hidden="true"></div>

<section class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Shirt detail">
  <div class="detail-in">
    <div class="detail-top label">
      <span id="dColl"></span>
      <div style="display:flex;gap:var(--s4)">
        <button type="button" id="dPrev">← Prev</button>
        <button type="button" id="dNext">Next →</button>
        <button type="button" id="dClose">Close</button>
      </div>
    </div>
    <div class="detail-body">
      <div data-sizes id="dInfo"></div>
      <figure class="detail-shot" id="dShot"></figure>
    </div>
  </div>
</section>

<script src="assets/catalogue.js?v=1786945200"></script>
<script src="assets/site.js?v=1786945200"></script>
<script src="assets/shop.js?v=1786945200"></script>
<script>
(function(){
  'use strict';
  var R=IAR.RANGE, reduce=SHOP.reduce;
  document.documentElement.classList.add('js');

  var wall=document.getElementById('wall');
  wall.innerHTML=R.map(function(p,i){
    return '<button class="piece" type="button" data-i="'+i+'" '+
      'aria-label="'+p.name+', '+p.priceText+'">'+
      '<span class="piece-shot" style="--g:'+p.hex+'">'+
        '<img src="images/shirts/'+p.img+'" alt="" loading="'+(i<8?'eager':'lazy')+'" decoding="async">'+
      '</span>'+
      '<span class="piece-nm">'+p.name+'</span>'+
      '<span class="piece-pr">'+p.priceText+'</span>'+
    '</button>';
  }).join('');
  var pieces=[].slice.call(wall.children);
  pieces.forEach(function(el,i){
    setTimeout(function(){el.classList.add('in');},reduce?0:40+i*36);
  });

  /* ---- the curtain ---- */
  var curtain=document.getElementById('curtain'),
      detail=document.getElementById('detail'),
      cur=0, lastPiece=null, sweeping=false;

  function fill(i){
    cur=(i+R.length)%R.length;
    var p=R[cur];
    detail.style.setProperty('--dc',p.hex);
    detail.style.setProperty('--di',p.ink);
    document.getElementById('dColl').textContent=(p.cat||'The range')+' · '+p.no+' of 25';
    document.getElementById('dInfo').innerHTML=
      '<p class="detail-no">'+p.no+' / 25</p>'+
      '<h2 class="detail-nm">'+p.name+'</h2>'+
      '<dl><dt>Colour</dt><dd>'+p.hex+'</dd>'+
      '<dt>Cut</dt><dd>30 measurements · 3 weeks</dd></dl>'+
      '<p class="detail-pr">'+p.priceText+'</p>'+
      '<div class="sizes">'+SHOP.sizes(p)+'</div>'+
      '<div class="detail-ctas">'+
        '<button class="add" type="button" data-add>Add to Cart</button>'+
        '<a class="buy" href="'+p.url+'" rel="noopener">Buy ready-to-wear ↗</a>'+
      '</div>';
    document.getElementById('dInfo').removeAttribute('data-size');
    document.getElementById('dShot').innerHTML=
      '<img src="images/shirts/'+p.img+'" alt="'+p.name+'">';
  }

  /* sweep the cloth across, change the world behind it, sweep it off */
  function sweep(color,between,after){
    if(reduce){between();if(after)after();return;}
    if(sweeping)return; sweeping=true;
    curtain.style.setProperty('--cc',color);
    curtain.classList.add('sweep');
    curtain.classList.remove('gone');
    curtain.classList.add('cover');
    setTimeout(function(){
      between();
      requestAnimationFrame(function(){
        setTimeout(function(){
          curtain.classList.remove('cover');
          curtain.classList.add('gone');
          setTimeout(function(){
            curtain.classList.remove('sweep','gone');
            curtain.style.transform='';
            sweeping=false;
            if(after)after();
          },580);
        },90);
      });
    },580);
  }

  function open(i,piece){
    lastPiece=piece;
    sweep(R[i].hex,function(){
      fill(i);
      detail.classList.add('open');
      document.body.style.overflow='hidden';
    },function(){ document.getElementById('dClose').focus(); });
  }
  function close(){
    sweep(R[cur].hex,function(){
      detail.classList.remove('open');
      document.body.style.overflow='';
    },function(){ if(lastPiece)lastPiece.focus(); });
  }

  wall.addEventListener('click',function(e){
    var c=e.target.closest('.piece'); if(c)open(+c.dataset.i,c);
  });
  document.getElementById('dNext').addEventListener('click',function(){
    sweep(R[(cur+1)%R.length].hex,function(){fill(cur+1);});
  });
  document.getElementById('dPrev').addEventListener('click',function(){
    sweep(R[(cur-1+R.length)%R.length].hex,function(){fill(cur-1);});
  });
  document.getElementById('dClose').addEventListener('click',close);
  addEventListener('keydown',function(e){
    if(!detail.classList.contains('open'))return;
    if(e.key==='Escape'){e.preventDefault();close();}
    if(e.key==='ArrowRight'){e.preventDefault();
      sweep(R[(cur+1)%R.length].hex,function(){fill(cur+1);});}
    if(e.key==='ArrowLeft'){e.preventDefault();
      sweep(R[(cur-1+R.length)%R.length].hex,function(){fill(cur-1);});}
  });

  SHOP.mountBag();
  SHOP.wireSizes(document.getElementById('dInfo'),function(){return R[cur].slug;});
  document.getElementById('bagBtn').addEventListener('click',SHOP.openBag);
})();
</script>
</body>
</html>
