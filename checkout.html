<style>
/* ---------- CHECKOUT ----------
   Guest by default, and there is no account to make. Forced sign-in is the
   second-highest cause of abandoned checkouts — a quarter of people leave over
   it — and on a shop where a man buys two shirts a year an account earns
   nothing. The order is looked up later by its number, not by a password.

   One column on a phone, summary beside the form on a desktop. Nothing here is
   a step or a wizard: every field a buyer must fill is visible at once, because
   a hidden second page is where carts die. */
.head{padding:var(--clear) 0 0}
.co{display:grid;gap:var(--sy);margin:var(--sy) 0 var(--sz);align-items:start}
@media(min-width:900px){.co{grid-template-columns:1.1fr .9fr}}

/* the order, so the buyer can see what they are paying for while they type */
.sum{border:1px solid var(--hair);padding:var(--s4);display:grid;gap:var(--s3)}
.sum h2{margin:0;font-weight:300;font-size:1.15rem;letter-spacing:-.018em}
.line{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);
  align-items:center;padding-bottom:var(--s2);
  border-bottom:1px solid var(--hair)}
.line:last-of-type{border-bottom:0;padding-bottom:0}
.sw{width:1.9rem;height:1.9rem;background:var(--g,#888)}
.ln-nm{display:grid;line-height:1.3;min-width:0}
.ln-nm b{font-weight:300;font-size:.95rem}
.ln-nm span{font-family:var(--mono);font-size:.6875rem;color:var(--muted)}
.ln-pr{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8125rem}
.qty{display:inline-flex;align-items:center;gap:var(--s1)}
.qty button{width:1.9rem;height:1.9rem;border:1px solid var(--hair);
  font-family:var(--mono);font-size:.875rem;display:grid;place-items:center}
.qty button:hover{border-color:currentColor}
.qty b{font-family:var(--mono);font-size:.8125rem;min-width:1.2rem;text-align:center}
.tot{display:grid;gap:var(--s1);padding-top:var(--s3);
  border-top:1px solid var(--ink);font-size:1.15rem}
.tot .tr{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.tot .tr.sub,.tot .tr.off{font-size:.875rem;color:var(--muted)}
.tot .tr.off{color:var(--claret)}
.tot .fig{font-size:1.3rem}

/* the code field. Quiet by default — a loud promo box teaches a customer to
   leave and go looking for a code they were never given. */
.promo{display:grid;gap:var(--s1);margin:var(--s3) 0 var(--s3)}
.promo label{font-size:.8125rem;color:var(--muted)}
.promo-row{display:flex;gap:var(--s1)}
.promo input{flex:1;min-width:0;background:var(--room);border:1px solid var(--hair);
  padding:var(--s2);min-height:2.75rem;font-family:var(--mono);font-size:.875rem;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.promo input:focus{outline:0;border-color:var(--ink)}
.promo button{border:1px solid var(--ink);background:none;color:var(--ink);
  padding:0 var(--s3);min-height:2.75rem;font-family:var(--mono);font-size:.625rem;
  letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.promo button:hover{background:var(--ink);color:var(--room)}
.promo button[disabled]{opacity:.45;cursor:not-allowed}
.promo-note{font-size:.75rem;line-height:1.5}
.promo-note:empty{display:none}
.promo-note.bad{color:var(--claret)}
.promo-note.good{color:#3F6B45}
.inc{font-size:.75rem;color:var(--muted);margin:var(--s0) 0 0}

/* the form. Same proportions as the bespoke one — it was measured there. */
.form{display:grid;gap:var(--s3)}
.pair{display:grid;gap:var(--s2);grid-template-columns:1fr 1fr}
.f{display:grid;gap:var(--s0);margin:0}
.f label{font-size:.8125rem;color:var(--muted);line-height:1.3}
.f input,.f textarea{width:100%;background:var(--room);border:1px solid var(--hair);
  padding:var(--s2);min-height:2.875rem;font-size:1rem;color:var(--ink);
  font-family:inherit;transition:border-color .25s var(--settle)}
.f textarea{min-height:5rem;resize:vertical}
.f input:focus,.f textarea:focus{outline:0;border-color:var(--ink)}
.f input[aria-invalid="true"]{border-color:var(--claret)}
.f .err{font-size:.75rem;line-height:1.4;color:var(--claret)}
.f .err:empty{display:none}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

.pay{width:100%;min-height:3.25rem;background:var(--ink);color:var(--room);
  border:0;font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase;cursor:pointer;margin-top:var(--s1)}
.pay[disabled]{opacity:.45;cursor:not-allowed}
.trust{margin:var(--s2) 0 0;font-size:.75rem;color:var(--muted);line-height:1.6}
.empty-cart{padding:var(--sz) 0;display:grid;gap:var(--s3);justify-items:start}
</style>

<script>
(function () {
  'use strict';
  var root = document.getElementById('co');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  var API = 'https://hckbqcphijihqbysibos.supabase.co/rest/v1/';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhja2JxY3BoaWppaHFieXNpYm9zIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDY1ODQsImV4cCI6MjEwMjI4MjU4NH0.wg5IdL1ArScKk4dWWTtX8xyi8s4Z-1B9gKQQJBvX9V8';

  function api(path, opts) {
    opts = opts || {};
    return fetch(API + path, {
      method: opts.method || 'GET',
      headers: {
        'Content-Type': 'application/json',
        apikey: KEY, Authorization: 'Bearer ' + KEY,
        Prefer: opts.prefer || 'return=minimal'
      },
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      /* Read the body as text first, and only parse it if there is any.
         `Prefer: return=minimal` makes PostgREST answer 201 with an EMPTY body,
         and .json() on an empty body throws — which rejected the whole chain
         and sent every order to WhatsApp before it could reach the gateway.
         Checking for 204 alone was not enough, because 201 is what an insert
         actually returns. */
      return r.text().then(function (t) { return t ? JSON.parse(t) : null; });
    });
  }

  /* ---------- the code ----------
     The page NEVER decides what a code is worth. It asks the database, shows
     the answer, and sends the code — not the discount — with the order. The
     database prices the order again on arrival from its own product table, so
     an edited script cannot buy a shirt for a rupee, and the number quoted here
     and the number charged are the same number by construction. */

  var CODE = { code: '', amount: 0, label: '' };

  function paintTotals() {
    var el = document.getElementById('totals');
    if (!el) return;
    var sub = SHOP.total(), cut = Math.min(CODE.amount || 0, sub);
    el.innerHTML =
      (cut ? '<div class="tr sub"><span>Subtotal</span>' +
               '<span>' + SHOP.rupees(sub) + '</span></div>' +
             '<div class="tr off"><span>' + esc(CODE.code) + '</span>' +
               '<span>&minus;' + SHOP.rupees(cut) + '</span></div>' : '') +
      '<div class="tr"><span>Total</span>' +
        '<b class="fig">' + SHOP.rupees(sub - cut) + '</b></div>';
  }

  function note(msg, good) {
    var n = document.getElementById('codeNote');
    if (!n) return;
    n.textContent = msg || '';
    n.className = 'promo-note' + (msg ? (good ? ' good' : ' bad') : '');
  }

  function applyCode() {
    var input = document.getElementById('code');
    var btn = document.getElementById('applyCode');
    var code = (input.value || '').trim().toUpperCase();
    if (!code) { CODE = { code:'', amount:0, label:'' }; note(''); paintTotals(); return; }

    /* the turning button goes on the control we own. note() prints server text
       with textContent and must stay that way: r.reason is echoed through it. */
    btn.disabled = true; btn.innerHTML = '<span class="wait"></span>'; note('');
    var phoneEl = document.getElementById('ph');
    api('rpc/discount_value', {
      method: 'POST', prefer: 'return=representation',
      body: { in_code: code, in_subtotal: SHOP.total(),
              in_phone: phoneEl ? phoneEl.value.replace(/\D/g, '') : null }
    }).then(function (rows) {
      var r = (rows && rows[0]) || {};
      btn.disabled = false; btn.textContent = 'Apply';
      if (!r.ok) {
        CODE = { code:'', amount:0, label:'' };
        note(r.reason || 'That code did not work.', false);
      } else {
        CODE = { code: code, amount: Number(r.amount) || 0, label: r.label || '' };
        note(CODE.amount
          ? r.label + ' applied.'
          : r.label + ' applied. It comes off the delivery, not the shirts.', true);
      }
      paintTotals();
    }).catch(function () {
      btn.disabled = false;
      CODE = { code:'', amount:0, label:'' };
      /* the shop must never stall on this: an unreachable database means no
         discount, not a blocked checkout */
      btn.disabled = false; btn.textContent = 'Apply';
      note('We could not check that code just now. The order will still go ' +
           'through, and the house will honour a valid code by hand.', false);
      paintTotals();
    });
  }

  /* ---------- the cart, if they walk away ----------
     Written only once somebody has deliberately typed a way to reach them into
     a checkout — never from browsing. The id is random and unguessable, and the
     row can be written but never read back by the shop, so no visitor can ever
     pull somebody else's name and number out of this table. */

  var CART_ID = null;
  function cartId() {
    if (CART_ID) return CART_ID;
    try { CART_ID = sessionStorage.getItem('iar.cart'); } catch (e) {}
    if (!CART_ID) {
      CART_ID = 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      try { sessionStorage.setItem('iar.cart', CART_ID); } catch (e) {}
    }
    return CART_ID;
  }

  var saved = false;
  function keepCart() {
    var g = function (id) {
      var el = document.getElementById(id); return el ? el.value.trim() : '';
    };
    var email = g('em'), phone = g('ph').replace(/\D/g, '');
    if (!email && phone.length < 10) return;          /* nothing to reach them by */
    if (!SHOP.bag.length) return;

    var row = {
      cart_id: cartId(),
      name: (g('fn') + ' ' + g('ln')).trim() || null,
      email: email || null,
      phone: phone || null,
      value: SHOP.total(),
      source: (window.IARTRACK && IARTRACK.from().utm_source) || null,
      items: SHOP.bag.map(function (b) {
        var p = SHOP.find(b.slug);
        return { slug: b.slug, name: p ? p.name : b.slug, size: b.size, qty: b.qty };
      })
    };
    var patch = function () {
      return api('carts?cart_id=eq.' + encodeURIComponent(row.cart_id),
                 { method: 'PATCH', body: row });
    };
    var ok = function () { saved = true; };
    /* Reloading the tab keeps the id but forgets that the row was written, so
       an insert would collide with itself. Falling back to a patch means a
       customer who reloads twice still has one cart, not none. */
    (saved ? patch() : api('carts', { method: 'POST', body: [row] })
               .then(ok, patch))
      .then(ok, function () {});
  }

  /* on blur, not on every keystroke: a half-typed email is not a way to reach
     anybody, and forty rows per checkout is not a record, it is noise */
  document.addEventListener('blur', function (e) {
    if (!e.target.id) return;
    if (['em','ph','fn','ln'].indexOf(e.target.id) > -1) keepCart();
  }, true);

  /* the code field sits outside the form, so Enter would otherwise do nothing
     at all — which reads as a broken field rather than an empty one */
  document.addEventListener('keydown', function (e) {
    if (e.target.id === 'code' && e.key === 'Enter') { e.preventDefault(); applyCode(); }
  });

  function draw() {
    if (!SHOP.bag.length) {
      root.innerHTML =
        '<div class="empty-cart">' +
          '<p class="lede">Your cart is empty.</p>' +
          '<a class="cta" href="shop.html">See the range</a>' +
        '</div>';
      return;
    }

    var lines = SHOP.bag.map(function (b, i) {
      var p = SHOP.find(b.slug);
      return '<div class="line">' +
        '<span class="sw" style="--g:' + (p ? p.hex : '#888') + '"></span>' +
        '<span class="ln-nm"><b>' + esc(p ? p.name : b.slug) + '</b>' +
          '<span>Neck ' + esc(b.size) + '</span></span>' +
        '<span class="qty">' +
          '<button type="button" data-less="' + i + '" aria-label="One fewer">&minus;</button>' +
          '<b>' + b.qty + '</b>' +
          '<button type="button" data-more="' + i + '" aria-label="One more">+</button>' +
        '</span>' +
      '</div>';
    }).join('');

    root.innerHTML =
      '<div class="co">' +
        '<form class="form" id="payForm" novalidate>' +
          '<div class="pair">' +
            '<p class="f"><label for="fn">First name</label>' +
              '<input id="fn" name="fn" autocomplete="given-name" required>' +
              '<span class="err" id="e-fn"></span></p>' +
            '<p class="f"><label for="ln">Last name</label>' +
              '<input id="ln" name="ln" autocomplete="family-name" required>' +
              '<span class="err" id="e-ln"></span></p>' +
          '</div>' +
          '<p class="f"><label for="ph">Mobile</label>' +
            '<input id="ph" name="ph" type="tel" inputmode="numeric" autocomplete="tel" required>' +
            '<span class="err" id="e-ph"></span></p>' +
          '<p class="f"><label for="em">Email</label>' +
            '<input id="em" name="em" type="email" autocomplete="email" required>' +
            '<span class="err" id="e-em"></span></p>' +
          '<p class="f"><label for="ad">Address</label>' +
            '<textarea id="ad" name="ad" autocomplete="street-address" required></textarea>' +
            '<span class="err" id="e-ad"></span></p>' +
          '<div class="pair">' +
            '<p class="f"><label for="ct">City</label>' +
              '<input id="ct" name="ct" autocomplete="address-level2" required>' +
              '<span class="err" id="e-ct"></span></p>' +
            '<p class="f"><label for="pc">PIN code</label>' +
              '<input id="pc" name="pc" inputmode="numeric" autocomplete="postal-code" required>' +
              '<span class="err" id="e-pc"></span></p>' +
          '</div>' +
          /* The state is not decoration. GST is CGST+SGST within Telangana and
             IGST outside it, so the invoice cannot be worked out without this. */
          '<p class="f"><label for="st">State</label>' +
            '<select id="st" name="st" autocomplete="address-level1" required>' +
              '<option value="">Choose</option><option>Andaman & Nicobar</option><option>Andhra Pradesh</option><option>Arunachal Pradesh</option><option>Assam</option><option>Bihar</option><option>Chandigarh</option><option>Chhattisgarh</option><option>Dadra & Nagar Haveli and Daman & Diu</option><option>Delhi</option><option>Goa</option><option>Gujarat</option><option>Haryana</option><option>Himachal Pradesh</option><option>Jammu & Kashmir</option><option>Jharkhand</option><option>Karnataka</option><option>Kerala</option><option>Ladakh</option><option>Lakshadweep</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Manipur</option><option>Meghalaya</option><option>Mizoram</option><option>Nagaland</option><option>Odisha</option><option>Puducherry</option><option>Punjab</option><option>Rajasthan</option><option>Sikkim</option><option>Tamil Nadu</option><option>Telangana</option><option>Tripura</option><option>Uttar Pradesh</option><option>Uttarakhand</option><option>West Bengal</option></select>' +
            '<span class="err" id="e-st"></span></p>' +
          '<p class="hp"><label for="company">Company</label>' +
            '<input id="company" name="company" tabindex="-1" autocomplete="off"></p>' +
          '<button class="pay" type="submit" id="payBtn">Place the order</button>' +
          '<p class="trust" id="trust"></p>' +
        '</form>' +

        '<aside class="sum">' +
          '<h2>What you are ordering</h2>' +
          lines +
          '<div class="promo">' +
            '<label for="code">Have a code?</label>' +
            '<span class="promo-row">' +
              '<input id="code" name="code" autocomplete="off" ' +
                'placeholder="SUMMER10" value="' + esc(CODE.code) + '">' +
              '<button type="button" id="applyCode">Apply</button>' +
            '</span>' +
            '<span class="promo-note" id="codeNote"></span>' +
          '</div>' +
          '<div class="tot" id="totals"></div>' +
          '<p class="inc">Inclusive of all taxes.' +
            '<span id="ship"></span></p>' +
        '</aside>' +
      '</div>';

    paintTotals();
    /* the basket can change under an applied code — drop below the minimum
       spend and it must stop applying on screen, not only in the database */
    if (CODE.code) applyCode();

    var S = window.IARSTORE;
    if (S) S.ready.then(function (st) {
      if (!st.live) return;
      var el = document.getElementById('ship');
      if (el) el.textContent = ' ' + st.deliveryLine() + '.';
    });

    /* Until Razorpay is live the order is completed in writing — the same
       handoff the house already uses. The button says exactly what it does, so
       nobody taps expecting a card form. When the gateway is wired this
       function is the only thing that changes. */
    var trust = document.getElementById('trust');
    trust.innerHTML = 'The house confirms every order before it is made. ' +
      'Card and UPI payment is being connected. Until then your order reaches ' +
      'the house directly and payment is arranged with you.';

    /* The form is rebuilt whenever the bag changes, so anything typed has to be
       put back each time, not only on first load. */
    restoreFields();
  }

  /* -------------------------------------------- the details, remembered --
     A customer who types their address and then leaves the page — handed to
     WhatsApp, sent to the payment window, or simply pressing back — should not
     come back to an empty form and have to type it all again. Their own
     details, in their own browser, never sent anywhere until they place the
     order. Cleared the moment an order is placed.

     This was found the hard way: the WhatsApp fallback navigates away, and
     coming back looked exactly like the form had crashed. */
  var REMEMBER = 'iar-checkout-details';

  function rememberFields() {
    try {
      var out = {};
      FIELDS().forEach(function (id) {
        var el = document.getElementById(id);
        if (el && el.value) out[id] = el.value;
      });
      localStorage.setItem(REMEMBER, JSON.stringify(out));
    } catch (e) { /* private browsing, a full disk — never worth breaking for */ }
  }

  function restoreFields() {
    try {
      var saved = JSON.parse(localStorage.getItem(REMEMBER) || '{}');
      FIELDS().forEach(function (id) {
        var el = document.getElementById(id);
        if (el && !el.value && saved[id]) el.value = saved[id];
      });
    } catch (e) {}
  }

  function forgetFields() {
    try { localStorage.removeItem(REMEMBER); } catch (e) {}
  }

  function FIELDS() {
    return RULES.map(function (r) { return r[0]; });
  }

  /* One listener on the form rather than one per field, so it keeps working
     when the form is redrawn — which it is, every time the bag changes. */
  document.addEventListener('input', function (e) {
    if (e.target && e.target.closest && e.target.closest('#payForm')) rememberFields();
  });

  var RULES = [
    ['fn', function (v) { return v.trim().length >= 2; }, 'Please give your first name.'],
    ['ln', function (v) { return v.trim().length >= 1; }, 'Please give your last name.'],
    ['ph', function (v) { return v.replace(/\D/g, '').length >= 10; },
      'That does not look like a full mobile number. Ten digits or more.'],
    ['em', function (v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()); },
      'That email address is missing something. Check for a typo.'],
    ['ad', function (v) { return v.trim().length >= 8; }, 'We need somewhere to send it.'],
    ['ct', function (v) { return v.trim().length >= 2; }, 'Which city?'],
    ['pc', function (v) { return /^\d{6}$/.test(v.replace(/\s/g, '')); },
      'An Indian PIN code is six digits.'],
    ['st', function (v) { return !!v; }, 'Which state?']
  ];

  document.addEventListener('click', function (e) {
    if (e.target.id === 'applyCode') { applyCode(); return; }

    var less = e.target.closest('[data-less]'), more = e.target.closest('[data-more]');
    if (!less && !more) return;
    var i = +(less || more).getAttribute(less ? 'data-less' : 'data-more');
    var item = SHOP.bag[i];
    if (!item) return;
    /* setQty owns the saving and the redraw; going to zero removes the line */
    SHOP.setQty(i, item.qty + (more ? 1 : -1));
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'payForm') return;
    e.preventDefault();
    if (document.getElementById('company').value) return;   /* a bot filled the trap */

    var ok = true, first = null;
    RULES.forEach(function (r) {
      var el = document.getElementById(r[0]), err = document.getElementById('e-' + r[0]);
      var good = r[1](el.value);
      err.textContent = good ? '' : r[2];
      el.setAttribute('aria-invalid', good ? 'false' : 'true');
      if (!good && !first) first = el;
      if (!good) ok = false;
    });
    if (!ok) { first.focus(); return; }

    var g = function (id) { return document.getElementById(id).value.trim(); };
    var body =
      'A new order from the website.\n\n' +
      SHOP.bag.map(function (b) {
        var p = SHOP.find(b.slug);
        return '  ' + (p ? p.name : b.slug) + '  ·  neck ' + b.size +
               '  ·  x' + b.qty + '  ·  ' + (p ? p.priceText : '');
      }).join('\n') +
      (CODE.code && CODE.amount
        ? '\n\n  Subtotal  ' + SHOP.rupees(SHOP.total()) +
          '\n  ' + CODE.code + '  -' + SHOP.rupees(CODE.amount) : '') +
      '\n\n  Total  ' + SHOP.rupees(SHOP.total() - (CODE.amount || 0)) +
      '\n\nName   ' + g('fn') + ' ' + g('ln') +
      '\nMobile ' + g('ph') +
      '\nEmail  ' + g('em') +
      '\nAddress\n' + g('ad') + '\n' + g('ct') + ' ' + g('pc') +
      '\n' + g('st') + '\n';

    var from = (window.IARTRACK && window.IARTRACK.from()) || {};

    if (window.IARTRACK) window.IARTRACK.track('order_placed', {
      items: SHOP.count(), value: SHOP.total() - (CODE.amount || 0),
      code: CODE.code || '', source: from.utm_source || 'direct'
    });

    /* A reference the customer can quote on the phone, and the house can find.
       Date first so a list of them sorts itself; the tail is random so two
       orders in the same minute cannot collide. */
    var d = new Date();
    var ref = 'IAR-' + d.getFullYear().toString().slice(2) +
      String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') +
      '-' + Math.random().toString(36).slice(2, 6).toUpperCase();

    var order = {
      ref: ref,
      name: g('fn') + ' ' + g('ln'),
      phone: g('ph'),
      email: g('em'),
      address: g('ad'),
      city: g('ct'),
      pincode: g('pc'),
      state: g('st'),
      /* sent for the record only — the database recomputes both from its own
         prices and its own coupon rules the moment this row lands */
      total: SHOP.total() - (CODE.amount || 0),
      discount_code: CODE.code || null,
      utm_source: from.utm_source || null,
      utm_medium: from.utm_medium || null,
      utm_campaign: from.utm_campaign || null,
      items: SHOP.bag.map(function (b) {
        var p = SHOP.find(b.slug);
        return { slug: b.slug, name: p ? p.name : b.slug, size: b.size,
                 qty: b.qty, price: p ? p.price : 0 };
      })
    };

    var msg = body.replace('A new order from the website.',
                           'A new order from the website.\n\n  Reference  ' + ref);
    var go = function () {
      location.href = 'https://wa.me/918282826264?text=' + encodeURIComponent(msg);
    };

    /* Record it, then try to take the money. The order must never be lost
       because something downstream was asleep, so every failure below still
       ends at WhatsApp — the house gets the order either way. */
    var btn = document.getElementById('payBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="wait">Placing the order</span>';
    api('orders', { method: 'POST', body: [order] })
      .then(function () {
        /* the cart they left is now a sale — stamped so it stops appearing on
           the chase list and starts counting as recovered */
        if (CART_ID && saved) {
          return api('carts?cart_id=eq.' + encodeURIComponent(CART_ID),
            { method: 'PATCH', body: { recovered: ref } }).catch(function () {});
        }
      })
      .then(function () { return pay(ref, go); },
            function (err) {
              /* The order is safe in the database or it is not; either way the
                 customer must not be stranded. Log the reason, then hand over. */
              console.error('[checkout] could not reach the gateway ·', err);
              return go();
            });
  });

  /* ------------------------------------------------------ taking the money --
     Everything here is written so the order survives it.

     If the gateway is not configured yet, /api/pay/create answers 502 and this
     hands straight to WhatsApp — which is exactly how the house worked before
     any of this existed. That is deliberate: the code can ship long before the
     keys do, and the day they land the same page starts taking cards with no
     further change.

     The amount is not passed in. The server reads it from the order row, so
     nothing this page says can decide what anybody pays. */

  function loadCheckout() {
    if (window.Razorpay) return Promise.resolve(true);
    return new Promise(function (resolve) {
      var s = document.createElement('script');
      s.src = 'https://checkout.razorpay.com/v1/checkout.js';
      s.onload = function () { resolve(true); };
      s.onerror = function () { resolve(false); };   /* offline, or blocked */
      document.head.appendChild(s);
    });
  }

  function pay(ref, fallback) {
    return fetch('/api/pay/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: ref })
    })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (intent) {
      if (!intent || !intent.ok) return fallback();      /* not wired up yet */
      return loadCheckout().then(function (ready) {
        if (!ready) return fallback();
        openModal(intent, ref, fallback);
      });
    })
    .catch(fallback);
  }

  function payButton() { return document.getElementById('payBtn'); }
  function resting() {
    var b = payButton();
    if (b) { b.disabled = false; b.innerHTML = 'Place the order'; }
  }
  function working(label) {
    var b = payButton();
    if (b) { b.disabled = true; b.innerHTML = '<span class="wait">' + label + '</span>'; }
  }

  function openModal(intent, ref, fallback) {
    resting();

    var rzp = new window.Razorpay({
      key: intent.key_id,
      order_id: intent.order_id,
      amount: intent.amount,
      currency: intent.currency,
      name: 'I Am Ratan',
      description: 'Order ' + ref,
      prefill: intent.prefill,
      notes: { ref: ref },
      theme: { color: '#0B0C0E' },
      handler: function (r) {
        /* Razorpay says it worked. Only the server may decide whether to
           believe that, so the page does not celebrate until it answers. */
        working('Confirming');
        fetch('/api/pay/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ref: ref,
            razorpay_order_id: r.razorpay_order_id,
            razorpay_payment_id: r.razorpay_payment_id,
            razorpay_signature: r.razorpay_signature
          })
        })
        .then(function (x) { return x.json(); })
        .then(function (out) {
          if (out && out.ok) { paid(ref); }
          else { fallback(); }
        })
        .catch(function () {
          /* The money is taken; only our confirmation is missing. The webhook
             settles it within seconds. Never tell them it failed. */
          paid(ref);
        });
      },
      modal: {
        ondismiss: function () {          /* they closed it without paying */
          resting();
          note('The payment was not completed. Your order is saved — you can ' +
               'pay now, or send it to us on WhatsApp instead.');
        }
      }
    });

    rzp.on('payment.failed', function (e) {
      note('That payment did not go through' +
           (e && e.error && e.error.description ? ': ' + e.error.description : '') +
           '. Your order is saved.');
      resting();
    });

    rzp.open();
  }

  function paid(ref) {
    var main = document.querySelector('main') || document.body;
    main.innerHTML =
      '<div class="wrap" style="padding:var(--clear) 0 var(--sz);max-width:34rem">' +
      '<p class="label muted">Thank you</p>' +
      '<h1 class="display" style="margin-top:var(--s2)">Your order is placed.</h1>' +
      '<p style="margin-top:var(--s4);line-height:1.75">We have your payment and ' +
      'your order. Your reference is <strong>' + ref + '</strong> — quote it if ' +
      'you write or call.</p>' +
      '<p style="margin-top:var(--s3);line-height:1.75">We will be in touch as ' +
      'soon as it is cut.</p>' +
      '<p style="margin-top:var(--s5)"><a class="cta" href="shop.html">See the range</a></p>' +
      '</div>';
    if (window.SHOP && SHOP.clear) SHOP.clear();
    forgetFields();          /* the order is placed; stop holding their address */
    window.scrollTo(0, 0);
  }

  SHOP.on(draw);
  draw();
})();
</script>
