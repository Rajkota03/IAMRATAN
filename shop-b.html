<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<!-- A working page: a design experiment or an internal note, deployed so it can be
     looked at and linked from nowhere. On the real domain Google would happily index
     it alongside the shop, so it says so itself — robots.txt is a request a crawler
     may ignore, this is not. -->
<title>I Am Ratan — Vitrine</title>
<meta name="description" content="The range on one rail. A card lifts off the shelf and becomes the page.">
<meta name="theme-color" content="#101214">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@100..800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --room:#101214; --ink:#EDE9E0;
  --sans:'Anek Latin',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --gut:clamp(1.1rem,4vw,4rem);
  --swing:cubic-bezier(.2,.9,.25,1);
  --settle:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-weight:300;line-height:1.55;
  background:var(--room);color:var(--ink);-webkit-font-smoothing:antialiased;
  overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.fig{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;text-transform:uppercase}
.grounds{display:none!important}

.top{position:fixed;inset:0 0 auto 0;z-index:40;display:flex;align-items:center;
  justify-content:space-between;gap:var(--s3);padding:var(--s3) var(--gut)}
.mark{width:36px;aspect-ratio:716/478;display:block;background:currentColor;
  -webkit-mask:url('assets/mark-badger.png') no-repeat center/contain;
  mask:url('assets/mark-badger.png') no-repeat center/contain}
.abc{display:flex;gap:var(--s3)}
.abc a{opacity:.55;padding:var(--s0) var(--s0)}
.abc a[aria-current]{opacity:1;border-bottom:1px solid currentColor}
.bagbtn{display:flex;gap:var(--s1);align-items:baseline;padding:var(--s0) var(--s0)}

/* ---------- the shelf ---------- */
.stage{position:fixed;inset:0;display:grid;grid-template-rows:1fr auto;
  padding:var(--sy) 0 var(--s4)}
.shelfwrap{overflow:hidden;display:grid;align-items:center;cursor:grab}
.shelfwrap.drag{cursor:grabbing}
.shelf{display:flex;gap:var(--s5);padding-inline:var(--gut);
  will-change:transform;align-items:center}
.card{flex:0 0 auto;width:clamp(210px,23vw,320px);text-align:left;position:relative}
.card-shot{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--g);
  box-shadow:0 22px 50px rgba(0,0,0,.45);
  transition:transform .6s var(--swing),box-shadow .6s var(--swing)}
.card:hover .card-shot{transform:translateY(-8px) rotate(-.6deg);
  box-shadow:0 34px 70px rgba(0,0,0,.55)}
.card-shot img{width:100%;height:100%;object-fit:cover;object-position:center 16%;
  display:block}
.card-no{position:absolute;left:.6rem;top:.55rem;font-family:var(--mono);
  font-size:.5625rem;letter-spacing:.14em;color:#fff;mix-blend-mode:difference;z-index:2}
.card-nm{margin:var(--s2) 0 0;font-weight:300;font-size:1.05rem;letter-spacing:-.012em}
.card-pr{font-family:var(--mono);font-size:.75rem;opacity:.62;margin:var(--s0) 0 0}

.railline{margin:var(--s3) var(--gut) 0;height:1px;background:rgba(237,233,224,.16);
  position:relative}
.railline i{position:absolute;top:-1px;left:0;height:3px;background:var(--ink);
  width:4%;transform-origin:left}
.hint{display:flex;justify-content:space-between;margin:var(--s3) var(--gut) 0;
  color:rgba(237,233,224,.6)}

/* ---------- the lift: a card becomes the page ---------- */
.ghost{position:fixed;z-index:70;pointer-events:none;overflow:hidden;
  box-shadow:0 34px 80px rgba(0,0,0,.6)}
.ghost img{width:100%;height:100%;object-fit:cover;object-position:center 16%}

.sheet{position:fixed;inset:0;z-index:60;display:none;background:var(--sc,#1C254A);
  color:var(--si,#EDE9E0);opacity:0;transition:opacity .45s var(--settle)}
.sheet.open{display:block}
.sheet.shown{opacity:1}
.sheet-in{height:100%;display:grid;grid-template-rows:auto 1fr;gap:var(--s1);
  padding:var(--s3) var(--gut) var(--s5);max-width:1500px;margin-inline:auto}
.sheet-top{display:flex;justify-content:space-between;align-items:center}
.sheet-top button{font-family:var(--mono);font-size:.625rem;letter-spacing:.2em;
  text-transform:uppercase;padding:var(--s1) var(--s0)}
.sheet-top button:hover{text-decoration:underline;text-underline-offset:5px}
.sheet-body{display:grid;gap:var(--s4);grid-template-columns:1fr;align-items:center;
  overflow-y:auto;min-height:0}
@media(min-width:920px){.sheet-body{grid-template-columns:1fr 1fr;gap:var(--sy)}}
.sheet-shot{margin:0;width:min(100%,32rem);justify-self:center;visibility:hidden}
.sheet-shot.landed{visibility:visible}
.sheet-shot img{width:100%;height:auto;display:block;box-shadow:0 30px 70px rgba(0,0,0,.4)}
.sheet-no{font-family:var(--mono);font-size:.6875rem;letter-spacing:.2em;opacity:.62;margin:0}
.sheet-nm{font-weight:200;font-size:clamp(2.4rem,5.5vw,4.4rem);line-height:.96;
  letter-spacing:-.035em;margin:var(--s1) 0 0}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:var(--s0) var(--s4);
  margin:var(--s4) 0 0;border-top:1px solid currentColor;padding-top:var(--s2);max-width:26rem}
.sheet dt{font-family:var(--mono);font-size:.5625rem;letter-spacing:.18em;
  text-transform:uppercase;opacity:.6}
.sheet dd{margin:0;font-family:var(--mono);font-size:.8125rem}
.sheet-pr{font-family:var(--mono);font-size:1.5rem;margin:var(--s3) 0 0}
.sizes{display:flex;gap:var(--s1);flex-wrap:wrap;margin-top:var(--s3)}
.sz{width:2.6rem;height:2.6rem;border:1px solid currentColor;font-family:var(--mono);
  font-size:.8125rem;opacity:.62;transition:opacity .25s,background-color .25s,color .25s}
.sz:hover{opacity:1}
.sz.on{opacity:1;background:var(--si);color:var(--sc)}
/* uncut necks are marked by form, not faintness — dimming measured below
   4.5:1 on mid-tone grounds, and these chips are the bespoke entry point */
.sz.uncut{border-style:dashed}
.sheet-ctas{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s4)}
.add{border:1px solid currentColor;padding:var(--s2) var(--s5);font-family:var(--mono);
  font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;
  transition:background-color .35s,color .35s}
.add:hover{background:var(--si);color:var(--sc)}
.buy{font-family:var(--mono);font-size:.6875rem;letter-spacing:.14em;
  text-transform:uppercase;opacity:.62;border-bottom:1px solid currentColor;
  padding-bottom:var(--s0)}
.buy:hover{opacity:1}

/* bag + toast (manila docket, as everywhere) */
dialog.bag{border:0;padding:0;background:none;max-width:none;width:min(30rem,92vw)}
dialog.bag::backdrop{background:rgba(10,10,12,.55);backdrop-filter:blur(6px)}
.bag-in{background:#B9A882;color:#1C254A;padding:var(--s4);border-radius:2px 2px 2px 14px;
  font-size:.9rem}
.bag-top{display:flex;justify-content:space-between;align-items:baseline}
.bag-title{font-weight:300;font-size:1.5rem;letter-spacing:-.02em;margin:0}
.bag-x{font-size:1rem;padding:var(--s0)}
.bag-item{display:grid;grid-template-columns:auto 1fr auto auto;gap:var(--s2);
  align-items:center;padding:var(--s2) 0;border-bottom:1px solid rgba(28,37,74,.18)}
.bag-sw{width:1.5rem;height:1.5rem;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.bag-nm em{display:block;font-style:normal;font-family:var(--mono);font-size:.6875rem;opacity:.66}
.bag-rm{font-family:var(--mono);border:1px solid rgba(28,37,74,.4);width:1.5rem;height:1.5rem;
  line-height:1;border-radius:50%}
.bag-empty{opacity:.6;padding:var(--s3) 0}
.bag-note{font-size:.75rem;opacity:.75;margin:var(--s3) 0 var(--s1)}
.bag-row{display:flex;justify-content:space-between;font-size:1.05rem;margin:var(--s1) 0 var(--s3)}
.bag-send{display:block;text-align:center;background:#1C254A;color:#EDE9E0;
  padding:var(--s3);font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:1.4rem;transform:translate(-50%,140%);z-index:80;
  background:#16181B;color:#EDE9E0;padding:var(--s2) var(--s3);font-size:.8125rem;
  box-shadow:0 12px 32px rgba(0,0,0,.4);transition:transform .45s var(--swing);
  max-width:min(92vw,30rem)}
.toast.on{transform:translate(-50%,0)}
.toast a{border-bottom:1px solid currentColor}

@media(prefers-reduced-motion:reduce){
  .card:hover .card-shot{transform:none}
  .ghost{transition:none!important}
  .toast,.sheet{transition:none}
}
</style>
</head>
<body data-no-grounds>

<header class="top label">
  <a href="index.html" aria-label="I Am Ratan — home"><span class="mark"></span></a>
  <nav class="abc" aria-label="Shop versions">
    <a href="shop.html">Salon</a>
    <a href="shop-b.html" aria-current="page">Vitrine</a>
    <a href="shop-c.html">Rideau</a>
  </nav>
  <button class="bagbtn" id="bagBtn" type="button" aria-label="Open cart">
    Cart <span class="fig" data-bag-count>0</span>
  </button>
</header>

<div class="stage">
  <div class="shelfwrap" id="wrap">
    <div class="shelf" id="shelf"></div>
  </div>
  <div>
    <div class="railline"><i id="prog"></i></div>
    <div class="hint label">
      <span>Drag, scroll or arrow through the range</span>
      <span class="fig" id="count"></span>
    </div>
  </div>
</div>

<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Shirt detail">
  <div class="sheet-in">
    <div class="sheet-top label">
      <span id="shColl"></span>
      <div style="display:flex;gap:var(--s4)">
        <button type="button" id="shPrev">← Prev</button>
        <button type="button" id="shNext">Next →</button>
        <button type="button" id="shClose">Close</button>
      </div>
    </div>
    <div class="sheet-body">
      <div data-sizes id="shInfo"></div>
      <figure class="sheet-shot" id="shShot"></figure>
    </div>
  </div>
</section>

<script src="assets/catalogue.js?v=1787841087"></script>
<script src="assets/site.js?v=1787841087"></script>
<script src="assets/shop.js?v=1787841087"></script>
<script>
(function(){
  'use strict';
  var R=IAR.RANGE, reduce=SHOP.reduce;
  document.documentElement.classList.add('js');

  /* ---- the shelf ---- */
  var shelf=document.getElementById('shelf'), wrap=document.getElementById('wrap');
  shelf.innerHTML=R.map(function(p,i){
    return '<button class="card" type="button" data-i="'+i+'" '+
      'aria-label="'+p.name+', '+p.priceText+'">'+
      '<span class="card-shot" style="--g:'+p.hex+'">'+
        '<span class="card-no">'+p.no+'</span>'+
        '<img src="images/shirts/'+p.img+'" alt="" loading="'+(i<6?'eager':'lazy')+'" decoding="async">'+
      '</span>'+
      '<span class="card-nm">'+p.name+'</span>'+
      '<span class="card-pr">'+p.priceText+'</span>'+
    '</button>';
  }).join('');
  document.getElementById('count').textContent='25 cloths';

  /* drag + wheel + momentum, all in one coordinate space */
  var x=0,vx=0,min=0,drag=false,px=0,moved=0;
  function bounds(){min=Math.min(0,wrap.clientWidth-shelf.scrollWidth-1);}
  function tick(){
    if(!drag){x+=vx;vx*=0.93;if(Math.abs(vx)<0.02)vx=0;}
    if(x>0){x*=0.8;vx=0;}
    if(x<min){x+=(min-x)*0.2;vx=0;}
    shelf.style.transform='translate3d('+x.toFixed(1)+'px,0,0)';
    var p=min?x/min:0;
    document.getElementById('prog').style.transform='translateX('+(p*(wrap.clientWidth*0.96-40)).toFixed(0)+'px)';
    requestAnimationFrame(tick);
  }
  wrap.addEventListener('pointerdown',function(e){
    drag=true;moved=0;px=e.clientX;vx=0;wrap.classList.add('drag');
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',function(e){
    if(!drag)return;var d=e.clientX-px;px=e.clientX;x+=d;vx=d;moved+=Math.abs(d);
  });
  ['pointerup','pointercancel'].forEach(function(ev){
    wrap.addEventListener(ev,function(){drag=false;wrap.classList.remove('drag');});
  });
  addEventListener('wheel',function(e){
    if(sheet.classList.contains('open'))return;
    x-=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*0.9;vx=0;
  },{passive:true});
  addEventListener('resize',bounds);

  /* ---- the lift: FLIP from card to sheet ---- */
  var sheet=document.getElementById('sheet'), cur=0, fromCard=null;

  function fill(i){
    cur=(i+R.length)%R.length;
    var p=R[cur];
    sheet.style.setProperty('--sc',p.hex);
    sheet.style.setProperty('--si',p.ink);
    document.getElementById('shColl').textContent=(p.cat||'The range')+' · '+p.no+' of 25';
    document.getElementById('shInfo').innerHTML=
      '<p class="sheet-no">'+p.no+' / 25</p>'+
      '<h2 class="sheet-nm">'+p.name+'</h2>'+
      '<dl><dt>Colour</dt><dd>'+p.hex+'</dd>'+
      '<dt>Cut</dt><dd>30 measurements · 3 weeks</dd></dl>'+
      '<p class="sheet-pr">'+p.priceText+'</p>'+
      '<div class="sizes">'+SHOP.sizes(p)+'</div>'+
      '<div class="sheet-ctas">'+
        '<button class="add" type="button" data-add>Add to Cart</button>'+
        '<a class="buy" href="'+p.url+'" rel="noopener">Buy ready-to-wear ↗</a>'+
      '</div>';
    document.getElementById('shInfo').removeAttribute('data-size');
    document.getElementById('shShot').innerHTML=
      '<img src="images/shirts/'+p.img+'" alt="'+p.name+'">';
  }

  function open(i,card){
    fromCard=card;
    fill(i);
    sheet.classList.add('open');
    var shot=document.getElementById('shShot');
    shot.classList.remove('landed');

    if(!reduce&&card){
      var img=card.querySelector('.card-shot');
      var r0=img.getBoundingClientRect();
      var g=document.createElement('div');
      g.className='ghost';
      g.style.cssText='left:'+r0.left+'px;top:'+r0.top+'px;width:'+r0.width+
        'px;height:'+r0.height+'px;transition:all .6s cubic-bezier(.2,.9,.25,1)';
      g.innerHTML='<img src="'+card.querySelector('img').src+'" alt="">';
      document.body.appendChild(g);
      requestAnimationFrame(function(){
        sheet.classList.add('shown');
        requestAnimationFrame(function(){
          var r1=shot.getBoundingClientRect();
          if(r1.width===0){ shot.classList.add('landed'); g.remove(); return; }
          g.style.left=r1.left+'px'; g.style.top=r1.top+'px';
          g.style.width=r1.width+'px'; g.style.height=r1.height+'px';
        });
      });
      setTimeout(function(){shot.classList.add('landed');g.remove();},640);
    }else{
      sheet.classList.add('shown');
      shot.classList.add('landed');
    }
    document.getElementById('shClose').focus();
  }
  function close(){
    sheet.classList.remove('shown');
    setTimeout(function(){sheet.classList.remove('open');},450);
    if(fromCard)fromCard.focus();
  }

  shelf.addEventListener('click',function(e){
    var c=e.target.closest('.card');
    if(!c||moved>6)return;
    open(+c.dataset.i,c);
  });
  document.getElementById('shNext').addEventListener('click',function(){fill(cur+1);
    document.getElementById('shShot').classList.add('landed');});
  document.getElementById('shPrev').addEventListener('click',function(){fill(cur-1);
    document.getElementById('shShot').classList.add('landed');});
  document.getElementById('shClose').addEventListener('click',close);
  addEventListener('keydown',function(e){
    if(sheet.classList.contains('open')){
      if(e.key==='Escape'){e.preventDefault();close();}
      if(e.key==='ArrowRight'){e.preventDefault();fill(cur+1);
        document.getElementById('shShot').classList.add('landed');}
      if(e.key==='ArrowLeft'){e.preventDefault();fill(cur-1);
        document.getElementById('shShot').classList.add('landed');}
    }else{
      if(e.key==='ArrowRight')x-=140;
      if(e.key==='ArrowLeft')x+=140;
    }
  });

  SHOP.mountBag();
  SHOP.wireSizes(document.getElementById('shInfo'),function(){return R[cur].slug;});
  document.getElementById('bagBtn').addEventListener('click',SHOP.openBag);

  bounds();tick();
})();
</script>
</body>
</html>
