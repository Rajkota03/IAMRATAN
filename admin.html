        (rows.length
        ? '<div class="scroll"><table><thead><tr><th>Name</th><th>Blurb</th>' +
          '<th>Order</th><th>Shown</th></tr></thead><tbody>' +
          rows.map(function (c) {
            return '<tr><td>' + esc(c.name) + '<br><span class="muted">' +
                esc(c.slug) + '</span></td>' +
              '<td><input class="cell wide" value="' + esc(c.blurb || '') +
                '" data-col="' + c.id + '" data-field="blurb"></td>' +
              '<td><input class="cell" type="number" style="width:4rem" value="' +
                (c.sort_order || 0) + '" data-col="' + c.id + '" data-field="sort_order"></td>' +
              '<td><label class="tick"><input type="checkbox" data-colvis="' + c.id +
                '"' + (c.visible ? ' checked' : '') + '></label></td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">No collections yet.</p>'));

      document.getElementById('newcol').addEventListener('submit', function (e) {
        e.preventDefault();
        var name = e.target.elements.name.value.trim();
        if (!name) return;
        A.addCollection({
          name: name,
          slug: name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''),
          sort_order: rows.length + 1
        }).then(collections);
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ================================ MARKETING ================================
     WHAT IS MEASURED HERE AND WHAT IS NOT.

     Revenue, orders, channels and carts are counted from things that actually
     happened. ROAS is left blank until somebody types in what they spent,
     because no database can know an ad bill, and a dashboard that invents one
     is worse than a dashboard that admits it does not know.

     There is no open rate and no click rate anywhere in this section. Measuring
     those needs a mail provider, there isn't one yet, and a fabricated 32%
     would get read as a fact and planned against. */

  /* A ring drawn with one circle per slice. No chart library, same as the
     revenue line — the project has no dependencies and two graphs are still
     not a reason to start. */
  function donut(rows, total) {
    var R = 54, C = 2 * Math.PI * R, at = 0;
    var TONE = ['#2F6F5B','#B08A46','#7A6A9B','#A65A4A','#5B7C99','#8A8578'];
    if (!total) return '<p class="empty">Nothing to draw yet.</p>';
    return '<svg class="donut" viewBox="0 0 140 140" aria-hidden="true">' +
      rows.map(function (r, i) {
        var share = Number(r.revenue || 0) / total;
        var seg = '<circle cx="70" cy="70" r="' + R + '" stroke="' +
          TONE[i % TONE.length] + '" stroke-dasharray="' +
          (share * C).toFixed(1) + ' ' + C.toFixed(1) + '" stroke-dashoffset="' +
          (-at * C).toFixed(1) + '"/>';
        at += share;
        return seg;
      }).join('') + '</svg>';
  }

  function marketing() {
    Promise.all([A.marketing(), A.channels(), A.activity(), A.cartStats()])
      .then(function (r) {
        var m = r[0] || {}, chans = r[1] || [], acts = r[2] || [], carts = r[3] || {};
        var total = chans.reduce(function (a, c) { return a + Number(c.revenue || 0); }, 0);

        var figs = [
          ['money', 'Revenue from marketing', rupees(m.revenue),
            deltaHTML(pct(m.revenue, m.revenue_before)), false],
          ['cart', 'Orders from marketing', m.orders || 0,
            deltaHTML(pct(m.orders, m.orders_before)), false],
          ['customers', 'New customers', m.new_customers || 0,
            '<span class="delta flat">first order in 30 days</span>', false],
          ['rise', 'Return on ad spend', m.roas ? m.roas + '×' : '—',
            m.roas ? '<span class="delta flat">on ' + rupees(m.spent) + ' spent</span>'
                   : '<span class="delta flat">enter your ad spend below</span>',
            false]
        ].map(function (f) {
          return '<div class="fig-box' + (f[4] ? ' warn' : '') + '">' + figIcon(f[0]) +
            '<span class="lab">' + f[1] + '</span><b>' + esc(f[2]) + '</b>' +
            f[3] + '</div>';
        }).join('');

        var TONE = ['#2F6F5B','#B08A46','#7A6A9B','#A65A4A','#5B7C99','#8A8578'];
        var legend = chans.length
          ? '<ul class="legend">' + chans.slice(0, 6).map(function (c, i) {
              var share = total ? Math.round(Number(c.revenue) / total * 1000) / 10 : 0;
              return '<li><i style="background:' + TONE[i % TONE.length] + '"></i>' +
                '<span class="nm">' + esc(c.channel) + '</span>' +
                '<span class="n">' + share + '% · ' + rupees(c.revenue) + '</span></li>';
            }).join('') + '</ul>'
          : '';

        body(
          '<div class="figs">' + figs + '</div>' +

          '<div class="grid-2">' +
            '<div class="card"><h3>Where the orders came from' +
              '<span class="more" data-go="analytics">Analytics</span></h3>' +
              (chans.length
                ? '<div class="chan">' + donut(chans, total) + legend + '</div>' +
                  '<p class="hint">Read from the link a customer arrived on. An ' +
                  'order with nothing on the link is counted as direct, which is ' +
                  'what it is — not a guess.</p>'
                : '<p class="empty">Nothing attributed yet. Put ' +
                  '<code>?utm_source=instagram</code> on the end of a link in a ' +
                  'bio or an ad and every order through it lands here.</p>') +
            '</div>' +

            '<div class="card"><h3>Carts left behind' +
              '<span class="more" data-go="carts">All carts</span></h3>' +
              '<div class="mini">' +
                '<div><b>' + (carts.abandoned || 0) + '</b><span>abandoned, 7 days</span></div>' +
                '<div><b>' + (carts.recovered || 0) + '</b><span>came back</span></div>' +
                '<div><b>' + rupees(carts.at_stake) + '</b><span>still sitting there</span></div>' +
              '</div>' +
              '<p class="hint">A cart is only recorded once somebody has typed a ' +
              'way to reach them into the checkout. Browsing is never recorded ' +
              'against a person.</p>' +
            '</div>' +
          '</div>' +

          '<div class="grid-2">' +
            '<div class="card"><h3>Lately</h3>' + (acts.length
              ? '<div class="scroll"><table><thead><tr><th>What</th><th>Kind</th>' +
                '<th>State</th><th>Revenue</th><th>Made</th></tr></thead><tbody>' +
                acts.map(function (a) {
                  return '<tr><td>' + esc(a.what) + '</td>' +
                    '<td>' + esc(a.kind) + '</td>' +
                    '<td><span class="tag ' + esc(a.state || '') + '">' +
                      esc(a.state || '—') + '</span></td>' +
                    '<td class="num">' + rupees(a.revenue) + '</td>' +
                    '<td class="num">' + day(a.at) + '</td></tr>';
                }).join('') + '</tbody></table></div>'
              : '<p class="empty">No offers or campaigns yet.</p>') + '</div>' +

            '<div class="card"><h3>What you spent</h3>' +
              '<p class="hint">There is no way for the shop to know an ad bill. ' +
              'Type what a channel cost this month and the return above starts ' +
              'working. Leave it and it stays honestly blank.</p>' +
              '<form class="filters" id="spendform">' +
                '<input class="cell" name="channel" placeholder="instagram" ' +
                  'required style="width:9rem">' +
                '<input class="cell" name="amount" type="number" min="0" ' +
                  'placeholder="₹ this month" required style="width:9rem">' +
                '<button class="btn small" type="submit">Record it</button>' +
              '</form>' +
              '<div class="quick">' +
                '<button data-go="newcode"><b>Make an offer</b>' +
                  '<span>A code that works at checkout today</span></button>' +
                '<button data-go="newcamp"><b>Start a campaign</b>' +
                  '<span>Build a list from your own customers</span></button>' +
                '<button data-go="carts"><b>Chase a cart</b>' +
                  '<span>People who stopped at the last step</span></button>' +
              '</div>' +
            '</div>' +
          '</div>');

        document.getElementById('spendform').addEventListener('submit', function (e) {
          e.preventDefault();
          var f = e.target, d = new Date();
          A.setSpend({
            month: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01',
            channel: f.elements.channel.value.trim().toLowerCase(),
            amount: Number(f.elements.amount.value) || 0
          }).then(marketing).catch(function (err) { alert(err.message); });
        });
      }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- offers ----------
     A code is never shown without what it cost. A coupon that brought three
     lakh and gave away thirty thousand is a different decision from one that
     brought thirty thousand and gave away three. */

  var CODE_TAB = 'all', CODE_EDIT = null;

  function discounts() {
    A.discounts().then(function (rows) {
      var counts = { all: rows.length, active: 0, scheduled: 0, expired: 0 };
      rows.forEach(function (d) { counts[d.state] = (counts[d.state] || 0) + 1; });
      var shown = rows.filter(function (d) {
        return CODE_TAB === 'all' || d.state === CODE_TAB;
      });

      var tabs = [['all','All'],['active','Active'],['scheduled','Scheduled'],
                  ['expired','Expired']].map(function (t) {
        return '<button class="tab" data-codetab="' + t[0] + '" aria-pressed="' +
          (CODE_TAB === t[0]) + '">' + t[1] + ' (' + (counts[t[0]] || 0) + ')</button>';
      }).join('');

      body(
        '<div class="toolbar"><div class="tabs">' + tabs + '</div>' +
          '<button class="btn" data-go="newcode">+ Create offer</button></div>' +
        '<div class="filters"><input class="cell" id="codeq" ' +
          'style="flex:1;min-width:16rem;max-width:26rem" ' +
          'placeholder="Search by code…"></div>' +
        (shown.length
        ? '<div class="scroll"><table id="codetable"><thead><tr><th>Code</th><th>Worth</th>' +
          '<th>Type</th><th>Used</th><th>Revenue</th><th>Given away</th>' +
          '<th>Valid till</th><th>State</th><th>Live</th><th></th>' +
          '</tr></thead><tbody>' +
          shown.map(function (d) {
            var worth = d.kind === 'percent' ? d.value + '% OFF'
              : d.kind === 'flat' ? rupees(d.value) + ' OFF' : 'Free shipping';
            return '<tr data-code="' + esc(d.code) + '">' +
              '<td class="num"><b>' + esc(d.code) + '</b>' +
                (d.note ? '<br><span class="muted">' + esc(d.note) + '</span>' : '') + '</td>' +
              '<td>' + worth + '</td>' +
              '<td class="muted">' + esc(d.kind.replace('_', ' ')) + '</td>' +
              '<td class="num">' + (d.uses || 0) +
                (d.usage_limit ? ' / ' + d.usage_limit : ' / ∞') + '</td>' +
              '<td class="num">' + rupees(d.revenue) + '</td>' +
              '<td class="num">' + rupees(d.given) + '</td>' +
              '<td class="num">' + (d.ends_at ? day(d.ends_at) : '—') + '</td>' +
              '<td><span class="tag ' + esc(d.state) + '">' + esc(d.state) + '</span></td>' +
              '<td><label class="tick"><input type="checkbox" data-live="' +
                esc(d.code) + '"' + (d.live ? ' checked' : '') + '></label></td>' +
              '<td><button class="btn small" data-editcode="' + esc(d.code) +
                '">Edit</button></td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">No codes here yet. An offer made on the next screen ' +
          'works at the checkout the moment you save it.</p>'));

      var q = document.getElementById('codeq');
      if (q) q.addEventListener('input', function () {
        var v = this.value.trim().toUpperCase();
        [].forEach.call(document.querySelectorAll('#codetable tbody tr'), function (tr) {
          tr.style.display = !v || tr.getAttribute('data-code').indexOf(v) > -1 ? '' : 'none';
        });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- making an offer ----------
     Everything on the left is a rule; the panel on the right is that rule read
     back in a sentence, because "10, 1499, 1000" is not a thing anyone can
     check and "10% off orders over ₹1,499, capped at ₹1,000" is. */

  var KINDS = [['percent','Percentage','Off in per cent'],
               ['flat','Fixed amount','Off in rupees'],
               ['free_shipping','Free shipping','No charge to deliver']];

  function newcode() {
    var d = CODE_EDIT || {};
    Promise.all([A.collections().catch(function () { return []; })])
      .then(function (r) {
        var cols = r[0] || [];
        body(
          '<div class="filters"><button class="btn small" data-go="discounts">' +
            '&larr; Offers</button></div>' +
          '<div class="grid-side">' +
            '<div class="card"><h3>The offer</h3><form id="codeform" class="f2">' +
              '<fieldset><legend>What kind</legend><div class="picks">' +
                KINDS.map(function (k) {
                  return '<label class="pick"><input type="radio" name="kind" value="' +
                    k[0] + '"' + ((d.kind || 'percent') === k[0] ? ' checked' : '') +
                    '><span><b>' + k[1] + '</b><small>' + k[2] + '</small></span></label>';
                }).join('') + '</div></fieldset>' +

              '<div class="pair">' +
                '<p><label for="c-code">Code</label>' +
                  '<input id="c-code" name="code" required placeholder="SUMMER10" ' +
                  'value="' + esc(d.code || '') + '"' +
                  (CODE_EDIT ? ' readonly' : '') + '></p>' +
                '<p><label for="c-value">Value</label>' +
                  '<input id="c-value" name="value" type="number" min="0" step="1" ' +
                  'value="' + esc(d.value == null ? 10 : d.value) + '"></p>' +
              '</div>' +
              (CODE_EDIT ? '' : '<p class="hint">' +
                '<button type="button" class="btn small" id="gen">Generate a code' +
                '</button> — or type one people can say on the phone.</p>') +

              '<div class="pair">' +
                '<p><label for="c-min">Minimum order (optional)</label>' +
                  '<input id="c-min" name="min_spend" type="number" min="0" ' +
                  'value="' + esc(d.min_spend || '') + '"></p>' +
                '<p><label for="c-max">Most it may give away (optional)</label>' +
                  '<input id="c-max" name="max_discount" type="number" min="0" ' +
                  'value="' + esc(d.max_discount || '') + '"></p>' +
              '</div>' +

              '<div class="pair">' +
                '<p><label for="c-limit">Total uses (blank = unlimited)</label>' +
                  '<input id="c-limit" name="usage_limit" type="number" min="1" ' +
                  'value="' + esc(d.usage_limit || '') + '"></p>' +
                '<p><label for="c-per">Uses per customer</label>' +
                  '<input id="c-per" name="per_customer" type="number" min="1" ' +
                  'value="' + esc(d.per_customer == null ? 1 : d.per_customer) + '"></p>' +
              '</div>' +

              '<fieldset><legend>Applies to</legend>' +
                '<div class="pair">' +
                  '<p><select name="applies_to" id="c-apply">' +
                    '<option value="all">Everything</option>' +
                    '<option value="collection"' +
                      (d.applies_to === 'collection' ? ' selected' : '') +
                      '>One collection</option></select></p>' +
                  '<p><select name="collection" id="c-col">' +
                    '<option value="">—</option>' +
                    cols.map(function (c) {
                      return '<option value="' + esc(c.slug || c.name) + '"' +
                        (d.collection === (c.slug || c.name) ? ' selected' : '') +
                        '>' + esc(c.name) + '</option>';
                    }).join('') + '</select></p>' +
                '</div></fieldset>' +

              '<div class="pair">' +
                '<p><label for="c-from">Starts</label>' +
                  '<input id="c-from" name="starts_at" type="date" value="' +
                  esc(d.starts_at ? String(d.starts_at).slice(0, 10) : '') + '"></p>' +
                '<p><label for="c-to">Ends (blank = runs on)</label>' +
                  '<input id="c-to" name="ends_at" type="date" value="' +
                  esc(d.ends_at ? String(d.ends_at).slice(0, 10) : '') + '"></p>' +
              '</div>' +

              '<p><label for="c-note">A note to yourself (optional)</label>' +
                '<input id="c-note" name="note" value="' + esc(d.note || '') + '"></p>' +

              '<div class="row-end">' +
                (CODE_EDIT ? '<button type="button" class="btn small danger" id="killcode">' +
                  'Delete</button>' : '') +
                '<button type="button" class="btn small" data-go="discounts">Cancel</button>' +
                '<button class="btn" type="submit">' +
                  (CODE_EDIT ? 'Save the offer' : 'Create the offer') + '</button>' +
              '</div>' +
            '</form></div>' +

            '<aside class="card"><h3>In plain words</h3>' +
              '<div id="c-sum" class="summary"></div>' +
              '<p class="hint">The database checks all of this again when the ' +
              'order arrives, so an edited page cannot get a bigger discount ' +
              'than this says.</p>' +
            '</aside>' +
          '</div>');

        var form = document.getElementById('codeform');

        function say() {
          var f = form.elements;
          var kind = form.querySelector('[name=kind]:checked').value;
          var v = Number(f.value.value) || 0;
          var worth = kind === 'percent' ? v + '% off'
                    : kind === 'flat' ? rupees(v) + ' off' : 'Free shipping';
          var bits = [];
          bits.push('<b>' + worth + '</b>' +
            (f.applies_to.value === 'collection' && f.collection.value
              ? ' on ' + esc(f.collection.value) : ' on everything'));
          if (f.min_spend.value) bits.push('Only on orders over ' + rupees(f.min_spend.value));
          if (kind === 'percent' && f.max_discount.value)
            bits.push('Never gives away more than ' + rupees(f.max_discount.value));
          bits.push(f.usage_limit.value
            ? f.usage_limit.value + ' uses in total'
            : 'Unlimited uses');
          bits.push((Number(f.per_customer.value) || 1) + ' use per customer');
          bits.push(f.starts_at.value || f.ends_at.value
            ? 'Runs ' + (f.starts_at.value || 'from today') +
              (f.ends_at.value ? ' to ' + f.ends_at.value : ' onwards')
            : 'Runs from today, with no end date');
          return '<p class="code-chip">' + esc(f.code.value || 'YOURCODE') + '</p>' +
            '<ul>' + bits.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>';
        }
        function repaint() { document.getElementById('c-sum').innerHTML = say(); }
        form.addEventListener('input', repaint);
        form.addEventListener('change', repaint);
        repaint();

        var gen = document.getElementById('gen');
        if (gen) gen.addEventListener('click', function () {
          form.elements.code.value =
            'IAR' + Math.random().toString(36).slice(2, 6).toUpperCase();
          repaint();
        });

        var kill = document.getElementById('killcode');
        if (kill) kill.addEventListener('click', function () {
          if (!confirm('Delete ' + CODE_EDIT.code + '? Orders that already used it ' +
                       'keep their discount.')) return;
          A.delDiscount(CODE_EDIT.code).then(function () {
            CODE_EDIT = null; here = 'discounts'; drawNav(); render();
          }).catch(function (err) { alert(err.message); });
        });

        form.addEventListener('submit', function (e) {
          e.preventDefault();
          var f = form.elements;
          var row = {
            kind: form.querySelector('[name=kind]:checked').value,
            value: Number(f.value.value) || 0,
            min_spend: Number(f.min_spend.value) || 0,
            max_discount: f.max_discount.value ? Number(f.max_discount.value) : null,
            usage_limit: f.usage_limit.value ? Number(f.usage_limit.value) : null,
            per_customer: f.per_customer.value ? Number(f.per_customer.value) : null,
            applies_to: f.applies_to.value,
            collection: f.applies_to.value === 'collection' ? (f.collection.value || null) : null,
            starts_at: f.starts_at.value || null,
            ends_at: f.ends_at.value || null,
            note: f.note.value.trim() || null
          };
          var done = function () {
            CODE_EDIT = null; here = 'discounts'; drawNav(); render();
          };
          var fail = function (err) { alert(err.message); };
          if (CODE_EDIT) A.setDiscount(CODE_EDIT.code, row).then(done, fail);
          else {
            row.code = f.code.value.trim().toUpperCase();
            if (!row.code) return;
            A.addDiscount(row).then(done, fail);
          }
        });
      }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- campaigns ----------
     HONEST ABOUT WHAT THIS IS. There is no mail server and no SMS gateway, so
     nothing here claims to have sent anything it did not. What it does do is
     real: it builds a named list of real customers from real orders, merges the
     message, and — for WhatsApp, which needs no provider at all — hands the
     house one link per person. Email and SMS come out as a file until a
     provider is connected, and say so on the screen. */

  var CAMP_TAB = 'all', CAMP_OPEN = null;
  var CHANNELS = [['whatsapp','WhatsApp','Sent by you, one tap each. Works today.'],
                  ['email','Email','Needs a mail provider before it can send.'],
                  ['sms','SMS','Needs an SMS gateway before it can send.']];

  function campaigns() {
    A.campaigns().then(function (rows) {
      var counts = { all: rows.length };
      rows.forEach(function (c) { counts[c.channel] = (counts[c.channel] || 0) + 1; });
      var shown = rows.filter(function (c) {
        return CAMP_TAB === 'all' || c.channel === CAMP_TAB;
      });
      var tabs = [['all','All']].concat(CHANNELS.map(function (c) { return [c[0], c[1]]; }))
        .map(function (t) {
          return '<button class="tab" data-camptab="' + t[0] + '" aria-pressed="' +
            (CAMP_TAB === t[0]) + '">' + t[1] + ' (' + (counts[t[0]] || 0) + ')</button>';
        }).join('');

      body(
        '<div class="toolbar"><div class="tabs">' + tabs + '</div>' +
          '<button class="btn" data-go="newcamp">+ Create campaign</button></div>' +
        (shown.length
        ? '<div class="scroll"><table><thead><tr><th>Campaign</th><th>Channel</th>' +
          '<th>Audience</th><th>People</th><th>Sent</th><th>State</th><th>Made</th>' +
          '<th></th></tr></thead><tbody>' +
          shown.map(function (c) {
            return '<tr><td><b>' + esc(c.name) + '</b>' +
                (c.subject ? '<br><span class="muted">' + esc(c.subject) + '</span>' : '') +
                '</td>' +
              '<td>' + esc(c.channel) + '</td>' +
              '<td class="muted">' + esc(c.audience) + '</td>' +
              '<td class="num">' + (c.recipients || 0) + '</td>' +
              '<td class="num">' + (c.sent || 0) + '</td>' +
              '<td><span class="tag ' + esc(c.state) + '">' + esc(c.state) + '</span></td>' +
              '<td class="num">' + day(c.made_at) + '</td>' +
              '<td><button class="btn small" data-camp="' + c.id + '">Open</button></td>' +
              '</tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">No campaigns yet. A campaign here is a list of your ' +
          'own customers and something to say to them — never a bought list.</p>'));
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function newcamp() {
    A.audiences().then(function (auds) {
      body(
        '<div class="filters"><button class="btn small" data-go="campaigns">' +
          '&larr; Campaigns</button></div>' +
        '<div class="grid-side">' +
          '<div class="card"><h3>The campaign</h3><form id="campform" class="f2">' +
            '<fieldset><legend>Where it goes</legend><div class="picks">' +
              CHANNELS.map(function (c, i) {
                return '<label class="pick"><input type="radio" name="channel" value="' +

              'scraped.</p></fieldset>' +

            '<p id="subwrap" hidden><label for="m-sub">Subject line</label>' +

              'placeholder="Hello {name}, the new season’s cloth has arrived…"></textarea></p>' +

          ? 'Email cannot be sent from here yet — there is no mail provider ' +
            'connected. The list and the message are saved, and download as a ' +
            'file you can hand to one. No open rate is recorded, because nothing ' +
            'here can measure one.'
          : 'SMS cannot be sent from here yet — there is no gateway connected. ' +
            'The list downloads as a file. Indian promotional SMS also needs a ' +
            'registered DLT template before any provider will carry it.';

        document.getElementById('utmecho').textContent =
          form.elements.utm_campaign.value.trim() || '…';

      chanChange();

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var f = form.elements;
        A.addCampaign({
          name: f.name.value.trim(),

          audience: form.querySelector('[name=audience]:checked').value,
          subject: f.subject.value.trim() || null,
          message: f.message.value,
          utm_campaign: f.utm_campaign.value.trim() || null
        }).then(function (c) {
          return A.buildAudience(c.id).then(function () { return c.id; });
        }).then(function (id) {
          CAMP_OPEN = id; openCampaign(id);
        }).catch(function (err) { alert(err.message); });
      });
    }).catch(function (e) { body(needsSQL(e)); });

  /* ---------- one campaign: the actual sending ----------
     For WhatsApp this is the whole product. One button per person, the message
     already merged, and a tick the moment the chat opens — which is the only
     thing this can honestly claim to know. */

  function merge(msg, name) {
    var first = String(name || '').trim().split(/\s+/)[0] || 'there';
    return String(msg || '').replace(/\{name\}/g, first);
  }

  function openCampaign(id) {
    here = 'campaign'; drawNav(); shell(waiting());
    Promise.all([A.campaign(id), A.recipients(id)]).then(function (r) {
      var c = r[0] || {}, list = r[1] || [];
      var sent = list.filter(function (x) { return x.sent_at; }).length;

      var rows = list.map(function (p) {
        var text = merge(c.message, p.name);
        var wa = 'https://wa.me/91' + String(p.phone || '').replace(/\D/g, '').slice(-10) +
                 '?text=' + encodeURIComponent(text);
        return '<tr' + (p.sent_at ? ' class="done"' : '') + '>' +
          '<td>' + esc(p.name || '—') + '</td>' +
          '<td class="num">' + esc(p.phone || '') + '</td>' +
          '<td class="muted">' + esc(p.email || '—') + '</td>' +
          '<td>' + (p.sent_at
            ? '<span class="tag delivered">sent</span>'
            : c.channel === 'whatsapp'
              ? '<a class="btn small" target="_blank" rel="noopener" ' +
                'data-send="' + p.id + '" href="' + esc(wa) + '">Open chat</a>'
              : '<span class="muted">waiting on a provider</span>') + '</td></tr>';
      }).join('');

      body(
        '<div class="filters"><button class="btn small" data-go="campaigns">' +
          '&larr; Campaigns</button>' +
          '<button class="btn small" id="exportcamp">Download the list (CSV)</button>' +
          '<button class="btn small" id="rebuild">Rebuild the list</button></div>' +

        '<div class="figs">' + [
          ['customers', 'People on the list', list.length, ''],
          ['cart', 'Reached', sent + ' of ' + list.length, ''],
          ['tag', 'Channel', c.channel || '', ''],
          ['clock', 'State', c.state || '', '']
        ].map(function (f) {
          return '<div class="fig-box">' + figIcon(f[0]) +
            '<span class="lab">' + f[1] + '</span><b>' + esc(f[2]) + '</b></div>';
        }).join('') + '</div>' +

        '<div class="grid-2">' +
          '<div class="card"><h3>The message</h3>' +
            (c.subject ? '<p><b>' + esc(c.subject) + '</b></p>' : '') +
            '<pre class="msg">' + esc(c.message || '') + '</pre>' +
            '<p class="hint">Shown here exactly as it will arrive, except that ' +
            '<code>{name}</code> becomes each person’s first name.</p></div>' +
          '<div class="card"><h3>How this sends</h3>' +
            (c.channel === 'whatsapp'
              ? '<p class="hint">WhatsApp needs no provider and no approval: each ' +
                'button opens a chat with the message already written. Tick as ' +
                'you go — the count above is people you actually opened, ' +
                'which is the only thing this can honestly know. It cannot know ' +
                'whether they read it.</p>'
              : '<p class="note bad">There is no ' +
                (c.channel === 'email' ? 'mail provider' : 'SMS gateway') +
                ' connected, so nothing can be sent from this screen. Download ' +
                'the list and hand it to one. Delivery and open rates will only ' +
                'appear once a provider is wired and reports them back — ' +
                'they are not estimated here.</p>') +
          '</div>' +
        '</div>' +

        (list.length
          ? '<div class="scroll"><table><thead><tr><th>Name</th><th>Phone</th>' +
            '<th>Email</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<p class="empty">Nobody matched that audience yet.</p>'));

      document.getElementById('rebuild').addEventListener('click', function () {
        A.buildAudience(id).then(function () { openCampaign(id); })
          .catch(function (err) { alert(err.message); });
      });

      document.getElementById('exportcamp').addEventListener('click', function () {
        var csv = 'name,phone,email,message\n' + list.map(function (p) {
          return [p.name, p.phone, p.email, merge(c.message, p.name)]
            .map(function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; })
            .join(',');
        }).join('\n');
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = (c.name || 'campaign').replace(/\W+/g, '-').toLowerCase() + '.csv';
        a.click();
        URL.revokeObjectURL(a.href);
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ============================ THE SHOP WINDOWS ============================
     WHAT THESE SCREENS ARE, AND WHAT THEY ARE NOT.

     Every page of this site is finished, hand-built HTML that renders with no
     JavaScript and no database. These screens do not build pages — they let the
     house OVERRIDE a page that is already correct: hide a band, reorder two,
     rename a link, change a photograph.

     So there is no "add a section" here, and no page builder. A band that is
     not in the HTML has no design, no photography and no words, and a switch
     for it would be a switch wired to nothing. What the house gets instead is
     the thing it actually needs twice a year, working, on a page that still
     loads instantly on a bad phone. */

  function website() {
    Promise.all([A.siteStats(), A.settings(), A.content()]).then(function (r) {
      var st = r[0] || {}, sets = r[1] || [], slots = r[2] || [];
      var val = function (k) {
        var s = sets.filter(function (x) { return x.key === k; })[0];
        return s ? s.value : '';
      };
      var barOn = String(val('bar_on')).toLowerCase() === 'true';

      var figs = [
        ['pages', 'Pages', st.pages || 0, (st.pages_all || 0) + ' in all'],
        ['collections', 'Collections', st.collections || 0, 'in the range'],
        ['media', 'Files', st.files || 0, mb(st.bytes)],
        ['homepage', 'Bands on the home page', st.sections_live || 0,
          'of ' + (st.sections_all || 0)]
      ].map(function (f) {
        return '<div class="fig-box">' + figIcon(f[0]) +
          '<span class="lab">' + f[1] + '</span><b>' + esc(f[2]) + '</b>' +
          '<span class="delta flat">' + esc(f[3]) + '</span></div>';
      }).join('');

      body('<div class="figs">' + figs + '</div>' +
        '<div class="grid-2">' +
          '<div class="card"><h3>The shop front</h3>' +
            '<div class="scroll"><table><tbody>' +
            [['Address', '<a href="https://iar-next.vercel.app" target="_blank" ' +
              'rel="noopener">iar-next.vercel.app</a> <span class="muted">' +
              '(the working link — the domain is the last thing we wire)</span>'],
             ['Announcement bar', barOn
                ? '<span class="tag active">on</span> ' + esc(val('announcement') || '(no words yet)')
                : '<span class="tag draft">off</span>'],
             ['Menu', (st.menu_items || 0) + ' links'],
             ['Taking orders', String(val('shop_open')).toLowerCase() === 'false'
                ? '<span class="tag cancelled">closed</span>'
                : '<span class="tag active">open</span>']
            ].map(function (row) {
              return '<tr><td class="muted" style="width:12rem">' + row[0] + '</td>' +
                     '<td>' + row[1] + '</td></tr>';
            }).join('') + '</tbody></table></div>' +
            '<div class="quick">' +
              '<button data-go="media"><b>Upload a photograph</b>' +
                '<span>Straight to the shop, with no deploy</span></button>' +
              '<button data-go="bar"><b>Change the announcement bar</b>' +
                '<span>The line across the top of every page</span></button>' +
              '<button data-go="homepage"><b>Reorder the home page</b>' +
                '<span>Hide a band, or move one up</span></button>' +
            '</div>' +
          '</div>' +

          '<div class="card"><h3>Words the house owns</h3>' +
            '<p class="hint">Each of these replaces a line already on the site. ' +
            'Leave one empty and the page keeps what it was built with — so a ' +
            'blank box is never a blank page.</p>' + (slots.length
            ? '<div class="scroll"><table><tbody>' + slots.map(function (s) {
                return '<tr><td style="width:45%">' + esc(s.note || s.slot) + '<br>' +
                  '<span class="muted">' + esc(s.slot) + '</span></td>' +
                  '<td><input class="cell" style="width:100%" value="' +
                  esc(s.value || '') + '" data-slot="' + esc(s.slot) + '"></td></tr>';
              }).join('') + '</tbody></table></div>'
            : '<p class="empty">No slots yet.</p>') + '</div>' +
        '</div>');
    }).catch(function (e) { body(needsSQL(e)); });

  function mb(b) {
    b = Number(b || 0);
    if (!b) return 'nothing yet';
    if (b < 1048576) return Math.round(b / 1024) + ' KB';
    return (b / 1048576).toFixed(1) + ' MB';
  }

  /* ---------- media ----------
     The single biggest thing standing between the house and running its own
     shop: until now a photograph lived in the repository, so changing one was
     a deploy, so changing one was me. */

  var MEDIA_FOLDER = 'all';

  function media() {
    A.media().then(function (rows) {
      var folders = {};
      rows.forEach(function (m) { folders[m.folder || 'Uncategorised'] =
        (folders[m.folder || 'Uncategorised'] || 0) + 1; });
      var shown = rows.filter(function (m) {
        return MEDIA_FOLDER === 'all' || (m.folder || 'Uncategorised') === MEDIA_FOLDER;
      });
      var tabs = [['all', 'All files', rows.length]].concat(
        Object.keys(folders).sort().map(function (k) { return [k, k, folders[k]]; })
      ).map(function (t) {
        return '<button class="tab" data-folder="' + esc(t[0]) + '" aria-pressed="' +
          (MEDIA_FOLDER === t[0]) + '">' + esc(t[1]) + ' (' + t[2] + ')</button>';
      }).join('');

      body(
        '<div class="card"><h3>Add files</h3>' +
          '<p class="hint">JPEG, PNG, WebP, AVIF, SVG or PDF, up to 10 MB each. ' +
          'The name is kept, so <code>cocoa-drift-cuff.jpg</code> stays findable ' +
          'a year from now.</p>' +
          '<div class="filters">' +
            '<input class="cell" id="mfolder" placeholder="Folder, e.g. Products" ' +
              'style="width:14rem" value="' +
              esc(MEDIA_FOLDER === 'all' ? '' : MEDIA_FOLDER) + '">' +
            '<input type="file" id="mfile" multiple ' +
              'accept="image/jpeg,image/png,image/webp,image/avif,image/svg+xml,application/pdf">' +
          '</div>' +
          '<p class="note" id="mnote"></p>' +
        '</div>' +
        '<div class="tabs" style="margin-top:var(--s4)">' + tabs + '</div>' +
        (shown.length
        ? '<div class="files">' + shown.map(function (m) {
            var pic = /^image\/(?!svg)/.test(m.kind || '')
              ? '<img src="' + esc(m.url) + '" alt="" loading="lazy">'
              : '<span class="filetype">' +
                esc((m.kind || 'file').split('/').pop().toUpperCase()) + '</span>';
            return '<figure class="file"><a href="' + esc(m.url) +
              '" target="_blank" rel="noopener">' + pic + '</a>' +
              '<figcaption>' +
                '<b title="' + esc(m.name) + '">' + esc(m.name || m.path) + '</b>' +
                '<span class="muted">' + mb(m.bytes) + '</span>' +
                '<input class="cell wide" placeholder="What is this a picture of?" ' +
                  'value="' + esc(m.alt || '') + '" data-alt="' + m.id + '">' +
                '<span class="row-end">' +
                  '<button class="btn small" data-copy="' + esc(m.url) + '">Copy link</button>' +
                  '<button class="btn small danger" data-delmedia="' + m.id +
                    '" data-path="' + esc(m.path) + '">Delete</button>' +
                '</span>' +
              '</figcaption></figure>';
          }).join('') + '</div>'
        : '<p class="empty">Nothing uploaded yet. Anything added here gets a ' +
          'permanent public link you can paste onto a cloth, so a photograph can ' +
          'change without the site being rebuilt.</p>'));

      document.getElementById('mfile').addEventListener('change', function () {
        var files = [].slice.call(this.files);
        if (!files.length) return;
        var folder = document.getElementById('mfolder').value.trim() || 'Uncategorised';
        var note = document.getElementById('mnote');
        var done = 0, failed = [];
        note.className = 'note';
        note.textContent = 'Uploading ' + files.length + '…';

        /* one at a time. A free project and a phone on Indian mobile data are
           both happier with a queue than with twelve parallel uploads. */
        files.reduce(function (chain, f) {
          return chain.then(function () {
            return A.upload(f, folder).then(function () {
              done++; note.textContent = 'Uploaded ' + done + ' of ' + files.length + '…';
            }, function (err) {
              failed.push(f.name + ' — ' + err.message);
            });
          });
        }, Promise.resolve()).then(function () {
          if (failed.length) {
            note.className = 'note bad';
            note.textContent = done + ' uploaded. ' + failed.length +
              ' did not: ' + failed.join('; ');
            setTimeout(media, 2500);
          } else { MEDIA_FOLDER = folder; media(); }
        });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- reports ----------
     Separate from the dashboard on purpose. The dashboard is for the morning;
     this is for the end of the month, and for the accountant.

     The mockup showed seven tabs. Four of them can be answered from what this
     shop records, and they are here. The other three are named and told the
     truth rather than filled with something that looks like data:

       PAYMENT METHODS  — every order is 'prepaid' by default; there is no
                          gateway. A UPI-vs-card split would be a drawing.
       CUSTOM REPORTS   — a report builder is a product, not a screen. What it
                          would really be used for is "give me this as a file",
                          so every table here exports instead.
       REFUNDS          — real, and folded into Sales rather than given a tab
                          of its own, because it is three numbers. */

  var R_TAB = 'sales';
  var R_TABS = [
    ['sales',     'Sales',     'Revenue, month by month, and what it netted'],
    ['products',  'Products',  'Sell-through per cloth, and what is left'],
    ['customers', 'Customers', 'Who buys, how often, and from where'],

    var side = '<div class="rep-side">' + R_TABS.map(function (t) {

        '<span>' + t[2] + '</span></button>';
    }).join('') + '</div>';

    body('<div class="rep">' + side + '<div id="repbody">' + waiting() + '</div></div>');
    ({ sales: repSales, products: repProducts,
       customers: repCustomers, traffic: repTraffic }[R_TAB] || repSales)();
  }

  function repBody(html) {
    var el = document.getElementById('repbody');

  /* Every table on this screen exports. "Custom reports" in the mockup is, in
     practice, somebody wanting the numbers in a spreadsheet — so rather than
     build a report designer nobody asked for, each table hands over its own
     rows exactly as shown, headings and all. */
  function csv(name, head, rows) {
    var body = [head].concat(rows).map(function (r) {
      return r.map(function (v) {
        return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([body], { type: 'text/csv' }));
    a.download = 'iar-' + name + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }
  var EXPORTS = {};
  function exportBtn(key) {
    return '<button class="btn small" data-export="' + key + '">Export CSV</button>';
  }

        EXPORTS.sales = function () {

                '</figcaption></figure>';
            }).join('') + '</div>'
          : '<p class="empty">No photographs on this cloth yet.</p>') +
        '</div>');

      document.getElementById('newimg').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target;
        A.addImage({
          product_id: Number(id), url: f.elements.url.value.trim(),
          kind: f.elements.kind.value, sort_order: imgs.length
        }).then(function () { openCloth(id); }, function (err) {
          tell('That photograph was not added. ' + ((err && err.message) || ''));
        });
      });

      dragShots(id);
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* Reordering writes every card's new position, because a single swap leaves
     the rest of the row wrong the moment two are moved. */
  function dragShots(productId) {
    var box = document.getElementById('shots');
    if (!box) return;
    var from = null;
    box.addEventListener('dragstart', function (e) {
      var s = e.target.closest('.shot'); if (!s) return;
      from = s; s.classList.add('lift');
      e.dataTransfer.effectAllowed = 'move';
    });
    box.addEventListener('dragend', function () {
      if (from) from.classList.remove('lift');
      from = null;
    });
    box.addEventListener('dragover', function (e) {
      e.preventDefault();
      var over = e.target.closest('.shot');
      if (!over || !from || over === from) return;
      var after = over.compareDocumentPosition(from) & Node.DOCUMENT_POSITION_PRECEDING;
      box.insertBefore(from, after ? over.nextSibling : over);
    });
    box.addEventListener('drop', function (e) {
      e.preventDefault();
      var order = [].slice.call(box.querySelectorAll('.shot'));
      Promise.all(order.map(function (s, i) {
        return A.setImage(s.getAttribute('data-img'), { sort_order: i });
      })).then(function () { openCloth(productId); }, function (err) {
        /* redrawn from the database either way, so what is on screen is never
           an order the shop is not actually going to use */
        tell('The photographs were not reordered. ' + ((err && err.message) || ''));
        openCloth(productId);
      });
    });
  }

  /* ---------- saving ----------
     Every edit saves on change and the field flashes. No Save button anywhere:
     a Save button is a thing to forget, and the failure it causes is silent.

     That was only half true, and the wrong half. The flash was here from the
     start; nothing was watching for the other answer. Eighteen writes on this
     screen could all fail and the field would go on showing the new number, so
     the house could believe it had restocked twelve shirts it had not. Every
     write goes through write() now, and a failure puts the field back to what
     the database still holds, marks it, and says so out loud. */

  /* The browser keeps what a field was RENDERED with, separately from what has
     been typed into it — and rendered means straight out of the database. So a
     failed write already has something honest to put back, without this screen
     keeping a second copy of everything. On a save it is moved forward,
     otherwise the afternoon's second failure would revert to the morning. */
  function held(el) {
    var i;
    if (el.type === 'checkbox') return el.defaultChecked;
    if (el.tagName === 'SELECT') {
      for (i = 0; i < el.options.length; i++)
        if (el.options[i].defaultSelected) return el.options[i].value;
      return el.value;
    }
    return el.defaultValue;
  }
  function keep(el) {
    var i;
    if (el.type === 'checkbox') { el.defaultChecked = el.checked; return; }
    if (el.tagName === 'SELECT') {
      for (i = 0; i < el.options.length; i++)
        el.options[i].defaultSelected = el.options[i].value === el.value;
      return;
    }
    el.defaultValue = el.value;
  }

  /* One line along the bottom, gone by itself. Not an alert(): a write that
     failed halfway down a stock sheet must be impossible to miss and must not
     stop the sheet, and an alert does the second thing badly. */
  var tellTimer;
  function tell(msg, good) {
    var n = document.getElementById('note-bar');
    if (!n) {
      n = document.createElement('div');
      n.id = 'note-bar'; n.className = 'note-bar';
      n.setAttribute('role', 'status');
      document.body.appendChild(n);
    }
    n.className = 'note-bar on' + (good ? ' good' : '');
    n.textContent = msg;
    clearTimeout(tellTimer);
    tellTimer = setTimeout(function () { n.className = 'note-bar'; }, 7000);
  }

  function flash(el) {
    keep(el);
    el.classList.remove('unsaved');
    el.classList.add('saved');
    setTimeout(function () { el.classList.remove('saved'); }, 900);
  }

  /* The one door every write goes through. Resolves true when it saved, false
     when it did not — so the things that follow a save, like refreshing the
     figures or redrawing a table, do not run on a change that never happened. */
  function write(p, el, what) {
    var before = el ? held(el) : null;
    return p.then(function () {
      if (el) flash(el);
      return true;
    }, function (e) {
      if (el) {
        if (el.type === 'checkbox') el.checked = !!before;
        else el.value = before;
        el.classList.remove('saved');
        el.classList.add('unsaved');
      }
      tell((what || 'That change') + ' did not save, and has been put back. ' +
           ((e && e.message) || 'The shop could not be reached.'));
      return false;
    });
  }

  document.addEventListener('click', function (e) {
    var f = e.target.closest('[data-of]');
    if (f) { ofilter = f.getAttribute('data-of'); orders(); }
    var op = e.target.closest('[data-open]');
    if (op) openOrder(op.getAttribute('data-open'));

    var rf = e.target.closest('[data-rf]');
    if (rf) { rfilter = rf.getAttribute('data-rf'); returns(); }

    var pg = e.target.closest('[data-page]');
    if (pg && !pg.disabled) { opage = Math.max(0, +pg.getAttribute('data-page')); orders(); }

    /* The customers list gets its own three names rather than borrowing the
       orders ones. Two screens sharing data-page would each redraw the other
       the moment anybody paged either of them. */
    var cs = e.target.closest('[data-cstage]');
    if (cs) { cstage = cs.getAttribute('data-cstage'); cpage = 0; customers(); }

    var cg = e.target.closest('[data-cpage]');
    if (cg && !cg.disabled) {
      cpage = Math.max(0, +cg.getAttribute('data-cpage')); customers();
    }

    /* The whole row carries this as well as the button on the end of it, so a
       thumb landing anywhere on the line opens the man. closest() finds the
       button first when that is what was hit, so it only ever fires once. */
    var pn = e.target.closest('[data-person]');
    if (pn) openPerson(pn.getAttribute('data-person'));

    var inv = e.target.closest('[data-invoice]');
    if (inv) invoicePage(inv.getAttribute('data-invoice'));

    /* moving an order along writes its own line in the timeline, because the
       database records the change rather than this button doing it */
    var stg = e.target.closest('[data-stage]');
    if (stg) {
      var bits = stg.getAttribute('data-stage').split('|');
      stg.disabled = true;
      A.setOrder(bits[0], { status: bits[1] }).then(function () {
        openOrder(bits[0]); orders(); refreshKpis();
      }, function (err) {
        /* the button used to stay disabled for ever on a failure, which reads
           as "done" and is the opposite of what happened */
        stg.disabled = false;
        tell('The order did not move. ' + ((err && err.message) || ''));
      });
    }

    if (e.target.classList && e.target.classList.contains('over-veil')) closeOver();
    var sh = e.target.closest('[data-sheet]');
    if (sh) openSheet(sh.getAttribute('data-sheet'));
    var cl = e.target.closest('[data-cloth-open]');
    if (cl) openCloth(cl.getAttribute('data-cloth-open'));
    var di = e.target.closest('[data-delimg]');
    if (di) {
      e.preventDefault();
      var fig = di.closest('.shot');
      A.delImage(di.getAttribute('data-delimg')).then(function () {
        if (fig) fig.remove();
      }, function (err) {
        tell('That photograph is still there. ' + ((err && err.message) || ''));
      });
    }

    /* ---- marketing ---- */

    var ar = e.target.closest('[data-arange]');
    if (ar) { A_RANGE = ar.getAttribute('data-arange'); analytics(); }

    /* The dashboard drew these four buttons from the first day and nothing ever
       listened for them, so the revenue line was welded to today and the shop
       had no way to look at a month. Same shape as the analytics one above. */
    var dr = e.target.closest('[data-range]');
    if (dr) { CHART_RANGE = dr.getAttribute('data-range'); dashboard(); }

    var rt = e.target.closest('[data-rtab]');
    if (rt) { R_TAB = rt.getAttribute('data-rtab'); reports(); }

    var ex = e.target.closest('[data-export]');
    if (ex) {
      var fn = EXPORTS[ex.getAttribute('data-export')];
      if (fn) fn();
    }

    var ct = e.target.closest('[data-codetab]');
    if (ct) { CODE_TAB = ct.getAttribute('data-codetab'); discounts(); }

    var ec = e.target.closest('[data-editcode]');
    if (ec) {
      var want = ec.getAttribute('data-editcode');
      A.discounts().then(function (rows) {
        CODE_EDIT = rows.filter(function (d) { return d.code === want; })[0] || null;
        if (!CODE_EDIT) return;
        here = 'newcode'; drawNav(); render();
      });
    }

    var mt = e.target.closest('[data-camptab]');
    if (mt) { CAMP_TAB = mt.getAttribute('data-camptab'); campaigns(); }

    var oc = e.target.closest('[data-camp]');
    if (oc) openCampaign(oc.getAttribute('data-camp'));

    /* Ticked when the chat is opened — which is the only thing this can
       honestly claim to know. It is not a read receipt and is not called one. */
    /* ---- the shop windows ---- */

    var mf = e.target.closest('[data-folder]');
    if (mf) { MEDIA_FOLDER = mf.getAttribute('data-folder'); media(); }

    var cp = e.target.closest('[data-copy]');
    if (cp) {
      var link = cp.getAttribute('data-copy');
      navigator.clipboard.writeText(link).then(function () {
        var was = cp.textContent; cp.textContent = 'Copied';
        setTimeout(function () { cp.textContent = was; }, 1400);
      }, function () { prompt('Copy this link:', link); });
    }

    var dm = e.target.closest('[data-delmedia]');
    if (dm) {
      if (confirm('Delete this file? Anything on the site pointing at it will ' +
                  'show a broken picture.')) {
        A.delMedia({ id: dm.getAttribute('data-delmedia'),
                     path: dm.getAttribute('data-path') })
          .then(media).catch(function (err) { alert(err.message); });
      }
    }

    var dn = e.target.closest('[data-delnav]');
    if (dn) {
      if (confirm('Remove this link from the menu?'))
        A.delNav(dn.getAttribute('data-delnav')).then(navigation)
          .catch(function (err) { alert(err.message); });
    }

    var sd = e.target.closest('[data-send]');
    if (sd) {
      var row = sd.closest('tr');
      A.markSent(sd.getAttribute('data-send')).then(function () {
        if (row) row.classList.add('done');
        sd.outerHTML = '<span class="tag delivered">sent</span>';
      }, function (err) {
        tell('That one is not marked sent. ' + ((err && err.message) || ''));
      });
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target, has = function (a) { return t.hasAttribute && t.hasAttribute(a); };

    if (has('data-stock')) {
      var q = parseInt(t.value, 10);
      if (isNaN(q) || q < 0) { q = 0; t.value = 0; }
      var was = parseInt(t.getAttribute('data-was'), 10) || 0;
      var why = (document.getElementById('why') || {}).value || 'correction';
      t.classList.toggle('zero', q === 0);
      t.classList.toggle('low', q > 0 && q <= 3);
      write(A.moveStock(t.getAttribute('data-stock'), t.getAttribute('data-size'),
                        was, q, why), t, 'That stock count')
        .then(function (ok) {
          /* data-was is what the next edit measures its movement against, so it
             only moves when the database agreed to move */
          if (ok) { t.setAttribute('data-was', q); refreshKpis(); }
          else {
            t.classList.toggle('zero', was === 0);
            t.classList.toggle('low', was > 0 && was <= 3);
          }
        });
    }
    if (has('data-price')) {
      var p = parseInt(t.value, 10);
      if (isNaN(p) || p < 0) {
        t.value = held(t);
        tell('A price has to be a whole number of rupees. It has been put back.');
      } else {
        write(A.setProduct(t.getAttribute('data-price'), { price: p }), t, 'That price');
      }
    }
    if (has('data-visible'))
      write(A.setProduct(t.getAttribute('data-visible'), { visible: t.checked }),
            t, 'Showing that cloth on the shop');
    if (has('data-order'))
      write(A.setOrder(t.getAttribute('data-order'), { status: t.value }),
            t, 'That order stage')
        .then(function (ok) { if (ok) refreshKpis(); });
    if (has('data-return'))
      write(A.setReturn(t.getAttribute('data-return'), { stage: t.value }),
            t, 'That return stage')
        .then(function (ok) { if (ok) refreshKpis(); });
    if (has('data-handled'))
      write(A.setEnquiry(t.getAttribute('data-handled'), { handled: t.checked }),
            t, 'Marking that enquiry handled')
        .then(function (ok) { if (ok) refreshKpis(); });
    if (has('data-set')) {
      var v = t.type === 'checkbox' ? String(t.checked) : t.value;
      write(A.setSetting(t.getAttribute('data-set'), v), t, 'That setting')
        .then(function (ok) {
          /* The invoice reads these out of a cache that was filled once and
             never emptied, so editing the GSTIN and printing straight
             afterwards printed the old one — on the single document that
             causes real trouble if it leaves the building. */
          if (ok) { SET.__loaded = false; }
        });
    }
    if (has('data-slot'))
      write(A.setContent(t.getAttribute('data-slot'), t.value), t, 'That wording');
    /* an offer switched off stops at the very next checkout — the database is
       asked again on every order, never the page */
    if (has('data-live'))
      write(A.setDiscount(t.getAttribute('data-live'), { live: t.checked }),
            t, 'Switching that offer')
        .then(function (ok) { if (ok) discounts(); });

    /* ---- the shop windows ---- */

    if (has('data-band')) {
      var bf = t.getAttribute('data-bfield');
      var bp = {};
      bp[bf] = bf === 'sort_order' ? (parseInt(t.value, 10) || 1) : (t.value.trim() || null);
      write(A.setBand(t.getAttribute('data-band'), bp), t, 'That band');
    }
    if (has('data-bandlive'))
      write(A.setBand(t.getAttribute('data-bandlive'), { live: t.checked }),
            t, 'Showing that band');

    if (has('data-nav')) {
      var nf = t.getAttribute('data-nfield');
      var np = {};
      np[nf] = nf === 'sort_order' ? (parseInt(t.value, 10) || 1) : t.value.trim();
      write(A.setNav(t.getAttribute('data-nav'), np), t, 'That menu link');
    }
    if (has('data-navlive'))
      write(A.setNav(t.getAttribute('data-navlive'), { live: t.checked }),
            t, 'Showing that menu link');

    if (has('data-alt'))
      write(A.setMedia(t.getAttribute('data-alt'), { alt: t.value.trim() || null }),
            t, 'That description');

    if (has('data-pagefoot'))
      write(A.setPage(t.getAttribute('data-pagefoot'), { in_footer: t.checked }),
            t, 'That page in the footer');
    if (has('data-col')) {
      var fld = t.getAttribute('data-field');
      var val = fld === 'sort_order' ? (parseInt(t.value, 10) || 0) : t.value;
      var patch = {}; patch[fld] = val;
      write(A.setCollection(t.getAttribute('data-col'), patch), t, 'That collection');
    }
    if (has('data-colvis'))
      write(A.setCollection(t.getAttribute('data-colvis'), { visible: t.checked }),
            t, 'Showing that collection');
    if (has('data-code'))
      write(A.setDiscount(t.getAttribute('data-code'), { live: t.checked }),
            t, 'Switching that offer');
    if (has('data-imgkind'))
      write(A.setImage(t.getAttribute('data-imgkind'), { kind: t.value }),
            t, 'What that photograph shows');
    if (has('data-cloth')) {
      var cf = t.getAttribute('data-field');
      var cv = cf === 'mrp' ? (parseInt(t.value, 10) || null) : t.value;
      var cp = {}; cp[cf] = cv;
      write(A.setProduct(t.getAttribute('data-cloth'), cp), t, 'That field');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeOver();
  });

  function refreshKpis() {
    A.kpis().then(function (k) { KPI = k || {}; drawNav(); }).catch(function () {});
  }

  /* ---------- start ---------- */

  function boot() {
    who.innerHTML = esc(A.email) + ' &middot; <a href="#" id="out-top">sign out</a>';
    who.querySelector('#out-top').addEventListener('click', function (e) {
      e.preventDefault(); A.signOut(); gate('Signed out.');
    });
    refreshKpis(); drawNav(); render();
  }

  if (A.session()) {
    A.check().then(function (ok) { ok ? boot() : gate('Please sign in again.'); });
  } else gate('');
})();
</script>
