<style>
/* ---------- THE DESK ----------
   A control room, not a dashboard. The first question it answers is "what
   needs me today?" — so Action Required sits ABOVE the numbers, not below a
   graph. A shirtmaker opening this at ten in the morning wants a list of
   things to do, and the numbers only to confirm the day is going well.

   SIZES HERE ARE NECK SIZES — 39/40/42/44/46 — and 41/43/45 are the three the
   house does not cut. Nothing says S, M or L, because this shop does not sell
   them and the uncut necks are the whole bespoke argument.

   It borrows the site's own type, hairlines and spacing scale on purpose. The
   house should not feel like it is leaving its own shop to run its own shop. */

body{overflow-x:hidden;background:var(--under)}
.shell{display:grid;grid-template-columns:1fr;min-height:100svh}
@media(min-width:1000px){.shell{grid-template-columns:15.5rem 1fr}}

/* ---------- the sidebar ----------
   Dark, against a light workspace. It is the one place in this project that
   does not borrow the shop's cream, and deliberately: the desk is behind the
   shop, not part of it, and a dark rail makes that obvious the moment it opens.
   The wordmark sits at the top so the house knows whose books these are. */
.side{background:#141210;color:#E8E4DC;padding:var(--s4) var(--s3);display:none}
@media(min-width:1000px){.side{display:flex;flex-direction:column;
  position:sticky;top:0;height:100svh;overflow-y:auto}}
.brand{padding:var(--s2) var(--s2) var(--s5)}
.brand b{display:block;font-weight:300;font-size:1.05rem;letter-spacing:.16em}
.brand span{font-family:var(--mono);font-size:.5rem;letter-spacing:.34em;
  color:rgba(232,228,220,.5)}
.side h2{font-family:var(--mono);font-size:.5rem;letter-spacing:.24em;
  text-transform:uppercase;color:rgba(232,228,220,.38);font-weight:400;
  margin:var(--s4) var(--s2) var(--s1)}
.nav-item{display:flex;align-items:center;gap:var(--s2);width:100%;
  text-align:left;padding:var(--s2);font-size:.9375rem;
  color:rgba(232,228,220,.72);cursor:pointer;background:none;border:0;
  border-radius:.4rem;transition:background-color .2s,color .2s}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item[aria-current="true"]{background:rgba(255,255,255,.09);color:#fff}
.nav-item svg{width:1.05rem;height:1.05rem;flex:0 0 auto;stroke:currentColor;
  fill:none;stroke-width:1.4}
.nav-item .pip{margin-left:auto;font-family:var(--mono);font-size:.625rem;
  min-width:1.35rem;height:1.35rem;display:grid;place-items:center;
  border-radius:1rem;background:var(--claret);color:#fff}
.nav-item .pip:empty{display:none}
.whoami{margin-top:auto;padding:var(--s3) var(--s2) 0;
  border-top:1px solid rgba(255,255,255,.1);display:grid;gap:var(--s0)}
.whoami b{font-weight:400;font-size:.875rem}
.whoami a{font-family:var(--mono);font-size:.5625rem;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(232,228,220,.5)}

/* a phone gets a scrolling rail */
.rail{display:flex;gap:var(--s1);overflow-x:auto;scrollbar-width:none;
  padding:var(--s2) var(--gut);border-bottom:1px solid var(--hair);
  position:sticky;top:0;z-index:20;background:#141210}
.rail::-webkit-scrollbar{display:none}
.rail .nav-item{width:auto;flex:0 0 auto;padding:var(--s1) var(--s3);
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;
  text-transform:uppercase;border-radius:2rem}
.rail .nav-item svg{display:none}
@media(min-width:1000px){.rail{display:none}}

.work{padding:var(--s5) var(--gut) var(--sz);min-width:0;background:var(--under)}
.work h1{font-weight:300;font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.02em;
  margin:0}
.sub{margin:var(--s0) 0 0;color:var(--muted);font-size:.9375rem}
.eyebrow{font-family:var(--mono);font-size:.5625rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin:0}
.topbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:flex-start;
  justify-content:space-between;margin:0 0 var(--s4)}

/* ---------- cards ---------- */
.card{background:var(--room);border:1px solid var(--hair);border-radius:.5rem;
  padding:var(--s3)}
.grid-3{display:grid;gap:var(--s2);grid-template-columns:1fr}
@media(min-width:1100px){.grid-3{grid-template-columns:1.35fr .9fr .95fr}}
.grid-2{display:grid;gap:var(--s2);grid-template-columns:1fr;margin-top:var(--s2)}
@media(min-width:1100px){.grid-2{grid-template-columns:1.1fr .9fr}}
.card h3{margin:0 0 var(--s3);font-size:1rem;font-weight:400;letter-spacing:-.01em}
.card h3 .more{float:right;font-family:var(--mono);font-size:.5625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);cursor:pointer}

/* the eight numbers */
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);
  margin:0 0 var(--s2)}
@media(min-width:760px){.figs{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1500px){.figs{grid-template-columns:repeat(8,1fr)}}
.fig-box{background:var(--room);border:1px solid var(--hair);border-radius:.5rem;
  padding:var(--s3);display:grid;gap:var(--s1)}
.fig-ic{width:2rem;height:2rem;border-radius:50%;background:var(--under);
  display:grid;place-items:center}
.fig-ic svg{width:1rem;height:1rem;stroke:var(--ink);fill:none;stroke-width:1.4}
.fig-box .lab{font-size:.8125rem;color:var(--muted)}
.fig-box b{font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:1.5rem;font-weight:400;line-height:1.1}
.delta{font-family:var(--mono);font-size:.6875rem}
.delta.up{color:#3F6B45}
.delta.down{color:var(--claret)}
.delta.flat{color:var(--muted)}
.fig-box.warn b{color:var(--claret)}
.fig-box .warn-note{font-family:var(--mono);font-size:.5625rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--claret)}

/* ---------- the revenue line ----------
   Drawn as inline SVG rather than pulling in a charting library. The whole site
   has no dependencies and one graph is not a reason to start. */
.chart{width:100%;height:13rem;display:block;overflow:visible}
.chart .area{fill:var(--under)}
.chart .line{fill:none;stroke:var(--ink);stroke-width:1.5;
  stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--ink)}
.chart .grid{stroke:var(--hair);stroke-width:1}
.chart text{font-family:var(--mono);font-size:8px;fill:var(--muted)}
.ranges{display:flex;gap:var(--s0);float:right}
.range{font-family:var(--mono);font-size:.5625rem;letter-spacing:.12em;
  text-transform:uppercase;padding:var(--s0) var(--s2);border-radius:.3rem;
  border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
.range[aria-pressed="true"]{background:var(--ink);color:var(--room)}

/* ---------- the pipeline ---------- */
.pipe{display:flex;justify-content:space-between;gap:var(--s1);text-align:center}
.pipe div{flex:1;min-width:0}
.pipe .ring{width:2.2rem;height:2.2rem;margin:0 auto var(--s1);border-radius:50%;
  background:var(--under);display:grid;place-items:center;
  font-family:var(--mono);font-size:.6875rem}
.pipe .nm{font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);display:block}
.pipe b{font-family:var(--mono);font-size:1.1rem;font-weight:400}

/* ---------- action required ---------- */
.todo{display:grid;gap:var(--s2)}
.todo button{display:flex;align-items:center;gap:var(--s2);width:100%;
  text-align:left;background:none;border:0;cursor:pointer;padding:var(--s1) 0}
.todo button:hover .what{text-decoration:underline;text-underline-offset:3px}
.todo .ic{width:2rem;height:2rem;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;font-family:var(--mono);font-size:.6875rem}
.todo .ic.red{background:#F3E3E3;color:#8C2F2F}
.todo .ic.amber{background:#F6EEDC;color:#8A6A18}
.todo .ic.green{background:#E6EDE4;color:#3F6B45}
.todo .what{display:grid;line-height:1.3}
.todo .what b{font-weight:400;font-size:.9375rem}
.todo .what span{font-size:.8125rem;color:var(--muted)}
.todo .clear{margin:0;color:var(--muted);font-size:.9375rem}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:.9375rem}
.scroll{overflow-x:auto}
th{text-align:left;font-family:var(--mono);font-size:.5625rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:400;white-space:nowrap;
  padding:0 var(--s2) var(--s2) 0;border-bottom:1px solid var(--hair)}
td{padding:var(--s2) var(--s2) var(--s2) 0;border-bottom:1px solid var(--hair);
  vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.low{color:#8A6A18}
td.out{color:var(--claret)}
.sw{width:1.4rem;height:1.4rem;display:inline-block;vertical-align:middle;
  border-radius:.2rem;background:var(--g,#888)}
.tag{font-family:var(--mono);font-size:.5rem;letter-spacing:.12em;
  text-transform:uppercase;padding:2px var(--s1);border-radius:.25rem;
  background:var(--under);white-space:nowrap}
.tag.new{background:#EDEAE4}
.tag.making{background:#F6EEDC;color:#8A6A18}
.tag.packed{background:#E7EBF2;color:#3A4A6B}
.tag.shipped{background:#E6EDE4;color:#3F6B45}
.tag.delivered{background:#E6EDE4;color:#3F6B45}
.tag.cancelled{background:#F3E3E3;color:#8C2F2F}

/* ---------- the gate ---------- */
.gate{max-width:24rem;margin:var(--sy) auto;display:grid;gap:var(--s3)}
.gate p{margin:0;color:var(--muted);font-size:.9375rem;line-height:1.6}
.f{display:grid;gap:var(--s0);margin:0}
.f label{font-size:.8125rem;color:var(--muted)}
.f input,.f select{width:100%;background:var(--room);border:1px solid var(--hair);
  padding:0 var(--s2);min-height:2.875rem;font-size:1rem;color:var(--ink);
  border-radius:.4rem}
.f input:focus,.f select:focus{outline:0;border-color:var(--ink)}
.btn{border:1px solid currentColor;background:none;padding:var(--s3) var(--s5);
  font-family:var(--mono);font-size:.6875rem;letter-spacing:.18em;
  text-transform:uppercase;cursor:pointer;border-radius:.4rem;
  transition:background-color .35s var(--settle),color .35s var(--settle)}
.btn:hover{background:var(--ink);color:var(--room)}
.btn.small{padding:var(--s1) var(--s3);font-size:.5625rem;letter-spacing:.14em}
.note{margin:0;font-size:.8125rem;line-height:1.6}
.note.bad{color:var(--claret)}

input.cell{width:5.5rem;background:var(--room);border:1px solid var(--hair);
  padding:var(--s1);font-family:var(--mono);font-size:.8125rem;color:var(--ink);
  border-radius:.3rem}
input.cell:focus{outline:0;border-color:var(--ink)}
input.cell.saved{border-color:var(--ink);background:var(--under)}
/* A field that did not save must not sit there looking like one that did. It
   keeps the mark until somebody edits it again — a flash would be gone before
   the person who caused it looked up. */
.unsaved,input.cell.unsaved,select.cell.unsaved{
  border:1px solid var(--claret)!important;outline:1px solid var(--claret);
  outline-offset:1px;color:var(--claret)}
.note-bar{position:fixed;left:50%;bottom:var(--s4);transform:translate(-50%,1rem);
  max-width:min(44rem,calc(100vw - 2rem));z-index:60;
  background:var(--ink);color:var(--room);border-radius:.4rem;
  padding:var(--s3) var(--s5);font-size:.8125rem;line-height:1.5;
  box-shadow:0 .5rem 2rem rgba(0,0,0,.22);
  opacity:0;pointer-events:none;
  transition:opacity .3s var(--settle),transform .3s var(--settle)}
.note-bar.on{opacity:1;transform:translate(-50%,0)}
.note-bar.good{background:var(--under);color:var(--ink)}
@media print{.note-bar{display:none!important}}
.wide{width:100%;max-width:22rem}
/* In a table cell, width:100% resolves against a column that is sizing itself
   from its content — so the field collapses to the width of its placeholder.
   A min-width gives the column something real to size from. */
td .cell.wide{min-width:13rem}
select.cell{background:var(--room);border:1px solid var(--hair);padding:var(--s1);
  font-family:var(--mono);font-size:.75rem;color:var(--ink);border-radius:.3rem}
.tick{display:inline-flex;align-items:center;gap:var(--s1);cursor:pointer;
  font-family:var(--mono);font-size:.625rem;letter-spacing:.14em;text-transform:uppercase}
.tick input{width:1.1rem;height:1.1rem}
/* the default checkbox is system blue, which is the one colour the house does
   not own — accent-color tints it without rebuilding the control */
input[type=checkbox],input[type=radio]{accent-color:var(--ink)}
.empty{padding:var(--s5) 0;color:var(--muted);max-width:52ch;line-height:1.6}
.hint{margin:0 0 var(--s3);color:var(--muted);font-size:.875rem;line-height:1.6;
  max-width:62ch}
.stock-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s1)}
.stock-grid label{display:grid;gap:var(--s0);font-family:var(--mono);
  font-size:.5625rem;letter-spacing:.12em;color:var(--muted)}
.stock-grid input{width:100%;background:var(--room);border:1px solid var(--hair);
  padding:var(--s1);font-family:var(--mono);font-size:.8125rem;color:var(--ink);
  text-align:center;border-radius:.3rem}
.stock-grid input.zero{border-color:var(--claret);color:var(--claret)}
.stock-grid input.low{border-color:#8A6A18}
.filters{display:flex;flex-wrap:wrap;gap:var(--s1);margin:0 0 var(--s4)}
/* ---------- the toolbar above a list ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:var(--s1);margin:0 0 var(--s3)}
.tab{font-family:var(--mono);font-size:.5625rem;letter-spacing:.14em;
  text-transform:uppercase;padding:var(--s2) var(--s3);border-radius:.4rem;
  border:1px solid var(--hair);background:var(--room);cursor:pointer;
  color:var(--muted);display:inline-flex;gap:var(--s1);align-items:center}
.tab b{font-weight:400;color:var(--ink)}
.tab[aria-selected="true"]{border-color:var(--ink);color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;
  margin:0 0 var(--s3)}
.search{flex:1;min-width:14rem;position:relative}
.search input{width:100%;background:var(--room);border:1px solid var(--hair);
  border-radius:.4rem;padding:0 var(--s3);min-height:2.5rem;font-size:.9375rem;
  color:var(--ink)}
.search input:focus{outline:0;border-color:var(--ink)}
/* a toggle button is pressed, not selected — aria-selected belongs to a real
   tablist, and these are plain buttons that filter a table */
.tab[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

/* ---------- the comparison chart ----------
   "Then" is dashed and thin; "now" is solid. Both share one scale, because two
   revenue lines on two axes can be made to tell any story you like. */
.chart .line.was{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 4;opacity:.75}
.legend2{display:flex;gap:var(--s3);margin:var(--s2) 0 0;font-family:var(--mono);
  font-size:.5625rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend2 span{display:inline-flex;align-items:center;gap:var(--s1)}
.legend2 span::before{content:'';width:1.1rem;height:0;border-top:2px solid var(--ink)}
.legend2 .then::before{border-top:1px dashed var(--muted)}
.card h3 .more{cursor:default}
.card h3 .more[data-go]{cursor:pointer}
.sub-h{margin:var(--s4) 0 var(--s2);font-size:.8125rem;font-weight:400;
  color:var(--muted)}
.ranges{display:flex;gap:var(--s1);flex-wrap:wrap}

/* ---------- reports ---------- */
.rep{display:grid;gap:var(--s2);grid-template-columns:1fr;align-items:start;
  margin-top:var(--s2)}
@media (min-width:60rem){.rep{grid-template-columns:15rem minmax(0,1fr)}}
.rep-side{display:grid;gap:var(--s0);align-content:start}
.rep-side button{text-align:left;background:none;border:1px solid transparent;
  border-radius:.4rem;padding:var(--s2) var(--s3);cursor:pointer;color:var(--ink);
  font:inherit;display:grid;gap:1px}
.rep-side button span{font-size:.75rem;color:var(--muted);line-height:1.35}
.rep-side button:hover{border-color:var(--hair)}
.rep-side button[aria-current="true"]{background:var(--under);border-color:var(--hair)}

/* ---------- marketing ---------- */
.tag.active,.tag.ready,.tag.done{background:#E6EDE4;color:#3F6B45}
.grid-2 + .scroll{margin-top:var(--s2)}
.tag.scheduled{background:#E7EBF2;color:#3A4A6B}
.tag.expired,.tag.cold{background:#F3E3E3;color:#8C2F2F}
.tag.draft{background:#EDEAE4;color:var(--muted)}
tr.done td{opacity:.5}
.btn.danger{color:var(--claret)}
.btn.danger:hover{background:var(--claret);color:var(--room)}

/* the ring of channels. One circle per slice, rotated so the first begins at
   twelve o'clock rather than three. */
.chan{display:grid;grid-template-columns:auto 1fr;gap:var(--s4);align-items:center}
.donut{width:8.75rem;height:8.75rem;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:16}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:var(--s2)}
.legend li{display:grid;grid-template-columns:auto 1fr auto;gap:var(--s2);
  align-items:center;font-size:.875rem}
.legend i{width:.5rem;height:.5rem;border-radius:50%}
.legend .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);
  font-variant-numeric:tabular-nums}
@media (max-width:40rem){.chan{grid-template-columns:1fr;justify-items:center}}

.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2);
  margin:0 0 var(--s3)}
.mini b{display:block;font-family:var(--mono);font-size:1.375rem;font-weight:400;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini span{font-size:.8125rem;color:var(--muted);line-height:1.4}

.quick{display:grid;gap:var(--s1);margin-top:var(--s3)}
.quick button{text-align:left;background:none;border:1px solid var(--hair);
  border-radius:.4rem;padding:var(--s3);cursor:pointer;display:grid;
  gap:var(--s0);color:var(--ink);font:inherit}
.quick button:hover{border-color:var(--ink)}
.quick b{font-weight:400}
.quick span{font-size:.8125rem;color:var(--muted)}

/* ---------- the two-column make-a-thing screens ---------- */
.grid-side{display:grid;gap:var(--s2);grid-template-columns:1fr;
  align-items:start;margin-top:var(--s2)}
@media (min-width:60rem){.grid-side{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}

.f2{display:grid;gap:var(--s4)}
.f2 p{margin:0;display:grid;gap:var(--s1)}
/* a class that sets display beats the browser's own [hidden] rule, so hiding a
   field by setting .hidden would otherwise do nothing at all */
.f2 p[hidden]{display:none}
/* a hint is a sentence, not a stack — left alone it stretches any button
   inside it across the whole column */
.f2 p.hint{display:block}
.f2 label,.f2 legend{font-size:.8125rem;color:var(--muted);padding:0}
/* text fields only. Without the :not() a checkbox inherits width:100% and a
   2.75rem min-height and renders as a large square box beside its label. */
.f2 input:not([type=checkbox]):not([type=radio]),
.f2 select,.f2 textarea{background:var(--room);border:1px solid var(--hair);
  border-radius:.4rem;padding:var(--s2) var(--s3);min-height:2.75rem;
  font:inherit;font-size:.9375rem;color:var(--ink);width:100%}
.f2 textarea{min-height:8rem;line-height:1.6;resize:vertical}
.f2 input:focus,.f2 select:focus,.f2 textarea:focus{outline:0;border-color:var(--ink)}
.f2 input[readonly]{background:var(--under);color:var(--muted)}
.f2 fieldset{border:0;padding:0;margin:0;display:grid;gap:var(--s2)}
.pair{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media (min-width:34rem){.pair{grid-template-columns:1fr 1fr}}

.picks{display:grid;gap:var(--s1);grid-template-columns:repeat(auto-fit,minmax(11rem,1fr))}
.picks.stack{grid-template-columns:1fr}
.pick{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s3);
  border:1px solid var(--hair);border-radius:.4rem;cursor:pointer}
.pick:has(input:checked){border-color:var(--ink);background:var(--under)}
.pick input{width:1rem;height:1rem;margin-top:.15rem;flex:none}
.pick b{display:block;font-weight:400;font-size:.9375rem}
.pick small{display:block;font-size:.8125rem;color:var(--muted);line-height:1.4}

.row-end{display:flex;gap:var(--s2);justify-content:flex-end;flex-wrap:wrap;
  align-items:center}

.summary{font-size:.9375rem;line-height:1.7}

   positions rather than rename the class — the drag-to-reorder handlers on the

  gap:var(--s1);align-content:start;color:var(--ink)}

  function needsSQL(e) {

  var CHART_RANGE = 'today';

  function deltaHTML(d, against) {
    against = against || 'yesterday';
    if (d === null) return '<span class="delta flat">no figure for ' + against + '</span>';
    if (!d) return '<span class="delta flat">level with ' + against + '</span>';
    return '<span class="delta ' + (d > 0 ? 'up' : 'down') + '">' +
      (d > 0 ? '↑' : '↓') + ' ' + Math.abs(d) + '% vs ' + against + '</span>';
  }

     obvious key is always the right key. */
  function figIcon(k) {
    return '<span class="fig-ic"><svg viewBox="0 0 24 24" aria-hidden="true">' +

  /* An inline SVG line. No chart library: the whole project has no
     dependencies and one graph is not a reason to start. */
  function chart(rows) {
    if (!rows || !rows.length) return '<p class="empty">Nothing to draw yet.</p>';
    var W = 640, H = 180, P = 26;
    var vals = rows.map(function (r) { return Number(r.value) || 0; });
    var top = Math.max.apply(null, vals) || 1;
    var x = function (i) {
      return P + (rows.length === 1 ? 0 : i * (W - P * 2) / (rows.length - 1));
    };
    var y = function (v) { return H - P - (v / top) * (H - P * 2); };
    var pts = rows.map(function (r, i) { return x(i) + ',' + y(vals[i]); });
    var area = 'M' + x(0) + ',' + (H - P) + ' L' + pts.join(' L') +
               ' L' + x(rows.length - 1) + ',' + (H - P) + ' Z';
    var every = Math.ceil(rows.length / 6);
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="none" role="img" aria-label="Revenue over time">' +
      [0, 0.5, 1].map(function (f) {
        var yy = P + f * (H - P * 2);
        return '<line class="grid" x1="' + P + '" y1="' + yy + '" x2="' +
          (W - P) + '" y2="' + yy + '"/>';
      }).join('') +
      '<path class="area" d="' + area + '"/>' +
      '<polyline class="line" points="' + pts.join(' ') + '"/>' +
      rows.map(function (r, i) {
        return (i % every === 0 || i === rows.length - 1)
          ? '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' +

      '<circle class="dot" cx="' + x(rows.length - 1) + '" cy="' +
        y(vals[vals.length - 1]) + '" r="3"/>' +
      '</svg>';
  }

  /* ---------- orders ----------

  var FLOW = ['new','making','packed','shipped','delivered','cancelled'];

     all write that — a stranger can post an order whose slug is a quote and an
     onerror. It landed in a src= attribute untouched, in the one browser that
     is holding the house's own sign-in.

     Two guards, not one. The shape test says what a slug IS, so nothing that
     is not a slug ever reaches the page; the escaping says that even a
     harmless-looking one cannot close the attribute it sits in. Either alone
     is one mistake away from being no guard at all. The name and the neck
     beside it were escaped from the start, so this was an oversight rather
     than a decision, and it is worth saying so. */
  function thumbFor(slug) {

          }, 350);

  /* ---------- the order panel ---------- */

  /* ---------- one order: invoice and label ----------
     Both are printed from settings the house fills in once. A fact that has
     not been given is not invented — the line simply does not appear, and the
     screen says which one is missing. A tax invoice with a made-up GSTIN is
     worse than no invoice at all. */

  var SET = {};
  function loadSettings() {
    if (SET.__loaded) return Promise.resolve(SET);
    return A.settings().then(function (rows) {
      (rows || []).forEach(function (r) { SET[r.key] = r.value; });
      SET.__loaded = true; return SET;
    });
  }

  function invoicePage(id) {
    here = 'order'; drawNav(); closeOver();
    shell(waiting());
    Promise.all([A.order(id), A.tax(id), loadSettings()]).then(function (r) {
      var o = r[0], t = r[1] || {};
      /* An EMPTY field is not the only way an invoice can be illegal, and it is
         the less dangerous way: a blank GSTIN is obviously blank, whereas a
         stand-in one looks exactly like a real one on a printed page. So the
         check is "are these facts confirmed real", not "is there text here". */
      var real = String(SET.facts_are_real).toLowerCase() === 'true';
      var missing = [];
      if (!SET.gstin) missing.push('GSTIN');
      if (!SET.registered_address) missing.push('registered address');

      var items = (o.items || []).map(function (i) {
        return '<tr><td>' + esc(i.name || i.slug) + '<br><span class="small">HSN ' +
          esc(SET.hsn_code || '6205') + ' &middot; neck ' + esc(i.size) + '</span></td>' +
          '<td class="mono">' + (i.qty || 1) + '</td>' +
          '<td class="mono">' + rupees(i.price) + '</td>' +
          '<td class="mono">' + rupees((i.price || 0) * (i.qty || 1)) + '</td></tr>';
      }).join('');

      var taxRows = t.same_state
        ? '<tr class="tot"><td colspan="3">CGST @ ' + (Number(SET.gst_rate || 12) / 2) +
            '%</td><td class="mono">' + rupees(t.cgst) + '</td></tr>' +
          '<tr class="tot"><td colspan="3">SGST @ ' + (Number(SET.gst_rate || 12) / 2) +
            '%</td><td class="mono">' + rupees(t.sgst) + '</td></tr>'
        : '<tr class="tot"><td colspan="3">IGST @ ' + (SET.gst_rate || 12) +
            '%</td><td class="mono">' + rupees(t.igst) + '</td></tr>';

      body(
        '<div class="filters">' +
          '<button class="btn small" data-go="orders">&larr; All orders</button>' +
          '<button class="btn small" id="stamp">Number this invoice</button>' +
          '<button class="btn small" onclick="window.print()">Print</button>' +
        '</div>' +
        (missing.length
          ? '<p class="missing-fact">This invoice is not yet legal: no ' +
            esc(missing.join(' and ')) + '. Fill it in under Settings and it ' +
            'appears here and on the site. Nothing is invented in the meantime.</p>'
          : !real
            ? '<p class="missing-fact"><b>SPECIMEN — do not send this to a ' +
              'customer.</b><br>The seller details on it are stand-ins, put ' +
              'there so this page could be built and checked. A printed invoice ' +
              'carrying an invented GSTIN is the one document here that causes ' +
              'real trouble if it leaves the building. Enter the house’s own ' +
              'facts under Settings and switch <code>facts_are_real</code> on.</p>'
            : '') +

        '<div class="paper">' +
          '<div class="row"><div>' +
            '<h2>' + esc(SET.legal_name || 'Artisan Apparels') + '</h2>' +
            (SET.registered_address
              ? '<div class="small">' + esc(SET.registered_address) + '</div>' : '') +
            (SET.gstin ? '<div class="small">GSTIN ' + esc(SET.gstin) + '</div>' : '') +
          '</div><div style="text-align:right">' +
            '<div><b>Tax invoice</b></div>' +
            '<div class="mono">' + esc(o.invoice_no || 'not numbered yet') + '</div>' +
            '<div class="small mono">Order ' + esc(o.ref) + '</div>' +
            '<div class="small mono">' + day(o.placed_at) + '</div>' +
          '</div></div>' +

          '<div class="row"><div><b>Billed to</b><br>' + esc(o.name) + '<br>' +
            esc(o.address || '') + '<br>' + esc(o.city || '') + ' ' +
            esc(o.pincode || '') + '<br>' + esc(o.state || '') + '<br>' +
            esc(o.phone) + '</div></div>' +

          '<table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th>' +
          '</tr></thead><tbody>' + items +
            '<tr class="tot"><td colspan="3">Taxable value</td>' +
              '<td class="mono">' + rupees(t.taxable) + '</td></tr>' +
            taxRows +
            '<tr class="grand"><td colspan="3">Total</td>' +
              '<td class="mono">' + rupees(t.total) + '</td></tr>' +
          '</tbody></table>' +
          '<p class="small">Prices include GST. ' +
            (t.same_state ? 'Supply within ' + esc(SET.state_name || 'Telangana') + '.'
                          : 'Inter-state supply.') + '</p>' +
        '</div>' +

        '<div class="label-box">' +
          '<div class="small">' + esc(SET.legal_name || 'Artisan Apparels') +
            (SET.courier_name ? ' &middot; via ' + esc(SET.courier_name) : '') + '</div>' +
          '<div class="to">' + esc(o.name) + '</div>' +
          '<div>' + esc(o.address || '') + '</div>' +
          '<div>' + esc(o.city || '') + ' ' + esc(o.pincode || '') + '</div>' +
          '<div>' + esc(o.state || '') + '</div>' +
          '<div class="mono">' + esc(o.phone) + '</div>' +
          '<div class="ref">' + esc(o.ref) + '</div>' +
        '</div>'
      );

      var st = document.getElementById('stamp');
      if (st) st.addEventListener('click', function () {
        /* This opened the order panel afterwards, so the invoice underneath
           still read "not numbered yet" and the house pressed the button
           again. The invoice is what changed, so the invoice is what redraws. */
        st.disabled = true;
        A.invoiceNo(o.id).then(function () { invoicePage(o.id); }, function (err) {
          st.disabled = false;
          tell('The invoice could not be numbered. ' + ((err && err.message) || ''));
        });
      });
    }).catch(function (e) { body(needsSQL(e)); });

  /* ---------- returns ---------- */

  var STAGES = ['requested','approved','pickup','received','inspected','done'];
  var WHY = { too_small:'Too small', too_large:'Too large', fabric:'Fabric',
    colour:'Colour', defect:'Defect', wrong:'Wrong product', other:'Other' };

  var rfilter = 'all';

  function returns() {

      var counts = {};
      rows.forEach(function (r) { counts[r.stage] = (counts[r.stage] || 0) + 1; });
      var tabs = [['all','All',rows.length]].concat(STAGES.map(function (st) {

          (rfilter === t[0]) + '">' + esc(t[1]) + ' <b>' + t[2] + '</b></button>';
      }).join('');

        : rows.filter(function (r) { return r.stage === rfilter; });

      body('<div class="tabs">' + tabs + '</div>' + (shown.length
        ? '<p class="hint">The reason is worth more than the refund. A cloth that ' +
          'keeps coming back in one neck means the block is wrong on that cut, ' +
          'not that the customer was.</p>' +
          '<div class="card"><div class="scroll"><table><thead><tr>' +
          '<th>Order</th><th>Cloth</th><th>Neck</th><th>Why</th><th>Wants</th>' +
          '<th>Kind</th><th>Opened</th><th>Stage</th></tr></thead><tbody>' +
          shown.map(function (r) {
            return '<tr><td class="num">' + esc(r.order_ref) + '</td>' +

              '<td class="num">' + esc(r.size) + '</td>' +
              '<td>' + esc(WHY[r.reason] || r.reason || '—') + '</td>' +
              '<td class="num">' + esc(r.want_size || '—') + '</td>' +
              '<td><span class="tag">' + esc(r.kind) + '</span></td>' +
              '<td class="num">' + day(r.opened_at) + '</td>' +

                    (st === r.stage ? ' selected' : '') + '>' + st + '</option>';
                }).join('') + '</select></td></tr>';
          }).join('') + '</tbody></table></div></div>'
        : '<p class="empty">Nothing in that stage. For a shirt shop most returns ' +
          'will be neck exchanges rather than refunds — when they start arriving, ' +
          'the reason column is the one to read.</p>'));
    }).catch(function (e) { body(needsSQL(e)); });

  /* ---------- customers ----------

     This was a report. Three hundred rows, no search, no paging, and not one
     attribute on any cell that could be clicked — so customer three hundred
     and one did not exist as far as the desk was concerned, and the screen
     never said so. It reads customer_lifecycle now, a page at a time, with the
     same shape as Orders down to the pager and the debounce, because the house
     already knows how that screen behaves and should not have to learn a
     second set of habits.

     The usual neck has gone from this table, and that is a real loss worth
     naming: it came out of customer_list, which is keyed on the phone number
     and therefore has no account id to open. It is worked out from his own
     orders on his own page instead, where it is more use anyway. */

  var cstage = 'all', cfind = '', cpage = 0, CSIZE = 12;
  var STAGE_ORDER = ['lead','measured','first order','repeat','lapsed'];

  function personName(p) {
    var n = ((p.first_name || '') + ' ' + (p.last_name || ''))
      .replace(/\s+/g, ' ').trim();
    return n || p.phone || p.email || 'Somebody';
  }
  /* The stage is a phrase — "first order" — and a class cannot carry a space,
     so the word the stylesheet knows is the first one. */
  function stageClass(s) { return 'st-' + String(s || '').split(' ')[0]; }
  /* The stage is written by a CASE in the view and can only ever be one of
     five words, so nothing a customer typed can reach here. It is escaped
     anyway: the day somebody widens that CASE is not the day to discover that
     this one attribute was the exception. */
  function stageTagFor(s) {
    return '<span class="tag ' + esc(stageClass(s)) + '">' +
      esc(s || 'unknown') + '</span>';
  }
  function chip(t) { return '<span class="chip">' + esc(t) + '</span>'; }

  function customers() {
    Promise.all([
      A.accountsPage({ stage: cstage, find: cfind, page: cpage, size: CSIZE }),
      A.stages().catch(nil)
    ]).then(function (r) {
      var rows = r[0].rows || [], total = r[0].total || 0, buckets = r[1] || [];
      /* One request for every tag on this page, never one per row. Tags are
         worth nothing if reading them costs a screen its speed. */
      return A.tagsForPage(rows.map(function (c) { return c.profile_id; }))
        .catch(nil)
        .then(function (tags) { drawCustomers(rows, total, buckets, tags); });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function drawCustomers(rows, total, buckets, tags) {
    var carried = {};
    (tags || []).forEach(function (t) {
      (carried[t.profile_id] = carried[t.profile_id] || []).push(t.tag);
    });

    var counted = {}, everyone = 0;
    (buckets || []).forEach(function (b) {
      counted[b.stage] = b.people;
      everyone += Number(b.people || 0);
    });
    var tabs = [['all','Everyone',everyone]].concat(STAGE_ORDER.map(function (s) {
      return [s, s, counted[s] || 0];
    })).map(function (t) {
      return '<button class="tab" data-cstage="' + esc(t[0]) + '" aria-selected="' +
        (cstage === t[0]) + '">' + esc(t[1]) + ' <b>' + t[2] + '</b></button>';
    }).join('');

    var pages = Math.max(1, Math.ceil(total / CSIZE));
    var span = Math.min(pages, 6);
    var start = Math.min(Math.max(0, cpage - Math.floor(span / 2)), pages - span);
    var pager = '<div class="pager"><span class="n">' +
      (total ? 'Showing ' + (cpage * CSIZE + 1) + ' to ' +
        Math.min((cpage + 1) * CSIZE, total) + ' of ' + total : 'None') +
      '</span><span class="pages">' +
      '<button data-cpage="' + (cpage - 1) + '"' + (cpage === 0 ? ' disabled' : '') +
        '>&lsaquo;</button>' +
      Array.apply(null, { length: span }).map(function (_, i) {
        var n = start + i;
        return '<button data-cpage="' + n + '" aria-current="' + (n === cpage) +
          '">' + (n + 1) + '</button>';
      }).join('') +
      '<button data-cpage="' + (cpage + 1) + '"' +
        (cpage >= pages - 1 ? ' disabled' : '') + '>&rsaquo;</button>' +
      '</span></div>';

    body(
      '<div class="tabs">' + tabs + '</div>' +
      '<div class="toolbar"><span class="search">' +
        '<input id="cfind" placeholder="Search by name, mobile or email" ' +
          'value="' + esc(cfind) + '"></span></div>' +
      '<p class="hint">An account exists from the moment somebody buys — nobody ' +
      'is asked to register and nobody keys a customer in. Open a row for his ' +
      'orders, his sittings, what the house has written down about him, and ' +
      'whether he may be written to at all.</p>' +
      (rows.length
        ? '<div class="card"><div class="scroll"><table><thead><tr>' +
          '<th>Who</th><th>Contact</th><th>Stage</th><th>Tags</th><th>Orders</th>' +
          '<th>Lifetime</th><th>Last order</th><th></th></tr></thead><tbody>' +
          rows.map(function (c) {
            var pid = Number(c.profile_id) || 0;
            var mine = carried[c.profile_id] || [];
            return '<tr data-person="' + pid + '">' +
              '<td>' + esc(personName(c)) + '</td>' +
              '<td class="muted">' + esc(c.phone || '—') +
                (c.email ? '<br>' + esc(c.email) : '') + '</td>' +
              '<td>' + stageTagFor(c.stage) + '</td>' +
              '<td>' + (mine.length
                  ? mine.map(chip).join(' ')
                  : '<span class="muted">—</span>') + '</td>' +
              '<td class="num">' + (c.orders || 0) + '</td>' +
              '<td class="num">' + rupees(c.lifetime) + '</td>' +
              '<td class="num">' + day(c.last_order) +
                (c.unsubscribed_at
                  ? '<br><span class="tag cancelled">no contact</span>' : '') + '</td>' +
              '<td><button class="btn small" data-person="' + pid +
                '">Open</button></td></tr>';
          }).join('') + '</tbody></table></div>' + pager + '</div>'
        : '<p class="empty">' + (cfind
            ? 'Nobody matches “' + esc(cfind) + '”.'
            : cstage === 'all'
              ? 'No customers yet. This fills itself the first time somebody ' +
                'buys — an order leaves an account behind it.'
              : 'Nobody is at that stage today.') + '</p>')
    );

    /* Same debounce and same put-the-cursor-back as the orders search, for the
       same reason: the field is redrawn under the person typing into it. */
    var fi = document.getElementById('cfind');
    if (fi) {
      var t;
      fi.addEventListener('input', function () {
        clearTimeout(t);
        t = setTimeout(function () {
          cfind = fi.value.trim(); cpage = 0; customers();
          var again = document.getElementById('cfind');
          if (again) { again.focus(); again.setSelectionRange(9999, 9999); }
        }, 350);
      });
    }
  }

  /* ---------- one customer ----------

     The desk has always held five separate screens about the same man and no
     way to put them beside each other, so the one question anybody actually
     asks at the counter — who is this and what has he had from us? — could not
     be answered without four searches and a good memory.

     Nothing on this page is new information. Every row of it already existed
     somewhere in the database. What is new is that it is in one place under
     his name, and that the house can now write something down.

     It loads in two rounds and never one request per row. The first round is
     everything that hangs off the account id; the second is everything still
     keyed on his mobile, because it was written before accounts existed. The
     returns wait for the first round on purpose — they are found through his
     orders as well as his account, since nothing back-filled returns. */

  var PERSON = null;

  function openPerson(id) {
    PERSON = Number(id) || null;
    here = 'person'; drawNav(); render();
  }

  /* Worked out from his own orders rather than asked for, because no view
     carries it per account and one request per customer to find out which
     collar he takes is exactly the cost this screen is built to avoid. */
  function usualNeck(ords) {
    var seen = {}, best = null;
    (ords || []).forEach(function (o) {
      if (o.status === 'cancelled') return;
      (o.items || []).forEach(function (i) {
        var s = i && i.size;
        if (!s) return;
        seen[s] = (seen[s] || 0) + (Number(i.qty) || 1);
        if (!best || seen[s] > seen[best]) best = s;
      });
    });
    return best;
  }

  function stamp(t) {
    return t ? esc(String(t).slice(0, 16).replace('T', ' ')) : '—';
  }

  function person() {
    if (!PERSON) { here = 'customers'; drawNav(); return render(); }
    var id = PERSON;
    Promise.all([
      A.account(id),
      A.accountLife(id).catch(function () { return {}; }),
      A.accountOrders(id).catch(nil),
      A.notes(id).catch(nil),
      A.tagsOn(id).catch(nil),
      A.tagBook().catch(nil)
    ]).then(function (r) {
      var p = r[0] || {}, life = r[1] || {}, ords = r[2] || [];
      var phone = p.phone || life.phone || '';
      var email = p.email || life.email || '';
      return Promise.all([
        A.accountReturns(id, ords.map(function (o) { return o.id; })).catch(nil),
        A.personEnquiries(phone, email).catch(nil),
        A.personCarts(phone, email).catch(nil),
        A.personSittings(phone).catch(nil),
        A.personCampaigns(phone, email).catch(nil),
        A.campaigns().catch(nil)
      ]).then(function (s) {
        drawPerson({
          id: id, p: p, life: life, orders: ords, notes: r[3] || [],
          mine: r[4] || [], book: r[5] || [], returns: s[0] || [],
          enquiries: s[1] || [], carts: s[2] || [], sittings: s[3] || [],
          sent: s[4] || [], camps: s[5] || []
        });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function drawPerson(d) {
    var p = d.p, life = d.life;
    var phone = p.phone || life.phone || '';
    var email = p.email || life.email || '';
    var name = personName(p.first_name || p.last_name ? p : life);
    var count = Number(life.orders || 0);
    var spent = Number(life.lifetime || 0);

    /* Two facts that look like one. `signed_in` on account_book is user_id
       being present; claimed_at is the day it happened. A man can have bought
       four shirts and never once signed in, and that is worth seeing — it is
       the difference between a customer and an account. */
    var identity =
      '<div class="who-head">' +
        '<h2>' + esc(name) + '</h2>' +
        '<p class="sub">' + esc(phone || 'no mobile on file') +
          (email ? ' &middot; ' + esc(email) : '') + '</p>' +
        '<p class="lines">' + stageTagFor(life.stage) +
          (p.user_id
            ? '<span class="tag delivered">signed in ' + esc(day(p.claimed_at)) + '</span>'
            : '<span class="tag">never signed in</span>') +
          (p.unsubscribed_at
            ? '<span class="tag cancelled">asked to be left alone</span>'
            : p.marketing

    wirePerson(d.id, phone, email);

  /* Every one of these has a failure path, because a write that fails quietly
     is the bug that was hunted across eighteen paths in this file already.

     None of them goes through write(), and that is a decision rather than an
     omission. write() exists for a field whose rendered value IS the database
     — a price, a stock count — and its whole promise is to put that value back
     when a save fails. Everything here is a button that adds something new
     instead: the note in the box is not in the database yet, so "it has been
     put back" would be a lie, and putting it back would empty the box and lose
     the sentence somebody just wrote. So these say what actually happened, the
     way every other action button on this desk does, and the typing stays
     exactly where the house left it.

     Every one of them also puts its own button back on a failure. A button
     that stays disabled reads as "done", which is the opposite of what
     happened. */
  function wirePerson(id, phone, email) {
    function failed(el, what, err) {
      if (el) el.classList.add('unsaved');
      tell(what + ' ' + ((err && err.message) || 'The shop could not be reached.'));
    }

    var box  = document.getElementById('notetext');
    var save = document.getElementById('notesave');
    if (save) save.addEventListener('click', function () {
      var text = ((box && box.value) || '').trim();
      if (!text) { tell('A note with nothing in it is not a note.'); return; }
      save.disabled = true;
      A.addNote(id, text).then(function () { person(); }, function (err) {
        save.disabled = false;
        failed(box, 'That note was not saved and is still in the box, so ' +
                    'nothing has been lost — try again.', err);
      });
    });

    var pick = document.getElementById('tagpick');
    var add  = document.getElementById('tagadd');
    if (add && pick) add.addEventListener('click', function () {
      add.disabled = true;
      A.addTag(id, pick.value).then(function () { person(); }, function (err) {
        add.disabled = false;
        failed(pick, 'That tag was not given. He is unchanged.', err);
      });
    });

    var newTag = document.getElementById('tagnew');
    var make   = document.getElementById('tagmake');
    if (make && newTag) make.addEventListener('click', function () {
      var tag = (newTag.value || '').trim();
      if (!tag) { tell('Give the new tag a word first.'); return; }
      make.disabled = true;
      /* Two writes, and the second only if the first stood. Giving a tag that
         was never made fails on the foreign key, and the house would be told
         twice about one thing going wrong. The two failures are worded apart
         on purpose: a tag that exists but was not given is a different problem
         from one that was never made, and only the first can be retried from
         the list above. */
      A.makeTag(tag, null).then(function () {
        return A.addTag(id, tag).then(function () { person(); }, function (err) {
          make.disabled = false;
          failed(newTag, 'The tag “' + tag + '” was made, but not given to him. ' +
                         'It is in the list above now — try giving it from there.', err);
        });
      }, function (err) {
        make.disabled = false;
        failed(newTag, 'That tag was not made, so nothing was given.', err);
      });
    });

    Array.prototype.slice.call(document.querySelectorAll('[data-untag]'))
      .forEach(function (b) {
        b.addEventListener('click', function () {
          var tag = b.getAttribute('data-untag');
          b.disabled = true;
          A.dropTag(id, tag).then(function () { person(); }, function (err) {
            b.disabled = false;
            failed(null, 'That tag is still on him.', err);
          });
        });
      });

    var out = document.getElementById('optout');
    if (out) out.addEventListener('click', function () {
      if (!confirm('Record that this customer has asked to be left alone? ' +
                   'Every audience will skip him from now on, and only he can ' +
                   'undo it.')) return;
      out.disabled = true;
      A.optOut(phone, email).then(function (done) {
        /* set_marketing() answers false when it could not find an account for
           the number and the address it was handed, and a false that looked
           like a success is precisely the promise the house must not break. */
        if (done === false) {
          out.disabled = false;
          tell('That opt-out was not recorded — the account could not be ' +
               'matched on the mobile or the address held for him.');
          return;
        }
        tell('Recorded. He will be skipped by every audience.', true);
        person();
      }, function (err) {
        out.disabled = false;
        tell('That opt-out was not recorded. ' + ((err && err.message) || ''));
      });
    });
  }

  /* ---------- the range and inventory ---------- */

  function loadRange() {
    return Promise.all([A.products(), A.stock()]).then(function (r) {
      PRODUCTS = r[0]; STOCK = {};
      r[1].forEach(function (i) {
        (STOCK[i.product_id] = STOCK[i.product_id] || {})[i.size] = i.qty;
      });
    });
  }

  function products() {
    Promise.all([loadRange(), A.productStats().catch(function () { return {}; })])
      .then(function (r) {
        var st = r[1] || {};
        var figs = [
          ['Total products', st.total, ''],
          ['Active', st.active, ''],
          ['Out of stock', st.out_of_stock, 'bad'],
          ['Low stock', st.low_stock, 'warn'],
          ['Neck variants', st.variants, ''],
          ['Collections', st.collections, '']
        ].map(function (f) {
          return '<div class="' + f[2] + '"><b>' + (f[1] == null ? 0 : f[1]) +
            '</b><span>' + f[0] + '</span></div>';
        }).join('');

        body('<div class="strip">' + figs + '</div>' +
          '<p class="hint">Price is in whole rupees, inclusive of tax. Untick a ' +
          'cloth to take it off the shop without deleting anything. Open a ' +
          'cloth for its fabric, collar, cuff and photographs.</p>' +
          '<div class="card"><div class="scroll"><table><thead><tr><th></th>' +
          '<th>Cloth</th><th>SKU</th><th>Price</th><th>Necks</th><th>Stock</th>' +
          '<th>Collection</th><th>On the shop</th><th></th></tr></thead><tbody>' +
          PRODUCTS.map(function (p) {
            var s2 = STOCK[p.id] || {};
            var tot = NECKS.reduce(function (a, z) { return a + (+s2[z] || 0); }, 0);
            var gone = NECKS.filter(function (z) { return (+s2[z] || 0) === 0; }).length;
            var th = thumbFor(p.slug);
            return '<tr>' +
              '<td>' + (th ? '<img class="thumb" src="' + th + '" alt="" ' +
                'loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '') +
              '</td>' +
              '<td>' + esc(p.name) + '</td>' +
              '<td class="num muted">' + esc(p.sku || '—') + '</td>' +
              '<td><input class="cell" inputmode="numeric" value="' + p.price +
                '" data-price="' + p.id + '"></td>' +
              '<td class="num">' + (NECKS.length - gone) + ' of ' + NECKS.length + '</td>' +
              '<td class="num ' + (tot === 0 ? 'out' : tot <= 10 ? 'low' : '') + '">' +
                tot + '</td>' +
              '<td>' + esc(p.collection || '—') + '</td>' +
              '<td><label class="tick"><input type="checkbox" data-visible="' +
                p.id + '"' + (p.visible ? ' checked' : '') + '> shown</label></td>' +
              /* the cloth screen — fabric, collar, cuff, the photographs and
                 their order — had been written and finished but nothing on the
                 desk ever pointed at it, so nobody could reach any of it */
              '<td><button class="btn small" data-cloth-open="' + p.id +
                '">Open</button></td>' +
            '</tr>';
          }).join('') + '</tbody></table></div></div>');
      }).catch(function (e) { body(needsSQL(e)); });
  }

  function inventory() {
    Promise.all([loadRange(), A.moves().catch(function () { return []; }),
                 A.invStats().catch(function () { return {}; })])
      .then(function (r) {
        var moves = r[1] || [];
        var iv = r[2] || {};
        var strip = [
          ['Total stock', iv.total_stock, ''],
          ['Running low', iv.low, 'warn'],
          ['Sold out', iv.out, 'bad'],
          ['Received, 30 days', iv.incoming, ''],
          ['Damaged', iv.damaged, 'warn'],
          ['Necks tracked', PRODUCTS.length * NECKS.length, '']
        ].map(function (f) {
          return '<div class="' + f[2] + '"><b>' + (f[1] == null ? 0 : f[1]) +
            '</b><span>' + f[0] + '</span></div>';
        }).join('');
        body('<div class="strip">' + strip + '</div>' +
          '<p class="hint">Type a number and it saves itself, with a reason ' +
          'recorded beside it. Zero marks that neck sold out on the shop \u2014 ' +
          'the size is struck through and cannot be ordered. Whether shoppers ' +
          'see counts at all is under Settings.</p>' +
          '<p class="f" style="max-width:16rem;margin-bottom:var(--s4)">' +
            '<label for="why">Reason for changes</label>' +
            '<select class="cell wide" id="why">' +
              '<option value="new_stock">New stock arrived</option>' +
              '<option value="correction" selected>Correction</option>' +
              '<option value="return">Came back</option>' +
              '<option value="damaged">Damaged</option>' +
              '<option value="sample">Sample</option>' +
            '</select></p>' +
          '<div class="scroll"><table><thead><tr><th>Cloth</th>' +
          '<th>Neck sizes the house cuts</th><th>Total</th></tr></thead><tbody>' +
          PRODUCTS.map(function (p) {
            var s = STOCK[p.id] || {};
            var tot = NECKS.reduce(function (a, z) { return a + (+s[z] || 0); }, 0);
            return '<tr><td>' + esc(p.name) + '</td><td><div class="stock-grid">' +
              NECKS.map(function (z) {
                var q = s[z] == null ? '' : s[z];
                var cls = Number(q) === 0 ? ' zero' : (Number(q) <= 3 ? ' low' : '');
                return '<label>' + z + '<input class="cell' + cls +

          }).join('') + '</tbody></table></div>' +
          '<div class="block"><h3>Recent movements</h3>' + (moves.length
            ? '<div class="scroll"><table><thead><tr><th>When</th><th>Cloth</th>' +
              '<th>Neck</th><th>Change</th><th>Why</th><th>By</th></tr></thead><tbody>' +
              moves.map(function (m) {
                var p = PRODUCTS.filter(function (x) { return x.id === m.product_id; })[0];
                return '<tr><td class="num">' + day(m.at) + '</td>' +
                  '<td>' + esc(p ? p.name : m.product_id) + '</td>' +
                  '<td class="num">' + esc(m.size) + '</td>' +
                  '<td class="num">' + (m.delta > 0 ? '+' : '') + m.delta + '</td>' +
                  '<td>' + esc(m.reason) + '</td>' +
                  '<td class="muted">' + esc(m.by_email || '') + '</td></tr>';
              }).join('') + '</tbody></table></div>'
            : '<p class="empty">No changes recorded yet. Every edit above is ' +
              'logged here with its reason \u2014 which is how anyone answers ' +
              '\u201Cwhere did twelve shirts go?\u201D six months from now.</p>') +
          '</div>');
      }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- analytics ---------- */

  /* Two lines on one grid: this window, and the same window before it. The
     comparison IS the information — ₹1,24,000 means nothing without the
     ₹98,000 it beat, and a single line invites the house to read noise as a
     trend. Dashed for "then", solid for "now", and no second axis: two revenue
     lines share one scale or they are not comparable. */
  function chart2(rows, key, prevKey, label) {
    if (!rows || !rows.length) return '<p class="empty">Nothing to draw yet.</p>';
    var W = 640, H = 190, P = 26;
    var now = rows.map(function (r) { return Number(r[key]) || 0; });
    var was = rows.map(function (r) { return Number(r[prevKey]) || 0; });
    var top = Math.max.apply(null, now.concat(was)) || 1;
    var x = function (i) {
      return P + (rows.length === 1 ? 0 : i * (W - P * 2) / (rows.length - 1));
    };
    var y = function (v) { return H - P - (v / top) * (H - P * 2); };
    var line = function (a) {
      return a.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ');
    };
    var pts = line(now);
    var area = 'M' + x(0) + ',' + (H - P) + ' L' + pts.split(' ').join(' L') +
               ' L' + x(rows.length - 1) + ',' + (H - P) + ' Z';
    var every = Math.ceil(rows.length / 6);
    var anyPrev = was.some(function (v) { return v > 0; });

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H +
      '" preserveAspectRatio="none" role="img" aria-label="' + esc(label) + '">' +
      [0, 0.5, 1].map(function (f) {
        var yy = P + f * (H - P * 2);
        return '<line class="grid" x1="' + P + '" y1="' + yy + '" x2="' +
          (W - P) + '" y2="' + yy + '"/>';
      }).join('') +
      '<path class="area" d="' + area + '"/>' +
      (anyPrev ? '<polyline class="line was" points="' + line(was) + '"/>' : '') +
      '<polyline class="line" points="' + pts + '"/>' +
      rows.map(function (r, i) {
        return (i % every === 0 || i === rows.length - 1)
          ? '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' +
            esc(r.label) + '</text>'
          : '';
      }).join('') +
      '<circle class="dot" cx="' + x(rows.length - 1) + '" cy="' +
        y(now[now.length - 1]) + '" r="3"/>' +
      '</svg>' +
      '<p class="legend2"><span class="now">This period</span>' +
      (anyPrev ? '<span class="then">Previous period</span>'
               : '<span class="muted">nothing to compare with yet</span>') + '</p>';
  }

  /* ---------- analytics ----------
     The mockup asked for six figures, two comparison lines, a channel ring,
     best sellers, campaign performance and customer insight. All of it is here
     except a payment-method split, which cannot be honest until there is a
     payment gateway — every order is 'prepaid' by default today, and a pie of
     UPI against cards would be a drawing, not a measurement. */

  var A_RANGE = '30d';

  function analytics() {
    Promise.all([
      A.aKpis(), A.aSeries(A_RANGE), A.traffic(), A.best().catch(nil),
      A.campaignResults().catch(nil), A.insights().catch(function () { return {}; }),
      A.locations().catch(nil), A.devices().catch(nil), A.funnel()
    ]).then(function (r) {
      var k = r[0] || {}, series = r[1] || [], chans = r[2] || [], best = r[3] || [],
          camps = r[4] || [], ins = r[5] || {}, locs = r[6] || [], devs = r[7] || [],
          f = r[8] || {};

      var figs = [
        ['money', 'Revenue', rupees(k.revenue), pct(k.revenue, k.revenue_before)],
        ['cart', 'Orders', k.orders || 0, pct(k.orders, k.orders_before)],
        ['customers', 'Customers', k.customers || 0, pct(k.customers, k.customers_before)],
        ['tag', 'Average order', rupees(k.aov), pct(k.aov, k.aov_before)],
        ['rise', 'Conversion', (k.conversion || 0) + '%', pct(k.conversion, k.conversion_before)],
        ['back', 'Refund rate', (k.refund_rate || 0) + '%', null]
      ].map(function (x) {
        return '<div class="fig-box">' + figIcon(x[0]) +
          '<span class="lab">' + x[1] + '</span><b>' + esc(x[2]) + '</b>' +
          (x[3] === null ? '<span class="delta flat">30 days</span>'
                        : deltaHTML(x[3], 'the 30 days before')) +
          '</div>';
      }).join('');

      var ranges = [['today','Today'],['7d','7 days'],['30d','30 days'],['12m','12 months']]
        .map(function (x) {
          return '<button class="range" data-arange="' + x[0] + '" aria-pressed="' +
            (A_RANGE === x[0]) + '">' + x[1] + '</button>';
        }).join('');

      var total = chans.reduce(function (a, c) { return a + Number(c.revenue || 0); }, 0);
      var TONE = ['#2F6F5B','#B08A46','#7A6A9B','#A65A4A','#5B7C99','#8A8578'];
      var chanBlock = total
        ? '<div class="chan">' + donut(chans, total) +
            '<ul class="legend">' + chans.slice(0, 6).map(function (c, i) {
              return '<li><i style="background:' + TONE[i % TONE.length] + '"></i>' +
                '<span class="nm">' + esc(c.channel) + '</span>' +
                '<span class="n">' + rupees(c.revenue) + '</span></li>';
            }).join('') + '</ul></div>'
        : '<p class="empty">No orders carry a channel yet. Put ' +
          '<code>?utm_source=instagram</code> on a link and both the visits and ' +
          'the orders it brings appear here.</p>';

      /* The largest drop on the site is bag to paid, and it was reported as one
         step with nothing in the middle — so nobody could tell a shop that
         loses people at the bag from one that loses them at the address form.
         `started_checkout` sits LAST on the funnel view, because create or
         replace may only add columns to the end and dropping a view the desk
         is reading at ten in the morning is how a dashboard breaks. Its place
         in the journey is here, between the bag and the order, and the journey
         is what this list is. */
      var steps = [['Visited the site', f.visitors],
                   ['Opened a cloth', f.viewed_a_cloth],
                   ['Chose a neck', f.chose_a_size],
                   ['Added to cart', f.added_to_cart],
                   ['Started checkout', f.started_checkout],
                   ['Ordered', f.ordered]];
      var topv = Math.max(1, f.visitors || 1);

      body(
        '<div class="toolbar"><div class="ranges">' + ranges + '</div></div>' +
        '<div class="figs">' + figs + '</div>' +

        '<div class="grid-2">' +
          '<div class="card"><h3>Revenue<span class="more">' + esc(rupees(k.revenue)) +
            '</span></h3>' + chart2(series, 'revenue', 'prev_revenue', 'Revenue over time') +
          '</div>' +
          '<div class="card"><h3>Orders<span class="more">' + (k.orders || 0) +
            '</span></h3>' + chart2(series, 'order_count', 'prev_order_count', 'Orders over time') +
          '</div>' +
        '</div>' +

        '<div class="grid-2">' +
          '<div class="card"><h3>Where the money came from' +
            '<span class="more" data-go="marketing">Marketing</span></h3>' +
            chanBlock + '</div>' +
          '<div class="card"><h3>Where the shop loses people</h3>' +
            '<div class="funnel">' + steps.map(function (s) {
              var n = s[1] || 0, pc = Math.round(n / topv * 100);
              return '<div class="step"><span>' + s[0] + '</span>' +
                '<span class="bar"><i style="width:' + pc + '%"></i></span>' +
                '<span class="n">' + n + ' <span class="pc">' + pc + '%</span></span></div>';
            }).join('') + '</div>' +
            '<p class="hint" style="margin-top:var(--s3)">Thirty days, nobody ' +
            'identified. The gap between two rows is the shop’s biggest ' +
            'problem, whatever it is.</p></div>' +
        '</div>' +

        '<div class="grid-3">' +
          '<div class="card"><h3>Best selling' +
            '<span class="more" data-go="products">All</span></h3>' + (best.length
            ? '<div class="scroll"><table><thead><tr><th>Cloth</th><th>Sold</th>' +
              '<th>Revenue</th></tr></thead><tbody>' +
              best.slice(0, 6).map(function (b) {
                return '<tr><td>' + esc(b.name) + '</td>' +
                  '<td class="num">' + b.sold + '</td>' +
                  '<td class="num">' + rupees(b.revenue) + '</td></tr>';
              }).join('') + '</tbody></table></div>'
            : '<p class="empty">Nothing sold yet.</p>') + '</div>' +

          '<div class="card"><h3>Campaigns' +
            '<span class="more" data-go="campaigns">All</span></h3>' + (camps.length
            ? '<div class="scroll"><table><thead><tr><th>Campaign</th><th>Sent to</th>' +
              '<th>Revenue</th></tr></thead><tbody>' +
              camps.slice(0, 6).map(function (c) {
                return '<tr><td>' + esc(c.name) + '<br><span class="muted">' +
                    esc(c.channel) + '</span></td>' +
                  '<td class="num">' + (c.recipients || 0) + '</td>' +
                  '<td class="num">' + rupees(c.revenue) + '</td></tr>';
              }).join('') + '</tbody></table></div>'
            : '<p class="empty">No campaigns yet.</p>') + '</div>' +

          '<div class="card"><h3>Customers</h3>' +
            '<div class="mini" style="grid-template-columns:1fr 1fr">' +
              '<div><b>' + (ins.new_customers || 0) + '</b><span>new, 30 days</span></div>' +
              '<div><b>' + (ins.returning_customers || 0) + '</b><span>returning</span></div>' +
              '<div><b>' + rupees(ins.lifetime_value) + '</b><span>lifetime value</span></div>' +
              '<div><b>' + (ins.repeat_rate || 0) + '%</b><span>buy again</span></div>' +
            '</div>' +
            (locs.length
              ? '<h4 class="sub-h">Where they are</h4>' +
                '<ul class="legend">' + locs.slice(0, 5).map(function (l) {
                  return '<li><i style="background:var(--hair)"></i>' +
                    '<span class="nm">' + esc(l.place) + '</span>' +
                    '<span class="n">' + rupees(l.revenue) + '</span></li>';
                }).join('') + '</ul>'
              : '') +
          '</div>' +
        '</div>' +

        '<div class="grid-2">' +
          '<div class="card"><h3>Visits by channel</h3>' + (chans.length
            ? '<div class="scroll"><table><thead><tr><th>Channel</th><th>Visits</th>' +
              '<th>Orders</th><th>Conversion</th><th>Revenue</th></tr></thead><tbody>' +
              chans.map(function (c) {
                return '<tr><td>' + esc(c.channel) + '</td>' +
                  '<td class="num">' + (c.sessions || 0) + '</td>' +
                  '<td class="num">' + (c.orders || 0) + '</td>' +
                  '<td class="num">' + (c.conversion === null || c.conversion === undefined
                      ? '—' : c.conversion + '%') + '</td>' +
                  '<td class="num">' + rupees(c.revenue) + '</td></tr>';
              }).join('') + '</tbody></table></div>' +
              '<p class="hint" style="margin-top:var(--s3)">A visit is only ' +
              'attributed from the day the tracker began carrying the channel. ' +
              'Anything recorded before that reads as direct — which is what ' +
              'we know, not a claim about where those people came from.</p>'
            : '<p class="empty">No visits recorded yet.</p>') + '</div>' +

          '<div class="card"><h3>Phone or desktop</h3>' + (devs.length
            ? '<div class="funnel">' + (function () {
                var t = devs.reduce(function (a, d) { return a + Number(d.sessions || 0); }, 0) || 1;
                return devs.map(function (d) {
                  var pcv = Math.round(d.sessions / t * 100);
                  return '<div class="step"><span>' + esc(d.device) + '</span>' +
                    '<span class="bar"><i style="width:' + pcv + '%"></i></span>' +
                    '<span class="n">' + d.sessions + ' <span class="pc">' +
                    pcv + '%</span></span></div>';
                }).join('');
              })() + '</div>'
            : '<p class="empty">No visits recorded yet.</p>') +
            '<p class="hint" style="margin-top:var(--s3)">Two buckets, because ' +
            'the tracker records two. A tablet row would mean guessing.</p>' +
          '</div>' +
        '</div>');
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- the facts the law asks for ----------
     Shown at the top of Settings, above everything else, because until these
     are real the shop is publishing none of them — and a shop that goes live
     without them is the single most expensive mistake on the checklist. */

  function factsBanner(facts, real) {
    if (!facts || !facts.length) return '';
    var missing = facts.filter(function (f) {
      return f.is_placeholder && f.required_by_law;
    });
    if (real && !missing.length) {
      return '<p class="note" style="color:#3F6B45;margin-bottom:var(--s4)">' +
        'The seller details are real and are printed on every page of the shop.</p>';
    }
    return '<div class="missing-fact" style="margin-bottom:var(--s4)">' +
      '<b>The shop is publishing no seller details at all.</b><br>' +
      (missing.length
        ? missing.length + ' of the ' + facts.filter(function (f) {
            return f.required_by_law; }).length +
          ' facts the law requires are still stand-ins: ' +
          missing.map(function (f) { return esc(f.label); }).join(', ') + '.'
        : 'Every fact is filled in, but they have not been confirmed as real yet.') +
      '<br><br>An Indian shop must publish its registered address, its GSTIN and ' +
      'a named Grievance Officer who answers a complaint within 48 hours. Until ' +
      'the real ones are typed in below, the site prints nothing rather than ' +
      'something invented — a complaints line nobody answers is worse than none.' +
      '<br><br>See them as they will look: ' +
      '<a href="index.html?preview=facts" target="_blank" rel="noopener">preview ' +
      'the shop front</a>. Then set <code>facts_are_real</code> to on, below.' +
      '</div>';
  }

  function settings() {
    Promise.all([A.settings(), A.facts().catch(nil)]).then(function (r) {
      var rows = r[0] || [], facts = r[1] || [];
      var realRow = rows.filter(function (s) { return s.key === 'facts_are_real'; })[0];
      var real = realRow && realRow.value === 'true';
      body(factsBanner(facts, real) +
        '<p class="hint">These change the shop the moment they are saved. ' +
        'No deploy, nobody to ask.</p>' +
        '<div class="scroll"><table><thead><tr><th>Setting</th><th>Value</th>' +
        '</tr></thead><tbody>' +
        rows.map(function (s) {
          var isBool = s.value === 'true' || s.value === 'false';
          var field = isBool
            ? '<label class="tick"><input type="checkbox" data-set="' + esc(s.key) +
              '"' + (s.value === 'true' ? ' checked' : '') + '> on</label>'
            : '<input class="cell wide" value="' + esc(s.value) +
              '" data-set="' + esc(s.key) + '">';
          /* A note explains a setting; it is not always a good NAME for one.
             "FALSE while the seller details are stand-ins" beside an unchecked
             box reads as a value being displayed rather than a switch to throw. */
          var label = s.key === 'facts_are_real'
            ? 'The seller details are the house’s real ones' +
              '<br><span class="muted">Leave this off until the client’s own ' +
              'GSTIN, address and Grievance Officer are entered above. While it ' +
              'is off the site publishes none of them.</span>'
            : esc(s.note || s.key);
          return '<tr><td>' + label + '</td><td>' + field + '</td></tr>';
        }).join('') + '</tbody></table></div>');
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- the measurement book ----------
     The most valuable screen here. A returning customer should never be asked
     his neck twice, and a shirt cut from a sheet on file is the whole argument
     for buying the second one from the same house.

     Sittings are kept rather than overwritten: a collar changes, and the old
     numbers are the only explanation for a shirt that fitted in March. */

  var MEAS = [['neck','Neck'],['chest','Chest'],['waist','Waist'],['seat','Seat'],
              ['shoulder','Shoulder'],['sleeve','Sleeve'],['wrist','Wrist'],
              ['shirt_length','Length']];

  function book() {
    A.book().then(function (rows) {
      body('<p class="hint">Every customer the house has measured, most recent ' +
        'sitting first. Open a sheet to see the history or take fresh numbers. ' +
        'Inches throughout.</p>' +
        '<div class="filters"><button class="btn small" data-sheet="new">' +
        'Take a new sitting</button></div>' + (rows.length
        ? '<div class="scroll"><table><thead><tr><th>Who</th><th>Neck</th>' +
          '<th>Chest</th><th>Sleeve</th><th>Fit</th><th>Taken</th>' +
          '</tr></thead><tbody>' +
          rows.map(function (m) {
            return '<tr><td><button class="btn small" data-sheet="' +
                esc(m.phone) + '">' + esc(m.name || m.phone) + '</button>' +
              '<br><span class="muted">' + esc(m.phone) + '</span></td>' +
              '<td class="num">' + esc(m.neck || '—') + '</td>' +
              '<td class="num">' + esc(m.chest || '—') + '</td>' +
              '<td class="num">' + esc(m.sleeve || '—') + '</td>' +
              '<td>' + esc(m.fit || '—') + '</td>' +
              '<td class="num">' + day(m.taken_at) + '</td></tr>';
          }).join('') + '</tbody></table></div>'
        : '<p class="empty">Nobody measured yet. The first sitting you record ' +
          'here is the first thing that brings a customer back.</p>'));
    }).catch(function (e) { body(needsSQL(e)); });
  }

  function sheetForm(m) {
    m = m || {};
    return '<form id="sitting" class="sheet">' +
      '<div class="f3">' +
        fldp('name', 'Name', m.name) +
        fldp('phone', 'Phone', m.phone, m.phone ? 'readonly' : 'required') +
        fldp('email', 'Email', m.email) +
      '</div>' +
      '<div class="meas">' + MEAS.map(function (k) {
        return '<label>' + k[1] + '<input name="' + k[0] + '" type="number" ' +
          'step="0.5" min="0" max="99" value="' + esc(m[k[0]] || '') + '"></label>';
      }).join('') + '</div>' +
      '<div class="f3">' +
        selp('fit', 'Fit', m.fit, ['close','regular','easy']) +
        selp('cuff', 'Cuff', m.cuff, ['single','double']) +
        fldp('collar', 'Collar', m.collar) +
      '</div>' +
      '<label class="f1">Posture and anything else the cutter needs' +
        '<input name="posture" value="' + esc(m.posture || '') + '"></label>' +
      '<label class="f1">Note<input name="note" value=""></label>' +
      '<button class="btn" type="submit">Record this sitting</button>' +
      '<p class="note" id="sitmsg"></p></form>';
  }
  function fldp(n, label, v, extra) {
    return '<label>' + label + '<input name="' + n + '" value="' + esc(v || '') +
      '" ' + (extra || '') + '></label>';
  }
  function selp(n, label, v, opts) {
    return '<label>' + label + '<select name="' + n + '">' +
      ['—'].concat(opts).map(function (o) {
        var val = o === '—' ? '' : o;
        return '<option value="' + val + '"' + (val === (v || '') ? ' selected' : '') +
          '>' + o + '</option>';
      }).join('') + '</select></label>';
  }

  function openSheet(phone) {
    here = 'sheet'; drawNav(); shell(waiting());
    var isNew = phone === 'new';
    (isNew ? Promise.resolve([]) : A.sittings(phone)).then(function (hist) {
      var latest = hist[0] || {};
      body('<div class="filters"><button class="btn small" data-go="book">' +
        '&larr; The book</button></div>' +
        (isNew ? '' : '<p class="hint">' + esc(latest.name || phone) + ' · ' +
          hist.length + ' sitting' + (hist.length === 1 ? '' : 's') +
          '. The numbers below are the latest; recording a new sitting keeps ' +
          'the old one.</p>') +
        sheetForm(isNew ? {} : latest) +
        (hist.length > 1
          ? '<div class="block"><h3>Earlier sittings</h3><div class="scroll">' +
            '<table><thead><tr><th>Taken</th>' +
            MEAS.map(function (k) { return '<th>' + k[1] + '</th>'; }).join('') +
            '<th>By</th></tr></thead><tbody>' +
            hist.slice(1).map(function (s) {
              return '<tr><td class="num">' + day(s.taken_at) + '</td>' +
                MEAS.map(function (k) {
                  return '<td class="num">' + esc(s[k[0]] || '—') + '</td>';
                }).join('') +
                '<td class="muted">' + esc(s.taken_by || '') + '</td></tr>';
            }).join('') + '</tbody></table></div></div>'
          : ''));

      document.getElementById('sitting').addEventListener('submit', function (e) {
        e.preventDefault();
        var f = e.target, row = {}, msg = document.getElementById('sitmsg');
        ['name','phone','email','fit','cuff','collar','posture','note']
          .forEach(function (k) { row[k] = f.elements[k].value.trim() || null; });
        MEAS.forEach(function (k) {
          var v = f.elements[k[0]].value;
          row[k[0]] = v === '' ? null : Number(v);
        });
        if (!row.phone) { msg.textContent = 'A phone number, please — it is how the book finds him.'; msg.className = 'note bad'; return; }
        A.addSitting(row).then(function () { openSheet(row.phone); })
          .catch(function (err) { msg.textContent = err.message; msg.className = 'note bad'; });
      });
    }).catch(function (e) { body(needsSQL(e)); });
  }

  /* ---------- collections ---------- */

  function collections() {
    A.collections().then(function (rows) {
      body('<p class="hint">The groupings the shop sorts cloth into. The order ' +
        'here is the order they appear.</p>' +
        '<form class="filters" id="newcol">' +
          '<input class="cell wide" name="name" placeholder="A new collection" required>' +
